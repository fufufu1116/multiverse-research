name: Multiverse R1 One-Shot Live Canary v1

on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/multiverse-r1-one-shot-live-canary-v1.yml"
      - "governance/MULTIVERSE_R1_OWNER_GATE_ONE_SHOT_LIVE_CANARY_20260821_v1.json"
      - "governance/MULTIVERSE_R1_LIVE_CANARY_AUTHORIZATION_FIXTURE_20260821_v1.json"
      - "governance/MULTIVERSE_R1_ONE_SHOT_LIVE_CANARY_CONTRACT_20260821_v1.json"
      - "tools/multiverse_r1_one_shot_live_canary_v1.py"
      - "governance/MULTIVERSE_R1_LIVE_CANARY_TRIGGER_ONCE_20260821_v1.json"

permissions:
  contents: read

concurrency:
  group: r1-one-shot-live-canary-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-or-run-one-shot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Show exact refs
        run: |
          echo "base=${{ github.event.pull_request.base.sha }}"
          echo "head=${{ github.event.pull_request.head.sha }}"
          git rev-parse HEAD

      - name: Determine validation versus one-shot trigger
        id: mode
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trigger="governance/MULTIVERSE_R1_LIVE_CANARY_TRIGGER_ONCE_20260821_v1.json"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sed '/^$/d' > /tmp/r1_changed_files.txt
          cat /tmp/r1_changed_files.txt
          count="$(wc -l < /tmp/r1_changed_files.txt | tr -d ' ')"
          if [ "$count" = "1" ] && [ "$(cat /tmp/r1_changed_files.txt)" = "$trigger" ]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
          else
            echo "mode=validation" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate dormant framework and authority separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path("governance/MULTIVERSE_R1_OWNER_GATE_ONE_SHOT_LIVE_CANARY_20260821_v1.json").read_text())
          auth = json.loads(Path("governance/MULTIVERSE_R1_LIVE_CANARY_AUTHORIZATION_FIXTURE_20260821_v1.json").read_text())
          contract = json.loads(Path("governance/MULTIVERSE_R1_ONE_SHOT_LIVE_CANARY_CONTRACT_20260821_v1.json").read_text())
          assert gate["status"] == "OWNER_APPROVED_SCOPE_SPECIFIC_ONE_SHOT_LIVE_CANARY_ONLY"
          assert gate["execution_limits"]["max_live_canary_executions"] == 1
          assert gate["execution_limits"]["automatic_retry_authorized"] is False
          assert gate["execution_limits"]["application_network_access_authorized"] is False
          assert gate["execution_limits"]["full_runtime_activation_authorized"] is False
          assert auth["status"] == "CANARY_FIXTURE_ONLY_NOT_PRODUCTION_AUTHORITY"
          assert all(x["owner_gate_ref"] is None for x in auth["decisions"].values())
          assert all(x["permission_class_requested"] in {"P0_READ_PUBLIC_OR_CANONICAL", "P1_REVERSIBLE_INTERNAL_WRITE"} for x in auth["decisions"].values())
          assert contract["one_shot_trigger"]["max_execution_count"] == 1
          assert contract["one_shot_trigger"]["automatic_retry"] is False
          assert contract["runtime_authorization"]["owner_gate_reused_as_operation_grant"] is False
          assert contract["workload"]["network_source_collection"] is False
          assert contract["workload"]["repository_business_state_write"] is False
          assert contract["after_success"]["broader_runtime_activation_authorized"] is False
          PY

      - name: Reject hidden network scheduling retry or alternate activation paths
        run: |
          python - <<'PY'
          from pathlib import Path
          runner = Path("tools/multiverse_r1_one_shot_live_canary_v1.py").read_text()
          for forbidden in ("import requests", "import httpx", "import urllib", "import socket", "import subprocess", "os.system(", "subprocess."):
              assert forbidden not in runner, forbidden
          workflow = Path(".github/workflows/multiverse-r1-one-shot-live-canary-v1.yml").read_text()
          forbidden_tokens = [
              "sche" + "dule:",
              "workflow_" + "dispatch:",
              "pu" + "sh:",
              "re" + "opened",
              "synch" + "ronize",
              "lab" + "eled",
          ]
          for forbidden in forbidden_tokens:
              assert forbidden not in workflow, forbidden
          assert "types: [opened]" in workflow
          assert "contents: read" in workflow
          assert "GITHUB_RUN_ATTEMPT" in workflow
          PY

      - name: Run framework selftest without live trigger
        if: steps.mode.outputs.mode == 'validation'
        run: |
          output="$(python tools/multiverse_r1_one_shot_live_canary_v1.py --selftest)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fx 'OWNER_GATE_OPERATION_GRANT_REUSE=false'
          printf '%s\n' "$output" | grep -Fx 'CANARY_SOURCE_COLLECTION_PERFORMED=false'
          printf '%s\n' "$output" | grep -Fx 'CANARY_EXTERNAL_CONTACT_PERFORMED=false'
          printf '%s\n' "$output" | grep -Fx 'CANARY_REPOSITORY_BUSINESS_WRITE_PERFORMED=false'
          printf '%s\n' "$output" | grep -Fx 'CANARY_FULL_RUNTIME_ACTIVATION_PERFORMED=false'
          printf '%s\n' "$output" | grep -Fx 'MULTIVERSE_R1_ONE_SHOT_LIVE_CANARY_FRAMEWORK_SELFTEST_PASS'

      - name: Confirm default invocation is dormant
        run: |
          test "$(python tools/multiverse_r1_one_shot_live_canary_v1.py)" = "R1_LIVE_CANARY_FRAMEWORK_DORMANT_NO_TRIGGER"

      - name: Enforce exact single-use live trigger
        if: steps.mode.outputs.mode == 'live'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("governance/MULTIVERSE_R1_LIVE_CANARY_TRIGGER_ONCE_20260821_v1.json")
          trigger = json.loads(path.read_text())
          assert trigger["record"] == "MULTIVERSE_R1_LIVE_CANARY_TRIGGER_ONCE_20260821_v1"
          assert trigger["status"] == "ARMED_FOR_SINGLE_OWNER_GATED_CANARY_EXECUTION"
          assert trigger["single_use_nonce"] == "R1-LIVE-CANARY-20260821-ONE-SHOT-v1"
          assert trigger["max_executions"] == 1
          assert trigger["expected_canonical_main"] == os.environ["BASE_SHA"]
          assert trigger["owner_gate_receipt"] == "governance/MULTIVERSE_R1_OWNER_GATE_ONE_SHOT_LIVE_CANARY_20260821_v1.json"
          assert trigger["authorization_fixture"] == "governance/MULTIVERSE_R1_LIVE_CANARY_AUTHORIZATION_FIXTURE_20260821_v1.json"
          assert trigger["contract"] == "governance/MULTIVERSE_R1_ONE_SHOT_LIVE_CANARY_CONTRACT_20260821_v1.json"
          PY

      - name: Execute exactly one bounded live canary
        if: steps.mode.outputs.mode == 'live'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          output="$(python tools/multiverse_r1_one_shot_live_canary_v1.py --run-once --trigger governance/MULTIVERSE_R1_LIVE_CANARY_TRIGGER_ONCE_20260821_v1.json --canonical-main "$BASE_SHA")"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fx 'R1_LIVE_CANARY_ONE_SHOT_PASS'
          printf '%s\n' "$output" | grep -Fx 'CANARY_SOURCE_COLLECTION_PERFORMED=false'
          printf '%s\n' "$output" | grep -Fx 'CANARY_EXTERNAL_CONTACT_PERFORMED=false'
          printf '%s\n' "$output" | grep -Fx 'CANARY_REPOSITORY_BUSINESS_WRITE_PERFORMED=false'
          printf '%s\n' "$output" | grep -Fx 'CANARY_FULL_RUNTIME_ACTIVATION_PERFORMED=false'
