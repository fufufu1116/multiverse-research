# Trigger marker after Gemini re-audit 2026-08-19; runtime semantics unchanged.
name: shadow250-v2-candidate-smoke

on:
  push:
    paths:
      - '.github/workflows/shadow250-v2-candidate-smoke.yml'
      - 'v3/prospective_shadow250_v2/tamano_racecard_row_parser_v2.py'
      - 'v3/prospective_shadow250_v2/keirinjp_identity_locator_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited runtime dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 PyMuPDF pandas
      - name: Run synthetic guards
        run: |
          python v3/prospective_shadow250_v2/tamano_racecard_row_parser_v2.py --synthetic
          python v3/prospective_shadow250_v2/keirinjp_identity_locator_v1.py --synthetic
      - name: Live official-source diagnostic only
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, requests, tempfile, time
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone
          from urllib.parse import urljoin, urlparse, unquote

          # GOVERNANCE: diagnostic/source-validation only. No RESULT/PAYOUT/Price/HOLDOUT/scoring.
          repo=pathlib.Path('.')
          receipt_path=repo/'v3/prospective_shadow250_v2/runtime_receipts/SHADOW250_V2_CANDIDATE_LIVE_SMOKE_v1.json'
          receipt_path.parent.mkdir(parents=True,exist_ok=True)
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); return m
          parser=load('tamano_v2', repo/'v3/prospective_shadow250_v2/tamano_racecard_row_parser_v2.py')
          locator=load('locator_v1', repo/'v3/prospective_shadow250_v2/keirinjp_identity_locator_v1.py')

          out={
              'record':'SHADOW250_V2_CANDIDATE_LIVE_SMOKE_v1',
              'status':'PASS',
              'generated_utc':datetime.now(timezone.utc).isoformat(),
              'workflow_head_sha':os.environ.get('GITHUB_SHA'),
              'scientific_trial_consumed':False,
              'shadow_screen_consumed':False,
              'holdout_accessed':False,
              'result_payout_price_accessed':False,
          }

          # G2: official KEIRIN.JP search -> official racerprofile, identity only.
          resolved=locator.resolve_snum('土井慎二','岡山',127)
          if resolved['snum']!='015918':
              raise RuntimeError('G2 unexpected verified snum')
          out['g2']={
              'status':'PASS',
              'verified_snum':resolved['snum'],
              'candidate_count':len(resolved['candidate_snums']),
              'predictive_features_emitted':resolved['predictive_features_emitted'],
              'raw_html_persisted':resolved['raw_html_persisted'],
              'search_landing_sha256':resolved['search_landing_sha256'],
              'search_result_sha256':resolved['search_result_sha256'],
          }

          # G1: discover exact official Tamano PDF for historical source validation only.
          discovery_url='https://www.tamano-keirin.jp/racepdf/'
          event_day='2026-07-24'
          s=requests.Session()
          h={'User-Agent':'Multiverse-Private-Research/1.0'}
          r=s.get(discovery_url,headers=h,timeout=20,allow_redirects=False)
          if r.status_code in (403,429): raise RuntimeError(f'HALT provider {r.status_code}')
          if r.status_code!=200: raise RuntimeError(f'discovery HTTP {r.status_code}')
          soup=BeautifulSoup(r.content,'html.parser')
          hrefs=[]
          for a in soup.find_all('a',href=True):
              u=urljoin(discovery_url,a['href']); p=urlparse(u)
              if p.scheme=='https' and p.netloc=='www.tamano-keirin.jp' and p.path.startswith('/wp-content/uploads/') and p.path.lower().endswith('.pdf') and not p.query:
                  hrefs.append(u)
          ymd=event_day.replace('-','')
          cand=[]
          for u in sorted(set(hrefs)):
              base=unquote(urlparse(u).path.rsplit('/',1)[-1])
              if base.startswith(ymd): cand.append(u)
          if len(cand)!=1: raise RuntimeError(f'event PDF cardinality={len(cand)}')
          time.sleep(10)
          p=s.get(cand[0],headers=h,timeout=20,allow_redirects=False)
          if p.status_code in (403,429): raise RuntimeError(f'HALT provider {p.status_code}')
          if p.status_code!=200 or not p.content.startswith(b'%PDF-'): raise RuntimeError(f'pdf HTTP/magic {p.status_code}')
          raw_sha=hashlib.sha256(p.content).hexdigest()
          with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
              f.write(p.content); f.flush()
              df=parser.parse_tamano_pdf(f.name,event_day)
          if len(df)!=84 or df['race_id'].nunique()!=12: raise RuntimeError('G1 coverage')
          out['g1']={
              'status':'PASS',
              'event_day':event_day,
              'pdf_url':cand[0],
              'pdf_raw_sha256':raw_sha,
              'rows':len(df),
              'races':int(df['race_id'].nunique()),
              'program_counts':df.groupby('race_program')['race_id'].nunique().to_dict(),
              'date_binding':'PASS',
              'raw_pdf_persisted':False,
          }
          receipt_path.write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(receipt_path.read_text(encoding='utf-8'))
          PY
      - name: Persist PASS receipt to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/prospective_shadow250_v2/runtime_receipts/SHADOW250_V2_CANDIDATE_LIVE_SMOKE_v1.json
          git commit -m 'Record Shadow250-v2 candidate live smoke PASS'
          git push
