name: MULTIVERSE Resume v3 CAS Adoption Runner

on:
  push:
    branches:
      - gate/chat-independent-resume-v3-adoption-cas-prelab-v1
      - gate/chat-independent-resume-v3-adoption-cas-one-shot-v1

permissions:
  contents: write

concurrency:
  group: multiverse-resume-v3-adoption-cas-v1
  cancel-in-progress: false

jobs:
  guarded-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_OLD_MAIN: 5c1403c1f5aabb80d29e8c868440aede8888ce61
      TARGET_MAIN: 040d37f0a4e426cf2e119706484c90cbb48f0e56
      TARGET_MAIN_BRANCH: meta/chat-independent-resume-context-compression-20260902-v3-adoption-transaction-v1
      EXPECTED_OLD_STATE: 6facca0f57383197fb0843824df2c65298cb9cb4
      TARGET_STATE: 3a89d12a2edea0f51723abf28f244194269e340f
      TARGET_STATE_BRANCH: state/multiverse-core-post-resume-v3-adoption-candidate-v1
      PRELAB_GATE_REF: refs/heads/gate/chat-independent-resume-v3-adoption-cas-prelab-v1
      LIVE_GATE_REF: refs/heads/gate/chat-independent-resume-v3-adoption-cas-one-shot-v1
      EVENT_BEFORE: ${{ github.event.before }}
      EVENT_AFTER: ${{ github.event.after }}
    steps:
      - name: Exact event and target binding
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          case "$GITHUB_REF" in
            "$PRELAB_GATE_REF"|"$LIVE_GATE_REF") ;;
            *) echo "CAS_RUNNER_DENIED:UNEXPECTED_GATE_REF"; exit 91 ;;
          esac
          if [ "$EVENT_BEFORE" != "$EXPECTED_OLD_MAIN" ]; then
            echo "CAS_RUNNER_DENIED:GATE_BEFORE_MISMATCH"
            exit 92
          fi
          if [ "$EVENT_AFTER" != "$GITHUB_SHA" ]; then
            echo "CAS_RUNNER_DENIED:GATE_AFTER_MISMATCH"
            exit 93
          fi
          mkdir repo
          cd repo
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/state/multiverse-core-current:refs/remotes/origin/state-current" \
            "refs/heads/${TARGET_MAIN_BRANCH}:refs/remotes/origin/target-main" \
            "refs/heads/${TARGET_STATE_BRANCH}:refs/remotes/origin/target-state"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_OLD_MAIN"
          test "$(git rev-parse refs/remotes/origin/state-current)" = "$EXPECTED_OLD_STATE"
          test "$(git rev-parse refs/remotes/origin/target-main)" = "$TARGET_MAIN"
          test "$(git rev-parse refs/remotes/origin/target-state)" = "$TARGET_STATE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_OLD_MAIN"
          test "$(git ls-remote origin refs/heads/state/multiverse-core-current | awk '{print $1}')" = "$EXPECTED_OLD_STATE"
          git merge-base --is-ancestor "$EXPECTED_OLD_MAIN" "$TARGET_MAIN"
          git merge-base --is-ancestor "$EXPECTED_OLD_STATE" "$TARGET_STATE"
          echo "CAS_RUNNER_BINDING_PASS"
      - name: Prelab exact lease dry-run
        if: github.ref == 'refs/heads/gate/chat-independent-resume-v3-adoption-cas-prelab-v1'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          git push --dry-run --porcelain --force-with-lease="refs/heads/main:${EXPECTED_OLD_MAIN}" origin "${TARGET_MAIN}:refs/heads/main"
          git push --dry-run --porcelain --force-with-lease="refs/heads/state/multiverse-core-current:${EXPECTED_OLD_STATE}" origin "${TARGET_STATE}:refs/heads/state/multiverse-core-current"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_OLD_MAIN"
          test "$(git ls-remote origin refs/heads/state/multiverse-core-current | awk '{print $1}')" = "$EXPECTED_OLD_STATE"
          echo "CAS_RUNNER_PRELAB_DRY_RUN_PASS"
      - name: One-shot CAS main update
        if: github.ref == 'refs/heads/gate/chat-independent-resume-v3-adoption-cas-one-shot-v1'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          git push --porcelain --force-with-lease="refs/heads/main:${EXPECTED_OLD_MAIN}" origin "${TARGET_MAIN}:refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$TARGET_MAIN"
          echo "CAS_RUNNER_MAIN_UPDATE_PASS"
      - name: One-shot CAS Core state update
        if: github.ref == 'refs/heads/gate/chat-independent-resume-v3-adoption-cas-one-shot-v1'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          git push --porcelain --force-with-lease="refs/heads/state/multiverse-core-current:${EXPECTED_OLD_STATE}" origin "${TARGET_STATE}:refs/heads/state/multiverse-core-current"
          test "$(git ls-remote origin refs/heads/state/multiverse-core-current | awk '{print $1}')" = "$TARGET_STATE"
          echo "CAS_RUNNER_STATE_UPDATE_PASS"
      - name: One-shot final nonsecret verification
        if: github.ref == 'refs/heads/gate/chat-independent-resume-v3-adoption-cas-one-shot-v1'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$TARGET_MAIN"
          test "$(git ls-remote origin refs/heads/state/multiverse-core-current | awk '{print $1}')" = "$TARGET_STATE"
          echo "CAS_RUNNER_ONE_SHOT_ADOPTION_PASS runtime=OFF live_authority=false"
