name: keirin-hofu-sep4-racecard-program-href-probe-v1-one-shot
on:
  push:
    paths:
      - '.github/workflows/keirin-hofu-sep4-racecard-program-href-probe-v1-one-shot.yml'
permissions:
  contents: write
jobs:
  href-probe:
    if: github.ref == 'refs/heads/research/keirin-real-evidence-dual-lane-20260901-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Capture sanitized raceprogram-like href shapes before Hofu 1R cutoff
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,re
          from datetime import datetime,timezone
          from urllib.parse import urljoin,urlparse,parse_qsl
          import requests
          from bs4 import BeautifulSoup
          URL='https://keirin.kdreams.jp/hofu/racecard/63202609040100/'
          CUTOFF=datetime(2026,9,3,23,35,0,tzinfo=timezone.utc)
          OUT=pathlib.Path('v3/historical_all_market/research_candidates/KEIRIN_HOFU_SEP4_RACECARD_PROGRAM_HREF_PROBE_20260904_v1.json')
          now=datetime.now(timezone.utc)
          if now>=CUTOFF: raise SystemExit('FAIL_CLOSED_CAPTURE_AT_OR_AFTER_1R_CUTOFF')
          r=requests.get(URL,timeout=20,allow_redirects=False,headers={'User-Agent':'MultiverseKeirinResearch/ProgramHrefProbe1.0','Accept':'text/html,application/xhtml+xml','Cache-Control':'no-cache'})
          if r.status_code!=200: raise SystemExit(f'FAIL_CLOSED_HTTP_{r.status_code}')
          soup=BeautifulSoup(r.content.decode('utf-8','replace'),'html.parser')
          items=[]
          for a in soup.find_all('a',href=True):
              raw=str(a.get('href') or '').strip()
              if 'raceprogram' not in raw.lower(): continue
              resolved=urljoin(URL,raw); p=urlparse(resolved)
              items.append({
                'raw_href':raw,
                'resolved_scheme':p.scheme,
                'resolved_host':p.hostname,
                'resolved_path':p.path,
                'query_keys':sorted({k for k,v in parse_qsl(p.query,keep_blank_values=True)}),
                'has_fragment':bool(p.fragment),
                'exact_same_venue_program_path':bool(p.scheme=='https' and p.hostname=='keirin.kdreams.jp' and re.fullmatch(r'/hofu/raceprogram/\d+/?',p.path) and not p.query and not p.fragment),
              })
          if not items: raise SystemExit('FAIL_CLOSED_NO_RACEPROGRAM_LIKE_HREF')
          exact=[x for x in items if x['exact_same_venue_program_path']]
          doc={'record':'KEIRIN_HOFU_SEP4_RACECARD_PROGRAM_HREF_PROBE_20260904_v1','status':'SANITIZED_PRE_RACEPROGRAM_HREF_SHAPES_CAPTURED','generated_utc':now.isoformat(),'captured_before_1r_cutoff':True,'source_url':URL,'source_sha256':hashlib.sha256(r.content).hexdigest(),'raceprogram_like_href_count':len(items),'exact_same_venue_program_href_count':len(exact),'href_shapes':items,'raw_html_persisted':False,'raw_html_printed':False,'rider_values_persisted':False,'result_accessed':False,'payout_accessed':False,'odds_accessed':False,'forecast_accessed':False,'support_increment_authorized_now':0,'main_or_runtime_mutation':False}
          OUT.write_text(json.dumps(doc,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'record':doc['record'],'status':doc['status'],'raceprogram_like_href_count':len(items),'exact_same_venue_program_href_count':len(exact),'href_shapes':items,'result_accessed':False},ensure_ascii=False,sort_keys=True))
          PY
      - name: Persist sanitized href evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          f='v3/historical_all_market/research_candidates/KEIRIN_HOFU_SEP4_RACECARD_PROGRAM_HREF_PROBE_20260904_v1.json'
          test -f "$f" && git add "$f" || true
          if git diff --cached --quiet; then echo 'no evidence file produced'; exit 0; fi
          git commit -m 'research(keirin): capture Hofu PRE raceprogram href shapes v1'
          git push origin HEAD:${{ github.ref_name }}
