name: MULTIVERSE Automation Orchestrator Role Relay v3 current-main successor pre-Lab

on:
  push:
    branches:
      - agent/automation-orchestrator-role-relay-v3-current-main-successor-20260903-v1
    paths:
      - 'automation/orchestrator_mvp_v2.py'
      - 'automation/orchestrator_role_relay_v3.py'
      - 'automation/test_orchestrator_role_relay_v3.py'
      - 'automation/test_orchestrator_role_relay_v3_integration.py'
      - 'automation/mechanical_gate_orchestrator_role_relay_v3.py'
      - 'automation/README_ORCHESTRATOR_ROLE_RELAY_V3_CURRENT_MAIN_SUCCESSOR.md'
      - '.github/workflows/multiverse-automation-orchestrator-role-relay-v3-current-main-successor-prelab.yml'

permissions:
  contents: read

jobs:
  exact-head-prelab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact head and Fresh main
        shell: bash
        run: |
          set -euo pipefail
          EXACT_HEAD="$(git rev-parse HEAD)"
          FRESH_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${EXACT_HEAD}" = "${GITHUB_SHA}"
          test -n "${FRESH_MAIN}"
          echo "RELAY_V3_SUCCESSOR_EXACT_HEAD=${EXACT_HEAD}" >> "${GITHUB_ENV}"
          echo "RELAY_V3_SUCCESSOR_FRESH_MAIN=${FRESH_MAIN}" >> "${GITHUB_ENV}"
          echo "RELAY_V3_SUCCESSOR_EXACT_HEAD=${EXACT_HEAD}"
          echo "RELAY_V3_SUCCESSOR_FRESH_MAIN=${FRESH_MAIN}"

      - name: Exact-head successor mechanical gate
        shell: bash
        run: |
          set -euo pipefail
          python automation/mechanical_gate_orchestrator_role_relay_v3.py \
            --expected-head "${RELAY_V3_SUCCESSOR_EXACT_HEAD}" \
            --canonical-main "${RELAY_V3_SUCCESSOR_FRESH_MAIN}"

      - name: Nonauthority receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "RELAY_V3_SUCCESSOR_WORKFLOW_DISPATCH_USED=false"
          echo "RELAY_V3_SUCCESSOR_CONTENTS_WRITE_PERMISSION=false"
          echo "RELAY_V3_SUCCESSOR_SECRETS_USED=false"
          echo "RELAY_V3_SUCCESSOR_LIVE_PROVIDER_CONTACT=false"
          echo "RELAY_V3_SUCCESSOR_PROVIDER_SPEND=false"
          echo "RELAY_V3_SUCCESSOR_PRODUCTION_AUTHORITY_GRANTED=false"
          echo "RELAY_V3_SUCCESSOR_CORE_ADOPTION_AUTHORITY=false"
          echo "RELAY_V3_SUCCESSOR_KEIRIN_ADOPTION_AUTHORITY=false"
          echo "RELAY_V3_SUCCESSOR_RUNTIME=OFF"
