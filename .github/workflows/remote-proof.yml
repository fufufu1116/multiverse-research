name: Multiverse Non-Holdout Remote Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run non-holdout remote proof
        run: |
          python proof/non_holdout_remote_proof.py

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiverse-remote-proof-evidence
          path: |
            evidence/
            raw/
            provenance.jsonl
            REMOTE_PROOF_REPORT.json
          if-no-files-found: warn
