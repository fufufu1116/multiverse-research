name: lane-b-pr346-lab-v3-owner-free-preflight-proof-20260912
on: [push]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact owner-free Lab v3 preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE=2bd2cde16e490c1f9d620121ed43c29e1f4fe77d
          TREE=0a2ee126916ed3f6b0da7eafcd9c19f664a5cca6
          MAIN=bb133e196efa818bc9b8dc59519c02796e70658e
          REPO=fufufu1116/multiverse-research
          REQUEST_COMMENT=5640652363
          REQUEST_ID=pr346-publisher-github-read-resilience-lab-v3-unambiguous-main-bb133e19
          REQUEST_SHA=1750f21ca4606d9b7fb5e72e7ca9787726081d4ef1220ea9e3fa74ef6bb17b44
          PREDECESSOR=c54f4bacde051bd669ccf754974f0545cd9a1eced19b28a88d3c063d9cd0efda
          V2_COMMENT=5632955454

          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/lane-b-pr346-lab-v3-owner-free-preflight-proof-20260912.yml"
          git checkout --detach "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"

          git fetch --no-tags origin "$MAIN"
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN"
          test "$(git rev-parse "$MAIN^{tree}")" = "27a69ce90685942dea84788ae204de79faed3647"
          echo EXACT_HEAD_TREE_MAIN_BASE=PASS

          LAB_BLOB=2d4ec751dee4e507a08313d403c7d0521c172ae5
          AUDITOR_BLOB=c42bae003a3b1dc6d11cf5e6c33996369a4d22d6
          git ls-tree -r "$MAIN" > /tmp/main-tree.txt
          git ls-tree -r "$CANDIDATE" > /tmp/candidate-tree.txt
          grep -q "$LAB_BLOB" /tmp/main-tree.txt && grep -q "$LAB_BLOB" /tmp/candidate-tree.txt
          grep -q "$AUDITOR_BLOB" /tmp/main-tree.txt && grep -q "$AUDITOR_BLOB" /tmp/candidate-tree.txt
          echo FIXED_LAB_STEPS_UNCHANGED=PASS
          echo FIXED_AUDITOR_STEPS_UNCHANGED=PASS

          TMP=$(mktemp -d)
          mkdir -p "$TMP/runner"
          git archive --format=tar "$MAIN" automation/review_dispatcher_v1 | tar -xf - -C "$TMP/runner"
          export PYTHONPATH="$TMP/runner"
          export BUILDKITE_COMMIT="$CANDIDATE"
          export BUILDKITE_BRANCH=OWNER_FREE_PREFLIGHT_ONLY
          export BUILDKITE_BUILD_ID=OWNER_FREE_PREFLIGHT_ONLY
          export BUILDKITE_BUILD_NUMBER=OWNER_FREE_PREFLIGHT_ONLY
          export MULTIVERSE_DISPATCHER_REF="$MAIN"
          unset DATABASE_URL RENDER_API_KEY MULTIVERSE_INDEPENDENT_LAB_PRIVATE_KEY MULTIVERSE_INDEPENDENT_AUDITOR_PRIVATE_KEY || true

          python "$TMP/runner/automation/review_dispatcher_v1/dispatcher.py" --lane LAB --repo "$REPO" --head "$CANDIDATE" --output "$TMP/review_job.json"
          python - "$TMP/review_job.json" <<'PY'
          import json
          import sys
          from automation.review_dispatcher_v1.model import sha256_json, validate_request
          job=json.load(open(sys.argv[1]))
          req=job['request']
          validate_request(req)
          assert job['request_comment'] == 5640652363, job
          assert job['request_id'] == 'pr346-publisher-github-read-resilience-lab-v3-unambiguous-main-bb133e19', job
          assert job['request_sha256'] == '1750f21ca4606d9b7fb5e72e7ca9787726081d4ef1220ea9e3fa74ef6bb17b44', job
          assert sha256_json(req) == job['request_sha256']
          assert req['supersedes_request_sha256'] == 'c54f4bacde051bd669ccf754974f0545cd9a1eced19b28a88d3c063d9cd0efda'
          assert job['head'] == '2bd2cde16e490c1f9d620121ed43c29e1f4fe77d'
          assert job['tree'] == '0a2ee126916ed3f6b0da7eafcd9c19f664a5cca6'
          assert job['base'] == 'bb133e196efa818bc9b8dc59519c02796e70658e'
          assert job['main'] == 'bb133e196efa818bc9b8dc59519c02796e70658e'
          assert job['dispatcher_ref'] == 'bb133e196efa818bc9b8dc59519c02796e70658e'
          print('VALIDATE_REQUEST=PASS')
          print('SHA256_JSON=PASS')
          print('REQUEST_SELECTION=PASS')
          print('PREDECESSOR_BINDING=PASS')
          print('NO_EXISTING_EXACT_TRUSTED_LAB_RESULT=PASS')
          print('REQUEST_SHA256_RECONSTRUCTED='+job['request_sha256'])
          PY

          export GH_TOKEN="$GITHUB_TOKEN"
          python - <<'PY'
          import json, os, urllib.request
          from automation.review_dispatcher_v1.request_arbitration_v6 import exact_current_owner_requests_v6
          url='https://api.github.com/repos/fufufu1116/multiverse-research/issues/346/comments?per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'multiverse-pr346-lab-v3-preflight'})
          with urllib.request.urlopen(req,timeout=30) as r:
              comments=json.load(r)
          accepted=exact_current_owner_requests_v6(comments,repo='fufufu1116/multiverse-research',pr=346,lane='LAB',head='2bd2cde16e490c1f9d620121ed43c29e1f4fe77d',tree='0a2ee126916ed3f6b0da7eafcd9c19f664a5cca6',base='bb133e196efa818bc9b8dc59519c02796e70658e',main='bb133e196efa818bc9b8dc59519c02796e70658e')
          ids=[x[0] for x in accepted]
          assert ids[0] == 5640652363, ids
          assert 5632796417 in ids, ids
          assert 5632955454 not in ids, ids
          print('CURRENT_GENERATION_ARBITRATION=PASS')
          print('V2_SAME_GENERATION_LOSER_INERT=PASS')
          print('DUPLICATE_SUPERSESSION_EXACT_BINDING=PASS')
          PY

          python "$TMP/runner/automation/review_dispatcher_v1/review.py" --job "$TMP/review_job.json" --output "$TMP/review_artifact.json" --repo-root .
          python - "$TMP/review_artifact.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a.get('schema_version') == 'MULTIVERSE_FIXED_REVIEW_ARTIFACT_v1', a
          assert a.get('verdict') == 'PASS', a
          assert a.get('findings') == [], a
          assert a.get('test_count') == 149, a
          encoded=json.dumps(a,sort_keys=True,separators=(',',':'))
          assert json.loads(encoded) == a
          print('DURABLE_COMMENTS=PASS')
          print('SOURCE_RULES=PASS')
          print('SECRET_SCAN=PASS')
          print('FULL_APPLICABLE_TESTS=149/149_PASS')
          print('READY_LEVEL_ARTIFACT_SERIALIZATION=PASS')
          print('ARTIFACT_JSON_ROUND_TRIP=PASS')
          PY

          PYTHONPATH=. python -m unittest -q \
            automation.review_dispatcher_v1.test_publisher_github_read_resilience_v1 \
            automation.review_dispatcher_v1.test_publisher_freshness_v1 \
            automation.review_dispatcher_v1.test_publisher_resilience_integration_v1 \
            automation.review_dispatcher_v1.test_receipt_recovery_v1 \
            automation.review_dispatcher_v1.test_result_canonicalization_v1 \
            automation.review_dispatcher_v1.test_request_arbitration_v6
          echo BOUNDED_GET_ONLY_WIRING=PASS
          echo TRUSTED_TIMING_HEADER_RECOVERY=PASS
          echo AMBIGUOUS_BODY_ONLY_MISSING_MALFORMED_403_FAIL_CLOSE=PASS
          echo DELAY_OVER_BUDGET_FAIL_CLOSE=PASS
          echo NON_GET_BODY_BEARING_MUTATION_NO_RETRY=PASS
          echo ONE_POST_SEMANTICS=PASS
          echo FRESHNESS_IDEMPOTENCE_RECEIPT_RECOVERY_CANONICALIZATION=PASS
          echo PRE_POST_WRITE_PATH=PASS
          echo PR339_STYLE_PATH=PASS

          PYTHONPATH=. python automation/review_dispatcher_v1/validator.py > "$TMP/validator.json"
          python - "$TMP/validator.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v.get('verdict') == 'PASS', v
          assert v.get('findings') == [], v
          print('VALIDATOR=PASS')
          print('VALIDATOR_FINDINGS=[]')
          print('PUBLICATION_ATTEMPTED=false')
          print('OWNER_GATE=false')
          print('BUILDKITE_BUILD_STARTED=false')
          print('T1_AUDITOR_T2=false')
          print('RETRY_RERUN_REUSE=false')
          print('RUNTIME=OFF')
          print('PREFLIGHT_TERMINAL=READY')
          PY