name: keirin-hofu-sep4-raceprogram-start-structure-probe-v1-one-shot
on:
  push:
    paths:
      - '.github/workflows/keirin-hofu-sep4-raceprogram-start-structure-probe-v1-one-shot.yml'
permissions:
  contents: write
jobs:
  structure-probe:
    if: github.ref == 'refs/heads/research/keirin-real-evidence-dual-lane-20260901-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Capture only race-number/start-time DOM geometry before Hofu 1R cutoff
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, unicodedata
          from datetime import datetime, timezone
          from urllib.parse import urlparse
          import requests
          from bs4 import BeautifulSoup

          URL='https://keirin.kdreams.jp/hofu/raceprogram/6320260904/'
          EXPECTED_DATE='2026-09-04'
          EXPECTED_VENUE='防府'
          EXPECTED={1:'08:35',2:'08:55',3:'09:15',4:'09:35',5:'09:55',6:'10:15',7:'10:35'}
          CUTOFF=datetime(2026,9,3,23,35,0,tzinfo=timezone.utc)
          OUT=pathlib.Path('v3/historical_all_market/research_candidates/KEIRIN_HOFU_SEP4_RACEPROGRAM_START_STRUCTURE_PROBE_20260904_v1.json')

          def clean(x):
              return re.sub(r'\s+',' ',unicodedata.normalize('NFKC',str(x))).strip()
          captured=datetime.now(timezone.utc)
          if captured >= CUTOFF:
              raise SystemExit('FAIL_CLOSED_CAPTURE_AT_OR_AFTER_HOFU_1R_CUTOFF')
          u=urlparse(URL)
          if u.scheme!='https' or u.hostname!='keirin.kdreams.jp' or u.path!='/hofu/raceprogram/6320260904/' or u.query or u.fragment:
              raise SystemExit('FAIL_CLOSED_URL')
          r=requests.get(URL,timeout=20,allow_redirects=False,headers={'User-Agent':'MultiverseKeirinResearch/StartStructureProbe1.0','Accept':'text/html,application/xhtml+xml','Cache-Control':'no-cache'})
          if r.status_code!=200: raise SystemExit(f'FAIL_CLOSED_HTTP_{r.status_code}')
          if len(r.content)<500 or len(r.content)>4_000_000: raise SystemExit('FAIL_CLOSED_SIZE')
          if 'html' not in (r.headers.get('Content-Type') or '').lower(): raise SystemExit('FAIL_CLOSED_CONTENT_TYPE')
          soup=BeautifulSoup(r.content.decode('utf-8','replace'),'html.parser')
          title=clean(soup.title.get_text(' ',strip=True)) if soup.title else ''
          if EXPECTED_VENUE not in title or not (('2026年09月04日' in title) or ('2026年9月4日' in title)):
              raise SystemExit('FAIL_CLOSED_TITLE_BINDING')

          text_nodes=[]
          for node in soup.find_all(string=True):
              t=clean(node)
              if not t: continue
              if re.fullmatch(r'(?:[1-9]|1[0-2])R',t) or re.fullmatch(r'(?:[01]?\d|2[0-3]):[0-5]\d',t):
                  p=node.parent
                  gp=p.parent if p else None
                  ggp=gp.parent if gp else None
                  text_nodes.append({
                      'text':t,
                      'self_tag':p.name if p else None,
                      'self_class':sorted(p.get('class',[])) if p else [],
                      'parent_tag':gp.name if gp else None,
                      'parent_class':sorted(gp.get('class',[])) if gp else [],
                      'grandparent_tag':ggp.name if ggp else None,
                      'grandparent_class':sorted(ggp.get('class',[])) if ggp else [],
                  })

          marker_counts={}
          for race_no,t in EXPECTED.items():
              marker_counts[str(race_no)]={
                  'race_marker_count':sum(1 for x in text_nodes if x['text']==f'{race_no}R'),
                  'expected_start_marker_count':sum(1 for x in text_nodes if x['text']==t),
              }
          if marker_counts['1']['race_marker_count']<1 or marker_counts['1']['expected_start_marker_count']<1:
              raise SystemExit('FAIL_CLOSED_1R_MARKERS_MISSING')

          doc={
              'record':'KEIRIN_HOFU_SEP4_RACEPROGRAM_START_STRUCTURE_PROBE_20260904_v1',
              'status':'SANITIZED_PRE_RACE_NUMBER_START_TIME_DOM_GEOMETRY_CAPTURED',
              'generated_utc':captured.isoformat(),
              'captured_before_1r_cutoff':True,
              'source_url':URL,
              'source_sha256':hashlib.sha256(r.content).hexdigest(),
              'expected_date':EXPECTED_DATE,
              'expected_venue':EXPECTED_VENUE,
              'expected_frozen_cutoffs_jst':EXPECTED,
              'marker_counts':marker_counts,
              'candidate_nodes':text_nodes,
              'raw_html_persisted':False,
              'raw_html_printed':False,
              'rider_values_persisted':False,
              'result_accessed':False,
              'payout_accessed':False,
              'odds_accessed':False,
              'forecast_accessed':False,
              'support_increment_authorized_now':0,
              'model_fit_authorized':False,
              'main_or_runtime_mutation':False,
          }
          OUT.write_text(json.dumps(doc,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'record':doc['record'],'status':doc['status'],'candidate_node_count':len(text_nodes),'marker_counts':marker_counts,'captured_before_1r_cutoff':True,'result_accessed':False},ensure_ascii=False,sort_keys=True))
          PY
      - name: Persist sanitized start-time structure evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          f='v3/historical_all_market/research_candidates/KEIRIN_HOFU_SEP4_RACEPROGRAM_START_STRUCTURE_PROBE_20260904_v1.json'
          test -f "$f" && git add "$f" || true
          if git diff --cached --quiet; then echo 'no evidence file produced'; exit 0; fi
          git commit -m 'research(keirin): capture Hofu PRE raceprogram start structure v1'
          git push origin HEAD:${{ github.ref_name }}
