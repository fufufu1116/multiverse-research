name: keirin-nara-sep10-assen-row-structure-probe-v2-one-shot
on:
  push:
    paths:
      - '.github/workflows/keirin-nara-sep10-assen-row-structure-probe-v2-one-shot.yml'
permissions:
  contents: write
jobs:
  row-structure:
    if: github.ref == 'refs/heads/research/keirin-real-evidence-dual-lane-20260901-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Capture table-row geometry around frozen known names only
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, unicodedata
          from urllib.parse import urlparse
          import requests
          from bs4 import BeautifulSoup
          URL='https://keirin.kdreams.jp/nara/assen/5320260910/'
          KNOWN=['川口 公太朗','桐山 敬太郎','小林 弘和','長井 妙樹','佐々木 堅次','植原 琢也','中村 圭志','近藤 誠二','牧田 悠生']
          OUT=pathlib.Path('v3/historical_all_market/research_candidates/KEIRIN_NARA_SEP10_ASSEN_ROW_STRUCTURE_PROBE_20260904_v2.json')
          def norm(s):
              s=unicodedata.normalize('NFKC',str(s)); s=unicodedata.normalize('NFC',s)
              return ''.join(ch for ch in s if not ch.isspace())
          r=requests.get(URL,timeout=20,allow_redirects=False,headers={'User-Agent':'MultiverseKeirinResearch/NaraAssenRowStructureProbe2.0','Accept':'text/html,application/xhtml+xml'})
          if r.status_code!=200: raise SystemExit(f'FAIL_CLOSED_HTTP_{r.status_code}')
          if len(r.content)>4_000_000 or len(r.content)<500: raise SystemExit('FAIL_CLOSED_SIZE')
          if 'html' not in (r.headers.get('Content-Type') or '').lower(): raise SystemExit('FAIL_CLOSED_CONTENT_TYPE')
          u=urlparse(URL)
          if u.scheme!='https' or u.hostname!='keirin.kdreams.jp' or u.path!='/nara/assen/5320260910/' or u.query or u.fragment: raise SystemExit('FAIL_CLOSED_URL')
          soup=BeautifulSoup(r.content.decode('utf-8','replace'),'html.parser')
          tables=soup.select('table.assen_s')
          if not tables: raise SystemExit('FAIL_CLOSED_NO_ASSEN_S')
          table_shapes=[]; hit_map=[]
          known_norm={norm(x):x for x in KNOWN}
          seen={x:0 for x in KNOWN}
          for ti,table in enumerate(tables):
              rows=table.find_all('tr')
              shape={'table_index':ti,'row_count':len(rows),'rows':[],'known_hits':[]}
              for ri,tr in enumerate(rows):
                  cells=tr.find_all(['th','td'],recursive=False)
                  shape['rows'].append({'row_index':ri,'cell_count':len(cells),'th_count':sum(c.name=='th' for c in cells),'td_count':sum(c.name=='td' for c in cells)})
                  for ci,c in enumerate(cells):
                      txt=norm(c.get_text(' ',strip=True))
                      if txt in known_norm:
                          name=known_norm[txt]; seen[name]+=1
                          hit={'known_rider_name':name,'table_index':ti,'row_index':ri,'cell_index':ci,'cell_count':len(cells),'cell_tag':c.name}
                          shape['known_hits'].append(hit); hit_map.append(hit)
              table_shapes.append(shape)
          if any(v!=1 for v in seen.values()): raise SystemExit(f'FAIL_CLOSED_KNOWN_CARDINALITY {seen}')
          row_indices=sorted({x['row_index'] for x in hit_map})
          row_signatures=sorted({(x['row_index'],x['cell_count'],x['cell_tag']) for x in hit_map})
          doc={
              'record':'KEIRIN_NARA_SEP10_ASSEN_ROW_STRUCTURE_PROBE_20260904_v2',
              'status':'SANITIZED_TABLE_ROW_GEOMETRY_CAPTURED',
              'source_url':URL,
              'source_sha256':hashlib.sha256(r.content).hexdigest(),
              'table_count':len(tables),
              'table_shapes':table_shapes,
              'known_hit_map':hit_map,
              'known_hit_row_indices':row_indices,
              'known_hit_row_signatures':[[a,b,c] for a,b,c in row_signatures],
              'raw_html_persisted':False,
              'raw_html_printed':False,
              'unrelated_cell_text_emitted':False,
              'predictive_numeric_values_emitted':False,
              'result_accessed':False,
              'payout_accessed':False,
              'odds_emitted':False,
              'forecast_emitted':False,
              'comment_emitted':False,
              'narabiyoso_emitted':False,
              'support_increment_authorized_now':0,
              'model_fit_authorized':False,
              'main_or_runtime_mutation':False
          }
          OUT.write_text(json.dumps(doc,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'record':doc['record'],'table_count':len(tables),'known_hit_row_indices':row_indices,'known_hit_row_signatures':doc['known_hit_row_signatures'],'raw_html_persisted':False,'result_accessed':False},ensure_ascii=False,sort_keys=True))
          PY
      - name: Persist sanitized row-geometry evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          f='v3/historical_all_market/research_candidates/KEIRIN_NARA_SEP10_ASSEN_ROW_STRUCTURE_PROBE_20260904_v2.json'
          test -f "$f" && git add "$f" || true
          if git diff --cached --quiet; then echo 'no evidence file produced'; exit 0; fi
          git commit -m 'research(keirin): capture Nara Sep10 assen row geometry v2'
          git push origin HEAD:${{ github.ref_name }}
