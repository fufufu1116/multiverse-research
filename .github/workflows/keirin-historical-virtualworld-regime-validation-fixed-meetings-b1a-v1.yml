name: Keirin Historical VirtualWorld Regime Validation Fixed Meetings B1a v1

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - v3/historical_all_market/historical_virtualworld_regime_validation_fixed_meetings_b1a_v1.py
      - v3/historical_all_market/research_candidates/KEIRIN_REGIME_VALIDATION_FIXED_MEETINGS_SELECTION_RULE_20260913_v1.json
      - v3/historical_all_market/research_candidates/KEIRIN_REGIME_EXPLANATORY_VALIDATION_PREREGISTRATION_20260913_v1.json
      - v3/historical_all_market/research_candidates/KEIRIN_PRE_REGIME_FIELD_AVAILABILITY_AUDIT_20260913_v1.json
      - .github/workflows/keirin-historical-virtualworld-regime-validation-fixed-meetings-b1a-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-meeting-regime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install numpy requests beautifulsoup4 lxml
      - name: Run preregistered fixed-meeting regime validation
        run: python v3/historical_all_market/historical_virtualworld_regime_validation_fixed_meetings_b1a_v1.py
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-regime-validation-fixed-meetings-b1a-v1
          path: v3/historical_all_market/research_candidates/virtualworld_regime_validation_fixed_meetings_b1a_v1/
          if-no-files-found: warn
