# trigger: restricted smoke v1.2 receipt-commit
name: KEIRINJP Racerprofile Smoke v1

on:
  push:
    paths:
      - '.github/workflows/keirinjp_racerprofile_smoke_v1.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Synthetic hard-limit gate
        run: python v3/prospective/keirinjp_racerprofile_hardlimit_adapter_v1.py --synthetic

      - name: Single authorized live profile smoke
        run: |
          python v3/prospective/keirinjp_racerprofile_hardlimit_adapter_v1.py --smoke 015977 > keirinjp_racerprofile_smoke_receipt_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('keirinjp_racerprofile_smoke_receipt_v1.json')
          d=json.loads(p.read_text())
          required=['registration_number','name','prefecture','term','class','style','profile_updated_at','recent4m_updated_at','win_rate','quinella_rate','trio_rate','score','content_hash']
          miss=[k for k in required if not d.get(k)]
          if miss:
              raise SystemExit('FAIL_CLOSED missing normalized fields: '+','.join(miss))
          if d['registration_number']!='015977':
              raise SystemExit('FAIL_CLOSED wrong rider')
          print(json.dumps({'status':'PASS','registration_number':d['registration_number'],'style':d['style'],'raw_html_persisted':d['raw_html_persisted']},ensure_ascii=False))
          PY

      - name: Upload normalized smoke receipt only
        uses: actions/upload-artifact@v4
        with:
          name: keirinjp-racerprofile-smoke-v1
          path: keirinjp_racerprofile_smoke_receipt_v1.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit PASS receipt to provenance ledger
        run: |
          mkdir -p v3/prospective/runtime_receipts
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          src=Path('keirinjp_racerprofile_smoke_receipt_v1.json')
          d=json.loads(src.read_text())
          adapter=Path('v3/prospective/keirinjp_racerprofile_hardlimit_adapter_v1.py')
          out={
            'record':'KEIRINJP_RACERPROFILE_RUNTIME_SMOKE_PASS_v1',
            'status':'PASS',
            'workflow_commit_sha':os.environ['GITHUB_SHA'],
            'adapter_sha256':hashlib.sha256(adapter.read_bytes()).hexdigest(),
            'registration_number':d['registration_number'],
            'name':d['name'],
            'prefecture':d['prefecture'],
            'term':d['term'],
            'class':d['class'],
            'style':d['style'],
            'profile_updated_at':d['profile_updated_at'],
            'recent4m_updated_at':d['recent4m_updated_at'],
            'win_rate':d['win_rate'],
            'quinella_rate':d['quinella_rate'],
            'trio_rate':d['trio_rate'],
            'score':d['score'],
            'content_hash':d['content_hash'],
            'capture_timestamp_utc':d['capture_timestamp_utc'],
            'raw_html_persisted':False,
            'shadow250_collected':0,
            'scientific_trial_consumed':False
          }
          Path('v3/prospective/runtime_receipts/keirinjp_racerprofile_smoke_pass_v1.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/prospective/runtime_receipts/keirinjp_racerprofile_smoke_pass_v1.json
          git commit -m 'Record KEIRIN.JP racerprofile runtime smoke PASS'
          git push
