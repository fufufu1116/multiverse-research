name: MULTIVERSE V19.7.36 v7r19 Whole Process Credential Drop Pre-Lab

on:
  push:
    branches:
      - agent/r1-stage1-phase-c-v19-7-36-v7r19-whole-process-credential-drop-remediation-v1

permissions:
  contents: read

jobs:
  test-v7r19-whole-process-drop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact event commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin https://github.com/fufufu1116/multiverse-research.git
          git -c protocol.version=2 fetch --depth=140 origin "${GITHUB_SHA}" 9e3811b9df45687935450c5a0b16f2cb7ee5531d
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 9e3811b9df45687935450c5a0b16f2cb7ee5531d HEAD
          main_now="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_now" = 'a6f56facc80709f2e7b8218d927484d522bfa356'
          printf 'PRELAB_V7R19_EXACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PRELAB_V7R19_EXACT_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          printf 'PRELAB_V7R19_CANONICAL_MAIN=%s\n' "$main_now"

      - name: Generate and statically verify v7r19 helper boundary
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          python3 governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R18_HELPER_CREDENTIAL_CONTRACT_PATCHER_20260904.py \
            governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R16_POST_AUTH_CREDENTIAL_DROP_GUARD_20260904.go \
            governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_UI_READY_WRITER_20260901.go /tmp/v7r18-guard.go /tmp/v7r18-helper.go
          python3 governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R19_WHOLE_PROCESS_CREDENTIAL_DROP_PATCHER_20260904.py \
            /tmp/v7r18-guard.go /tmp/v7r18-helper.go /tmp/v7r19-guard.go /tmp/v7r19-helper.go
          gofmt -w /tmp/v7r19-guard.go /tmp/v7r19-helper.go
          go test /tmp/v7r19-guard.go -count=1
          go test /tmp/v7r19-helper.go -count=1
          grep -F 'syscall.AllThreadsSyscall(syscall.SYS_SETFSUID' /tmp/v7r19-helper.go
          grep -F 'syscall.AllThreadsSyscall(syscall.SYS_SETRESUID' /tmp/v7r19-helper.go
          grep -F 'v7r19VerifyAllTasks' /tmp/v7r19-helper.go
          grep -F 'v7r19StartPinnedProofThreads(4)' /tmp/v7r19-helper.go
          ! grep -F 'syscall.Syscall(syscall.SYS_SETRESUID' /tmp/v7r19-helper.go
          ! grep -F 'syscall.Exec(' /tmp/v7r19-helper.go
          grep -F 'retireAuthorityBeforeProtectedHelperExec(fd)' /tmp/v7r19-guard.go
          grep -F 'syscall.Exec(helperPath, argv, env)' /tmp/v7r19-guard.go
          python3 - <<'PY'
          s=open('/tmp/v7r19-helper.go').read(); m=s[s.index('func main() {'):]
          assert m.index('V7R19_PROTECTED_HELPER_ENTRY') < m.index('imageIdentitySHA256()') < m.index('v7r19StartPinnedProofThreads(4)') < m.index('v7r19DropIrreversibly(targetUID)') < m.index('V7R19_IRREVERSIBLE_USER_DROP_COMPLETE') < m.index('githubPreflight()')
          g=open('/tmp/v7r19-guard.go').read(); gm=g[g.index('func main() {'):]
          assert gm.index('retireAuthorityBeforeProtectedHelperExec(fd)') < gm.index('syscall.Exec(helperPath, argv, env)')
          PY
          printf 'PRELAB_V7R19_STATIC_ALL_THREAD_GATE_PASS=true\n'

      - name: Reproduce v7r18 raw calling-thread defect
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /tmp/v7r19-neg governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R19_RAW_THREAD_DROP_NEGATIVE_CONTROL_20260904.go
          sudo chown root:root /tmp/v7r19-neg
          sudo chmod 4555 /tmp/v7r19-neg
          /tmp/v7r19-neg | tee /tmp/v7r19-neg.out
          grep -F 'V7R18_RAW_THREAD_DROP_NEGATIVE_CONTROL_REPRODUCED=true' /tmp/v7r19-neg.out
          printf 'PRELAB_V7R19_V7R18_DEFECT_NEGATIVE_CONTROL_PASS=true\n'

      - name: Build exact predecessor images then v7r19 child image
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          base="multiverse-v7r19-base:${GITHUB_SHA}"
          v16="multiverse-v7r19-v16:${GITHUB_SHA}"
          tag="multiverse-v7r19-whole-process:${GITHUB_SHA}"
          docker build -f .devcontainer/Dockerfile -t "$base" .
          docker build --build-arg BASE_IMAGE="$base" -f .devcontainer/Dockerfile.v7r16 -t "$v16" .
          docker build --build-arg BASE_IMAGE="$v16" -f .devcontainer/Dockerfile.v7r19 -t "$tag" .
          helper_sha="$(docker run --rm --entrypoint sha256sum "$tag" /usr/local/bin/multiverse-v36-ui-ready-v7r19 | awk '{print $1}')"
          guard_sha="$(docker run --rm --entrypoint sha256sum "$tag" /usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r19 | awk '{print $1}')"
          probe_sha="$(docker run --rm --entrypoint sha256sum "$tag" /usr/local/bin/multiverse-v36-prearm-rate-readiness-v7r9 | awk '{print $1}')"
          identity="$(docker run --rm --entrypoint cat "$tag" /opt/multiverse/v36/image-identity-v7r19.json)"
          grep -F "$helper_sha" <<<"$identity"; grep -F "$guard_sha" <<<"$identity"; grep -F "$probe_sha" <<<"$identity"
          grep -F 'ALL_GO_RUNTIME_THREADS_SETFSUID_SETRESUID_AND_ENUMERATED' <<<"$identity"
          printf 'PRELAB_V7R19_HELPER_SHA256=%s\n' "$helper_sha"
          printf 'PRELAB_V7R19_GUARD_SHA256=%s\n' "$guard_sha"
          printf 'PRELAB_V7R19_RATE_PROBE_SHA256=%s\n' "$probe_sha"
          printf 'PRELAB_V7R19_IMAGE_IDENTITY_SHA256=%s\n' "$(printf '%s' "$identity" | sha256sum | awk '{print $1}')"

      - name: Direct helper credential negatives and inherited attacks
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          tag="multiverse-v7r19-whole-process:${GITHUB_SHA}"
          out="$(docker run --rm --user codespace --network=none -e CODESPACES=true -e CODESPACE_NAME=rate-v7r19-test -e GOTRACEBACK=none --entrypoint /usr/local/bin/multiverse-v36-ui-ready-v7r19 "$tag" 2>&1 || true)"
          grep -F 'PHASE_C_V19_7_36_V7R19_HELPER_DENIED:PROTECTED_STARTUP' <<<"$out"
          out="$(docker run --rm --network=none -e CODESPACES=true -e CODESPACE_NAME=rate-v7r19-test -e GOTRACEBACK=none --entrypoint /usr/local/bin/multiverse-v36-ui-ready-v7r19 "$tag" 2>&1 || true)"
          grep -F 'PHASE_C_V19_7_36_V7R19_HELPER_DENIED:PROTECTED_STARTUP' <<<"$out"
          docker run --rm -v "$PWD:/src:ro" --entrypoint /bin/bash "$tag" /src/governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R13_WHOLE_PROCESS_ATTACK_DRIVER_20260903.sh
          printf 'PRELAB_V7R19_INHERITED_REGRESSION_GATE_PASS=true\n'

      - name: Actual production-equivalent all-thread transition attack proof
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          tag="multiverse-v7r19-whole-process:${GITHUB_SHA}"
          docker run --rm --network=none -v "$PWD:/src:ro" --entrypoint /usr/bin/python3 "$tag" /src/governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R19_WHOLE_PROCESS_CREDENTIAL_ATTACK_SELFTEST_20260904.py | tee /tmp/v7r19-attack.out
          grep -F 'PRELAB_V7R19_ALL_TASK_DROP_MARKER_VERIFIED=true' /tmp/v7r19-attack.out
          printf 'PRELAB_V7R19_WHOLE_PROCESS_CREDENTIAL_GATE_PASS=true\n'
          printf 'FINAL_COMMIT_RATE_FLOOR=60/59\n'
          printf 'HELPER_RATE_FLOOR=55/54\n'
          printf 'RATE_TOCTOU_RESIDUAL_NONZERO=true\n'
          printf 'ONE_SHOT_LIVE_PATH_CONSUMED_BY_CI=false\n'
          printf 'SECURITY_AUTHORITY_GRANTED=false\n'
          printf 'CAN_CREATE_OR_REUSE_CODESPACE_NOW=false\n'
          printf 'CAN_RUN_LIVE_NOW=false\n'
          printf 'RUNTIME=OFF\n'
