name: System Improvement Auditor Upstream Execution State v1 CI

on:
  pull_request:
    paths:
      - 'automation/review_dispatcher_v1/model.py'
      - 'automation/review_dispatcher_v1/review.py'
      - 'automation/review_dispatcher_v1/t2.py'
      - 'automation/review_dispatcher_v1/test_dispatcher_legacy_v1.py'
      - 'tools/test_auditor_upstream_execution_state_v1.py'
      - 'tools/review_build_admission_preflight_v2.py'
      - 'tools/test_review_build_admission_preflight_v2.py'
      - '.github/workflows/system-improvement-auditor-upstream-execution-state-v1-ci.yml'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused regressions
        run: |
          PYTHONPATH=. python -m unittest -v tools.test_auditor_upstream_execution_state_v1 tools.test_review_build_admission_preflight_v2
      - name: Current dispatcher regressions
        shell: bash
        run: |
          set -euo pipefail
          modules=$(find automation/review_dispatcher_v1 -maxdepth 1 -name 'test_*.py' ! -name '*_legacy_v1.py' -printf '%p\n' | sed 's#/#.#g;s#\.py$##' | sort | tr '\n' ' ')
          PYTHONPATH=. python -m unittest -v $modules
      - name: Validator
        run: PYTHONPATH=. python automation/review_dispatcher_v1/validator.py
      - name: Exact live PR527 Auditor semantic admission preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MULTIVERSE_DISPATCHER_REF: e81f3d310d07d40eb6c11fe8233dade3d72a5ad2
        run: >-
          PYTHONPATH=. python -m tools.review_build_admission_preflight_v2
          --repo fufufu1116/multiverse-research
          --lane AUDITOR
          --head 4af4521dfd5daaa47d9b816874c9a65bdf526079
          --expected-request-comment 5668811178
          --expected-request-sha256 024130391042f6fcae795fe1463b3b79d5b7822dcbdffbc1bf6ec8a1bbced629
          --expected-main e81f3d310d07d40eb6c11fe8233dade3d72a5ad2
          --expected-tree 7bb675f8ab93a7ec123e40b14f8cb5672c38efaa
