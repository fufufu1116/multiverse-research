name: Keirin Synthetic Phase Closure Source Gate v1 CI

on:
  pull_request:
    paths:
      - '.github/workflows/keirin-synthetic-phase-closure-source-gate-v1-ci.yml'
      - 'governance/KEIRIN_SYNTHETIC_PHASE_CLOSURE_SOURCE_GATE_CANDIDATE_20260821_v1.json'
  push:
    paths:
      - '.github/workflows/keirin-synthetic-phase-closure-source-gate-v1-ci.yml'
      - 'governance/KEIRIN_SYNTHETIC_PHASE_CLOSURE_SOURCE_GATE_CANDIDATE_20260821_v1.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_MAIN: 28fdfbb0fbb6863ff40fa962557d7d665cd86ce7
  VNEXT_BLOB: afe746287c7e911d214202abdf2de076f63ab30c
  KEIRIN_STATE_BLOB: 962d9c75b0611d52bd264a8b88bb1fe259cb8aeb
  BATCH3_BLOB: 1458682ecf9033e017b1136c580a1055ba395db8
  BATCH4_BLOB: 6bd86411861501a6bed2f7b9fdc12e27caa0dd34
  SCRAMBLE_BLOB: fde4b29ea224b77e23f364162ebd2dad93d8a094
  LINE_SHAPE_BLOB: ee8f05c6f04d79a050c7e092c5892e5bf7d080ca
  PROVIDER_MATRIX_BLOB: 973fb49b57a160887bf8e58683d9b5dc40157f65
  SOURCE_AUDIT_BLOB: cdbc2c9c4f45678ed7bafce23a1a6b2868886432

jobs:
  closure-source-gate-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify frozen evidence inputs and limited diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "$EXPECTED_MAIN:multiverse_vnext/VNEXT_CURRENT_STATE_v0.json")" = "$VNEXT_BLOB"
          test "$(git rev-parse "$EXPECTED_MAIN:v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json")" = "$KEIRIN_STATE_BLOB"
          test "$(git rev-parse "$EXPECTED_MAIN:governance/KEIRIN_LIMITED_SYNTHETIC_BATCH3_C0_C1_N1_MANIFEST_20260821_v1.json")" = "$BATCH3_BLOB"
          test "$(git rev-parse "$EXPECTED_MAIN:governance/KEIRIN_LIMITED_SYNTHETIC_BATCH4_REPLICATION_MANIFEST_20260821_v1.json")" = "$BATCH4_BLOB"
          test "$(git rev-parse "$EXPECTED_MAIN:governance/KEIRIN_SYNTHETIC_STRUCTURE_SCRAMBLE_NEGATIVE_CONTROL_MANIFEST_20260821_v1.json")" = "$SCRAMBLE_BLOB"
          test "$(git rev-parse "$EXPECTED_MAIN:governance/KEIRIN_SYNTHETIC_LINE_SHAPE_LOCALIZATION_MANIFEST_20260821_v1.json")" = "$LINE_SHAPE_BLOB"
          test "$(git rev-parse "$EXPECTED_MAIN:v3/historical_all_market/governance/NEW_LINEAGE_PROVIDER_RIGHTS_MATRIX_v1.md")" = "$PROVIDER_MATRIX_BLOB"
          test "$(git rev-parse "$EXPECTED_MAIN:v3/historical_all_market/governance/NEW_LINEAGE_STAGE0_SOURCE_TRANSPORT_AUDIT_v1.md")" = "$SOURCE_AUDIT_BLOB"
          git diff --name-only "$EXPECTED_MAIN"...HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/keirin-synthetic-phase-closure-source-gate-v1-ci.yml
          governance/KEIRIN_SYNTHETIC_PHASE_CLOSURE_SOURCE_GATE_CANDIDATE_20260821_v1.json
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Validate fail-closed nonauthorizing gate candidate
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='governance/KEIRIN_SYNTHETIC_PHASE_CLOSURE_SOURCE_GATE_CANDIDATE_20260821_v1.json'
          x=json.load(open(p, encoding='utf-8'))
          assert x['status']=='DRAFT_NONCANONICAL_NO_EXECUTION_OR_SOURCE_AUTHORITY'
          a=x['authority']
          for k in (
              'scientific_execution_added','real_or_live_input_collection_authorized','source_admission_authorized',
              'model_selection_authorized','model_freeze_or_promotion_authorized','result_or_payout_access_authorized',
              'holdout_or_untouched_validation_authorized','economics_authorized','external_provider_contact_authorized'):
              assert a[k] is False, (k,a[k])
          assert a['owner_action_now']=='NONE'
          s=x['synthetic_phase_synthesis']
          assert s['global_model_winner_established'] is False
          assert s['real_keirin_winner_established'] is False
          assert s['c0_role']=='ROBUST_SYNTHETIC_NULL_CONTROL'
          assert s['n1_role']=='CONDITIONAL_RELATIONAL_SPECIALIST_CANDIDATE_ONLY'
          b=x['canonical_source_blocker']
          assert b['provider_matrix_current_verdict']=='NO_PROVIDER_YET_ADMITTED_FOR_NEW_LINEAGE_COLLECTION'
          assert b['prospective_collection']=='NOT_AUTHORIZED_UNTIL_ALLOWED_SOURCE_ROUTE_IS_ESTABLISHED'
          g=x['next_gate_candidate']
          assert g['current_status']=='NOT_SATISFIED_NO_SOURCE_ADMITTED'
          assert g['phase_a']['may_contact_provider'] is False
          assert g['phase_a']['may_ingest_scientific_race_dataset'] is False
          assert g['phase_b_only_after_source_admission']['authority_from_this_draft'] is False
          pbd=x['protected_boundaries']
          assert pbd['ECON_HOLDOUT1000']=='SEALED'
          assert pbd['scientific_segment_c_scoring_count']==0
          assert pbd['pr15_quarantined_metrics_access'] is False
          assert pbd['result_payout_access'] is False
          assert pbd['untouched_validation_opened'] is False
          assert x['review_requirement']['independent_lab_review_required_before_canonical_adoption'] is True
          assert x['fail_closed'] is True
          print('KEIRIN_SYNTHETIC_PHASE_CLOSURE_SOURCE_GATE_CANDIDATE_PASS')
          PY

      - name: No science or source side effects
        run: |
          echo 'SCIENTIFIC_EXECUTION_PERFORMED=false'
          echo 'REAL_LIVE_INPUT_COLLECTION_PERFORMED=false'
          echo 'SOURCE_ADMISSION_PERFORMED=false'
          echo 'RESULT_PAYOUT_ACCESSED=false'
          echo 'HOLDOUT_ACCESSED=false'
          echo 'MODEL_PROMOTION_PERFORMED=false'
          echo 'EXTERNAL_PROVIDER_CONTACT_PERFORMED=false'
          echo 'OWNER_ACTION_NOW=NONE'
          test -z "$(git status --porcelain)"
