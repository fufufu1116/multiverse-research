name: Keirin NL2 Economics Wide Stability Replication v4

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - v3/historical_all_market/historical_virtualworld_nl2_economics_wide_stability_replication_v4.py
      - v3/historical_all_market/research_candidates/KEIRIN_NL2_ECONOMICS_WIDE_STABILITY_REPLICATION_PREREG_20260913_v4.json
      - v3/historical_all_market/historical_virtualworld_nl2_economics_robustness_validation_v2.py
      - v3/historical_all_market/historical_virtualworld_nl2_economics_validation_v1.py
      - v3/historical_all_market/historical_virtualworld_nl2_economics_validation_v1_technical_fix.py
      - v3/historical_all_market/kdreams_price_catalog_recovery_v1.py
      - v3/historical_all_market/kdreams_settlement_recovery_v1.py
      - v3/historical_all_market/stage1_pl_ticket_probability_engine_v1.py
      - .github/workflows/keirin-nl2-economics-wide-stability-replication-v4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economics-wide-stability-replication-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install numpy requests beautifulsoup4 lxml
      - name: Verify frozen v4 research files before target access
        shell: bash
        run: |
          test "$(sha256sum v3/historical_all_market/research_candidates/KEIRIN_NL2_ECONOMICS_WIDE_STABILITY_REPLICATION_PREREG_20260913_v4.json | awk '{print $1}')" = "b73791368ddd93a57751b08d86108a41213e0c71fdcac3f1f2ea4f5039d20284"
          test "$(sha256sum v3/historical_all_market/historical_virtualworld_nl2_economics_wide_stability_replication_v4.py | awk '{print $1}')" = "a8fc9a03668c9c753ce11314cc162e5f9995b17982ccc7665d86fa00ffdc8725"
      - name: Run preregistered NL2 economics wide stability replication v4
        run: python v3/historical_all_market/historical_virtualworld_nl2_economics_wide_stability_replication_v4.py
      - name: Upload v4 replication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-nl2-economics-wide-stability-replication-v4
          path: v3/historical_all_market/research_candidates/nl2_economics_wide_stability_replication_v4/
          if-no-files-found: warn
