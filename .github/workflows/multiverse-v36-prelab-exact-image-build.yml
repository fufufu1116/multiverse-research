name: MULTIVERSE V19.7.36 Pre-Lab Exact Image Build

on:
  push:
    branches:
      - agent/r1-stage1-phase-c-v19-7-30-pynacl-readiness-frontload-v1
      - agent/r1-stage1-phase-c-v19-7-36-v7r6-iphone-observability-remediation-v1
      - agent/r1-stage1-phase-c-v19-7-36-v7r7-attach-ready-manual-arm-remediation-v1
      - agent/r1-stage1-phase-c-v19-7-36-v7r7-live-attach-identity-repro-remediation-v1
      - agent/r1-stage1-phase-c-v19-7-36-v7r7-codespaces-cap-boundary-remediation-v1
      - agent/r1-stage1-phase-c-v19-7-36-v7r7-cap-thread-pinning-remediation-v1

permissions:
  contents: read

jobs:
  exact-final-tree-image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact event commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin https://github.com/fufufu1116/multiverse-research.git
          git -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'PRELAB_EXACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PRELAB_EXACT_TREE=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Run mandatory mechanical gate and exact Docker build
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export MULTIVERSE_PRELAB_DOCKER_TAG="multiverse-v7r7-proof:${GITHUB_SHA}"
          launcher='governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_MANUAL_ARM_LAUNCHER_20260901.go'
          grep -F 'runtime.LockOSThread()' "${launcher}"
          grep -F 'lockedTID := syscall.Gettid()' "${launcher}"
          grep -F 'os.ReadFile("/proc/thread-self/status")' "${launcher}"
          test "$(grep -Fc 'sameThread(lockedTID)' "${launcher}")" -ge 4
          if grep -F '/proc/self/status' "${launcher}"; then exit 92; fi
          printf 'PRELAB_CAP_THREAD_PIN_SOURCE_GATE_PASS=true\n'

          python3 governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_EVIDENCE_SCHEMA_ADAPTER_20260901.py --selftest governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_IMPLEMENTATION_CANDIDATE_V7R6_EXTERNAL_SESSION_GATE_20260901.go
          python3 governance/MULTIVERSE_PRE_LAB_MECHANICAL_GATE_V1_20260901.py
          docker image inspect "${MULTIVERSE_PRELAB_DOCKER_TAG}" >/dev/null

          set +e
          broad_cap_output="$(docker run --rm --user codespace --cap-add=ALL -e CODESPACES=false -e CODESPACE_NAME=mechanical-broad-cap-test --entrypoint /usr/local/bin/multiverse-v36-arm-v7r7 "${MULTIVERSE_PRELAB_DOCKER_TAG}" 2>&1)"
          broad_cap_rc=$?
          set -e
          printf '%s\n' "${broad_cap_output}"
          test "${broad_cap_rc}" -eq 92
          grep -F 'PHASE_C_V19_7_36_V7R7_ARM_LAUNCHER_DENIED:CODESPACES' <<<"${broad_cap_output}"
          if grep -F 'PHASE_C_V19_7_36_V7R7_ARM_LAUNCHER_DENIED:THREAD_DRIFT' <<<"${broad_cap_output}"; then exit 92; fi
          if grep -F 'PHASE_C_V19_7_36_V7R7_ARM_LAUNCHER_DENIED:CAPS' <<<"${broad_cap_output}"; then exit 92; fi
          if grep -F 'PHASE_C_V19_7_36_V7R7_ARM_LAUNCHER_DENIED:CAPS_NARROW' <<<"${broad_cap_output}"; then exit 92; fi
          printf 'PRELAB_BROAD_CAP_BOUNDARY_SELF_NARROW_PASS=true\n'

          docker run --rm --entrypoint /bin/cat "${MULTIVERSE_PRELAB_DOCKER_TAG}" /opt/multiverse/v36/image-identity-v7r3.json > /tmp/image-identity-v7r3.json
          test -s /tmp/image-identity-v7r3.json
          printf 'PRELAB_DOCKERFILE_BLOB=%s\n' "$(git hash-object .devcontainer/Dockerfile)"
          printf 'PRELAB_DEVCONTAINER_BLOB=%s\n' "$(git hash-object .devcontainer/devcontainer.json)"
          printf 'PRELAB_EVIDENCE_ADAPTER_BLOB=%s\n' "$(git hash-object governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_EVIDENCE_SCHEMA_ADAPTER_20260901.py)"
          printf 'PRELAB_BASE_IMAGE_DIGEST=%s\n' "$(sed -n '1s/^FROM .*@//p' .devcontainer/Dockerfile)"
          printf 'PRELAB_IMAGE_IDENTITY_SHA256=%s\n' "$(sha256sum /tmp/image-identity-v7r3.json | awk '{print $1}')"
          printf 'PRELAB_FINAL_TREE_DOCKER_BUILD_PASS=true\n'
          printf 'SECURITY_AUTHORITY_GRANTED=false\n'
          printf 'RUNTIME=OFF\n'
