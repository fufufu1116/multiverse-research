name: Multiverse PR24 Recovery Capsule 20260820

on:
  push:
    branches:
      - evidence/multiverse-pr24-recovery-capsule-20260820
    paths:
      - '.github/workflows/multiverse-pr24-recovery-capsule-20260820.yml'

permissions:
  contents: read

jobs:
  build-recovery-capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TARGET_SHA: 2f81464a0a159f7d643105e176edbf289f263cda
      BASE_MAIN: 819afb723c8f14000757b2e53b6664d71ab01227
    steps:
      - name: Checkout frozen PR24 exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact target
        run: |
          echo "TARGET_SHA=${TARGET_SHA}"
          echo "CHECKED_OUT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Build deterministic reconstruction payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/multiverse_pr24_recovery
          git archive --format=zip --output=/tmp/multiverse_pr24_recovery/MULTIVERSE_FOUNDATION_PR24_REPO_2f81464a.zip HEAD
          REPO_SHA256="$(sha256sum /tmp/multiverse_pr24_recovery/MULTIVERSE_FOUNDATION_PR24_REPO_2f81464a.zip | awk '{print $1}')"
          REPO_SIZE="$(stat -c '%s' /tmp/multiverse_pr24_recovery/MULTIVERSE_FOUNDATION_PR24_REPO_2f81464a.zip)"
          cat > /tmp/multiverse_pr24_recovery/RECOVERY_MANIFEST.txt <<EOF
          MULTIVERSE FOUNDATION PR24 RECOVERY CAPSULE
          STATUS=NONCANONICAL_RECOVERY_COPY
          CANONICAL_REPO=fufufu1116/multiverse-research
          BASE_MAIN=${BASE_MAIN}
          EXACT_PR24_HEAD=${TARGET_SHA}
          REPO_ARCHIVE_SHA256=${REPO_SHA256}
          REPO_ARCHIVE_SIZE_BYTES=${REPO_SIZE}
          FOUNDATION_ACCEPTED=false
          FINAL_AUDITOR_REQUIRED=true
          KEIRIN_SCIENTIFIC_RESUME_ALLOWED=false
          RESULT_PAYOUT_ACCESSED=false
          HOLDOUT_ACCESSED=false
          PR15_QUARANTINED_METRICS_INSPECTED=false
          EOF
          cat /tmp/multiverse_pr24_recovery/RECOVERY_MANIFEST.txt
      - name: Upload recovery capsule artifact
        uses: actions/upload-artifact@v4
        with:
          name: MULTIVERSE_FOUNDATION_PR24_RECOVERY_2f81464a
          path: /tmp/multiverse_pr24_recovery/
          if-no-files-found: error
          retention-days: 7
      - name: Protected boundary terminal
        run: |
          echo 'MULTIVERSE_PR24_RECOVERY_CAPSULE_BUILD_PASS'
          echo 'SCIENTIFIC_EXECUTION_PERFORMED=false'
          echo 'RESULT_PAYOUT_ACCESSED=false'
          echo 'HOLDOUT_ACCESSED=false'
          echo 'PR15_QUARANTINED_METRICS_INSPECTED=false'
          echo 'SCIENTIFIC_RESUME_ALLOWED=false'
