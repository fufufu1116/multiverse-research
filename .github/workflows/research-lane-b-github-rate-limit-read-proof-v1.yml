name: MULTIVERSE Research Lane B GitHub Rate Limit Read Proof v1

on:
  push:
    branches:
      - agent/lane-b-github-rate-limit-read-resilience-v1-proof-20260911
    paths:
      - 'automation/review_dispatcher_v1/**'
      - '.github/workflows/research-lane-b-github-rate-limit-read-proof-v1.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Candidate
        uses: actions/checkout@v4
        with:
          ref: f3611e3d2afd434d3ad91b73f7288bd9180f5d4b
          fetch-depth: 0

      - name: Exact head and narrow wiring
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f3611e3d2afd434d3ad91b73f7288bd9180f5d4b"
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "WORKFLOW_TRIGGER_SHA=$GITHUB_SHA"
          grep -q 'github_json_read' automation/review_dispatcher_v1/dispatcher.py
          grep -q 'github_json_read' automation/review_dispatcher_v1/review.py
          grep -q 'def github_json_read' automation/review_dispatcher_v1/github_read_resilience_v1.py
          test "$(git ls-tree HEAD buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml | awk '{print $3}')" = "2d4ec751dee4e507a08313d403c7d0521c172ae5"
          test "$(git ls-tree HEAD buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml | awk '{print $3}')" = "c42bae003a3b1dc6d11cf5e6c33996369a4d22d6"

      - name: Compile dispatcher
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q automation/review_dispatcher_v1

      - name: Full applicable review-dispatcher suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            automation.review_dispatcher_v1.test_combined_fault_replay_v1 \
            automation.review_dispatcher_v1.test_dispatcher \
            automation.review_dispatcher_v1.test_integrated_resilience_convergence_v1 \
            automation.review_dispatcher_v1.test_lane_b_completion_matrix_v1 \
            automation.review_dispatcher_v1.test_publisher_freshness_v1 \
            automation.review_dispatcher_v1.test_publisher_resilience_integration_v1 \
            automation.review_dispatcher_v1.test_receipt_recovery_v1 \
            automation.review_dispatcher_v1.test_request_arbitration_v6 \
            automation.review_dispatcher_v1.test_result_canonicalization_v1 \
            automation.review_dispatcher_v1.test_t2_idempotence_v1 \
            automation.review_dispatcher_v1.test_t2_receipt_recovery_v1 \
            automation.review_dispatcher_v1.test_t2_resilience_integration_v1 \
            automation.review_dispatcher_v1.test_validator_current_baseline_v1

      - name: Validator
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(PYTHONPATH=. python automation/review_dispatcher_v1/validator.py)"
          echo "$OUT"
          python - "$OUT" <<'PY'
          import json
          import sys
          data = json.loads(sys.argv[1])
          assert data["verdict"] == "PASS", data
          assert data["findings"] == [], data
          if "runtime" in data:
              assert data["runtime"] == "OFF", data
          for key in (
              "merge_authorized",
              "main_mutation_authorized",
              "shared_pipeline_mutation_authorized",
          ):
              if key in data:
                  assert data[key] is False, data
          PY
