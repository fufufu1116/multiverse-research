name: MULTIVERSE Research Lane B T2 Visibility Proof v1

on:
  push:
    branches:
      - agent/lane-b-t2-post-write-visibility-repair-v1-proof-20260909
    paths:
      - 'automation/review_dispatcher_v1/**'
      - '.github/workflows/research-lane-b-t2-visibility-proof-v1.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Candidate
        uses: actions/checkout@v4
        with:
          ref: 59e06d695ec118ee360ebd755f5cbfa60cc396ee
          fetch-depth: 0

      - name: Exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "59e06d695ec118ee360ebd755f5cbfa60cc396ee"
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "WORKFLOW_TRIGGER_SHA=$GITHUB_SHA"

      - name: Compile dispatcher
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q automation/review_dispatcher_v1

      - name: Full dispatcher suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            automation.review_dispatcher_v1.test_combined_fault_replay_v1 \
            automation.review_dispatcher_v1.test_dispatcher \
            automation.review_dispatcher_v1.test_integrated_resilience_convergence_v1 \
            automation.review_dispatcher_v1.test_lane_b_completion_matrix_v1 \
            automation.review_dispatcher_v1.test_publisher_freshness_v1 \
            automation.review_dispatcher_v1.test_publisher_resilience_integration_v1 \
            automation.review_dispatcher_v1.test_receipt_recovery_v1 \
            automation.review_dispatcher_v1.test_request_arbitration_v6 \
            automation.review_dispatcher_v1.test_result_canonicalization_v1 \
            automation.review_dispatcher_v1.test_t2_idempotence_v1 \
            automation.review_dispatcher_v1.test_t2_receipt_recovery_v1 \
            automation.review_dispatcher_v1.test_t2_resilience_integration_v1 \
            automation.review_dispatcher_v1.test_validator_current_baseline_v1

      - name: Validator
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(PYTHONPATH=. python automation/review_dispatcher_v1/validator.py)"
          echo "$OUT"
          python - "$OUT" <<'PY'
          import json
          import sys
          data = json.loads(sys.argv[1])
          assert data["verdict"] == "PASS", data
          assert data["findings"] == [], data
          if "runtime" in data:
              assert data["runtime"] == "OFF", data
          for key in (
              "merge_authorized",
              "main_mutation_authorized",
              "shared_pipeline_mutation_authorized",
          ):
              if key in data:
                  assert data[key] is False, data
          PY
