name: MULTIVERSE Multi-Model Provenance Contract pre-Lab

on:
  push:
    branches:
      - research/multimodel-provenance-contract-current-main-20260915-v1
    paths:
      - 'automation/multimodel_research_v1/phase_b_provenance_contract.py'
      - 'automation/multimodel_research_v1/test_phase_b_provenance_contract.py'
      - 'automation/multimodel_research_v1/phase_b_provenance_contract_validator.py'
      - '.github/workflows/multiverse-multimodel-provenance-contract-prelab.yml'

permissions:
  contents: read

jobs:
  provenance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            automation/multimodel_research_v1/phase_b_provenance_contract.py \
            automation/multimodel_research_v1/test_phase_b_provenance_contract.py \
            automation/multimodel_research_v1/phase_b_provenance_contract_validator.py

      - name: Existing Phase A plus provenance regressions
        run: |
          set -euo pipefail
          python -m unittest \
            automation.multimodel_research_v1.test_phase_a \
            automation.multimodel_research_v1.test_phase_b_provenance_contract \
            -v

      - name: Provenance validator
        run: |
          set -euo pipefail
          OUT="$(python -m automation.multimodel_research_v1.phase_b_provenance_contract_validator)"
          echo "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1])
          assert d["verdict"] == "PASS", d
          assert d["findings"] == [], d
          assert d["provider_call_authorized"] is False
          assert d["provider_credentials"] is False
          assert d["spend_authorized"] is False
          assert d["live_effect"] is False
          assert d["runtime"] == "OFF"
          PY
