name: Keirin NL2 Economics Diversified Wide Portfolio Development v6

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - v3/historical_all_market/historical_virtualworld_nl2_economics_diversified_wide_portfolio_development_v6.py
      - v3/historical_all_market/research_candidates/KEIRIN_NL2_ECONOMICS_DIVERSIFIED_WIDE_PORTFOLIO_DEVELOPMENT_PREREG_20260913_v6.json
      - .github/workflows/keirin-nl2-economics-diversified-wide-portfolio-development-v6.yml

permissions:
  contents: read

jobs:
  economics-diversified-wide-portfolio-development-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install numpy requests beautifulsoup4 lxml
      - name: Verify frozen v6 development files before exposed evidence scoring
        shell: bash
        run: |
          test "$(sha256sum v3/historical_all_market/research_candidates/KEIRIN_NL2_ECONOMICS_DIVERSIFIED_WIDE_PORTFOLIO_DEVELOPMENT_PREREG_20260913_v6.json | awk '{print $1}')" = "83c3400f8cccd90e17c8d0934f7981df6da95fa035745c0139bba7f999bc2208"
          test "$(sha256sum v3/historical_all_market/historical_virtualworld_nl2_economics_diversified_wide_portfolio_development_v6.py | awk '{print $1}')" = "0fa3ce51b6f91d21935f46d4937f2c881ff6f580e300fe42aee6ebc9787d9d64"
      - name: Run preregistered exposed-only diversified wide portfolio development v6
        run: python v3/historical_all_market/historical_virtualworld_nl2_economics_diversified_wide_portfolio_development_v6.py
      - name: Upload v6 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-nl2-economics-diversified-wide-portfolio-development-v6
          path: v3/historical_all_market/research_candidates/nl2_economics_diversified_wide_portfolio_development_v6/
          if-no-files-found: warn
