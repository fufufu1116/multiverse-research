name: Multiverse SIM100 PRE-Only Prediction Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim100-prelock:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy beautifulsoup4 lxml

      - name: Verify frozen Universe
        run: |
          echo "95754e7ac17cb91b12f619504d1be5e8a4ddc4f0e3734fa59671aea2e17eb043  .github/workflows/races.csv" | sha256sum -c -

      - name: Run SIM100 PRE-only acquisition and Prediction Lock
        id: prelock
        continue-on-error: true
        run: |
          python .github/workflows/sim100_prelock.py

      - name: Package audit artifact
        if: always()
        run: |
          if [ -d SIM100_PRELOCK_ARTIFACT ]; then
            tar -czf SIM100_PRELOCK_ARTIFACT.tar.gz SIM100_PRELOCK_ARTIFACT
            sha256sum SIM100_PRELOCK_ARTIFACT.tar.gz | tee SIM100_PRELOCK_ARTIFACT.tar.gz.sha256
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiverse-sim100-prelock
          path: |
            SIM100_PRELOCK_ARTIFACT/
            SIM100_PRELOCK_ARTIFACT.tar.gz
            SIM100_PRELOCK_ARTIFACT.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce fail-closed
        if: steps.prelock.outcome != 'success'
        run: |
          echo "SIM100 PRE-only pipeline did not fully PASS. RESULT/PAYOUT remain sealed."
          exit 2
