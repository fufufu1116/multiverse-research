name: Keirin Parallel Mechanical Invariance Gate v1 CI

on:
  push:
    branches:
      - research/keirin-parallel-mechanism-affinity-audit-20260901-v1
    paths:
      - '.github/workflows/keirin-parallel-mechanical-invariance-gate-v1-ci.yml'
      - 'governance/KEIRIN_PARALLEL_MECHANICAL_INVARIANCE_GATE_MANIFEST_20260901_v1.json'
      - 'tools/keirin_parallel_mechanical_invariance_gate_v1.py'

permissions:
  contents: read

env:
  BASE_MAIN: 5c1403c1f5aabb80d29e8c868440aede8888ce61
  VNEXT_BLOB: afe746287c7e911d214202abdf2de076f63ab30c
  KEIRIN_STATE_BLOB: 962d9c75b0611d52bd264a8b88bb1fe259cb8aeb
  AUTH_RECEIPT_BLOB: 4c2e5364ad229a5dd413a19d0cf970c478692584
  DIGITAL_TWIN_BLOB: 1f1574400e43648e60af43d059965d021d8bbad8
  TOP3_CORE_BLOB: 4e2a819dce69240792d927cceba434f53932b829
  COMPARISON_BLOB: 9531715a8f346aec370bf1be24017a8ff577506b
  COEFF_RECEIPT_BLOB: f531d72929c846da1c932451873c94bb9b526ae7
  AUDIT_BLOB: a77597268c24fb4f807014853c723de7a4af36d1
  MANIFEST_BLOB: 9707a08c447d603e11fdaa681e60ae6f6ba35f60
  HARNESS_BLOB: 1e9a710b4b70ac7b8a51c3edde5231a6bbfaabf8
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  mechanical-invariance-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fresh relevant-state and exact-source checks
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "OBSERVED_ORIGIN_MAIN=$(git rev-parse origin/main)"
          echo "EXECUTED_HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_MAIN" HEAD
          test "$(git rev-parse "origin/main:multiverse_vnext/VNEXT_CURRENT_STATE_v0.json")" = "$VNEXT_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json")" = "$KEIRIN_STATE_BLOB"
          test "$(git rev-parse "origin/main:governance/KEIRIN_LIMITED_SYNTHETIC_EXECUTION_AUTHORIZATION_RECEIPT_20260821_v1.json")" = "$AUTH_RECEIPT_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/new_lineage/digital_twin_v1.py")" = "$DIGITAL_TWIN_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/new_lineage/top3_architecture_core_v1.py")" = "$TOP3_CORE_BLOB"
          test "$(git rev-parse "origin/main:tools/keirin_synthetic_c0_c1_n1_comparison_v1.py")" = "$COMPARISON_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/governance/KEIRIN_FROZEN_PRE_HOLDOUT_COEFFICIENT_RECEIPT_v1.json")" = "$COEFF_RECEIPT_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_PARALLEL_MECHANISM_AFFINITY_AUDIT_20260901_v1.md")" = "$AUDIT_BLOB"
          test "$(git rev-parse "HEAD:governance/KEIRIN_PARALLEL_MECHANICAL_INVARIANCE_GATE_MANIFEST_20260901_v1.json")" = "$MANIFEST_BLOB"
          test "$(git rev-parse "HEAD:tools/keirin_parallel_mechanical_invariance_gate_v1.py")" = "$HARNESS_BLOB"

      - name: Verify isolated Research Candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_MAIN"...HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/keirin-parallel-mechanical-invariance-gate-v1-ci.yml
          governance/KEIRIN_PARALLEL_MECHANICAL_INVARIANCE_GATE_MANIFEST_20260901_v1.json
          tools/keirin_parallel_mechanical_invariance_gate_v1.py
          v3/historical_all_market/research_candidates/KEIRIN_PARALLEL_MECHANISM_AFFINITY_AUDIT_20260901_v1.md
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Reject network-capable regression harness
        shell: bash
        run: |
          set -euo pipefail
          HARNESS=tools/keirin_parallel_mechanical_invariance_gate_v1.py
          ! grep -Eq '(^|[[:space:]])(requests|urllib|socket|subprocess|selenium|playwright)([[:space:].]|$)' "$HARNESS"
          ! grep -Eq 'https?://' "$HARNESS"

      - name: Execute prespecified mechanical leakage invariance gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/keirin_parallel_mechanical_invariance_gate_v1.py | tee /tmp/gate.log
          grep -Fx 'KEIRIN_PARALLEL_MECHANICAL_INVARIANCE_GATE_PASS' /tmp/gate.log
          head -n 1 /tmp/gate.log > /tmp/result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/result.json', encoding='utf-8'))
          assert r['status']=='PASS'
          assert r['classification']=='RESEARCH_CANDIDATE_NOT_CANONICAL_NOT_ACCEPTED_NOT_PROMOTED'
          assert r['evidence_class']=='SYNTHETIC_ENGINEERING_FALSIFICATION_ONLY'
          for key in (
              '1_car_id_permutation_equivariance',
              '2_line_group_id_permutation_invariance',
              '3_container_order_invariance',
              '4_pre_latent_barrier_regression',
              '5_truth_prediction_code_path_separation',
              '6_no_adaptive_seed_condition_selection_evidence',
          ):
              assert r['gates'][key]['status']=='PASS', key
          assert r['material_failure_in_gates_1_to_5'] is False
          assert r['downstream_synthetic_comparison_interpretability_gate']=='GREEN'
          for key in ('protected_or_quarantined_input_access','pr15_metrics_access','result_payout_access','econ_holdout1000_access','dev2000_c_rescue','real_live_input_collection','economics','model_or_coefficient_change','model_promotion','external_provider_contact','real_money_wagering','real_world_edge_or_roi_evidence'):
              assert r[key] is False, (key, r[key])
          assert r['scientific_segment_c_scoring_count']==0
          print('KEIRIN_PARALLEL_MECHANICAL_GATE_RESULT_CONTRACT_PASS')
          PY

      - name: Protected-boundary terminal
        shell: bash
        run: |
          echo 'EVIDENCE_CLASS=SYNTHETIC_ENGINEERING_FALSIFICATION_ONLY'
          echo 'RESEARCH_CANDIDATE_ONLY=true'
          echo 'PR15_METRICS_ACCESSED=false'
          echo 'RESULT_PAYOUT_ACCESSED=false'
          echo 'ECON_HOLDOUT1000_ACCESSED=false'
          echo 'DEV2000_C_RESCUE=false'
          echo 'SCIENTIFIC_SEGMENT_C_SCORING_COUNT=0'
          echo 'REAL_LIVE_INPUT=false'
          echo 'ECONOMICS=false'
          echo 'MODEL_PROMOTION=false'

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"
