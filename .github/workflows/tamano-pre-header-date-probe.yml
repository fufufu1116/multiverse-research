name: tamano-pre-header-date-probe

on:
  push:
    paths:
      - '.github/workflows/tamano-pre-header-date-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4 PyMuPDF
      - name: Read only top header area inside frozen PRE clips
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,requests,time,unicodedata
          import fitz
          from bs4 import BeautifulSoup
          from datetime import datetime,timezone
          from urllib.parse import urljoin,urlparse,unquote
          W=1190.55
          discovery='https://www.tamano-keirin.jp/racepdf/'; day='2026-07-24'; h={'User-Agent':'Multiverse-Private-Research/1.0'}
          s=requests.Session(); r=s.get(discovery,headers=h,timeout=20,allow_redirects=False)
          if r.status_code!=200: raise RuntimeError(f'discovery {r.status_code}')
          soup=BeautifulSoup(r.content,'html.parser'); urls=[]
          for a in soup.find_all('a',href=True):
              u=urljoin(discovery,a['href']); p=urlparse(u)
              if p.scheme=='https' and p.netloc=='www.tamano-keirin.jp' and p.path.startswith('/wp-content/uploads/') and p.path.lower().endswith('.pdf') and not p.query and unquote(p.path.rsplit('/',1)[-1]).startswith(day.replace('-','')): urls.append(u)
          urls=sorted(set(urls));
          if len(urls)!=1: raise RuntimeError(f'pdf cardinality={len(urls)}')
          time.sleep(10); p=s.get(urls[0],headers=h,timeout=20,allow_redirects=False)
          if p.status_code!=200 or not p.content.startswith(b'%PDF-'): raise RuntimeError(f'pdf {p.status_code}')
          doc=fitz.open(stream=p.content,filetype='pdf')
          areas={1:fitz.Rect(610,0,W,220),2:fitz.Rect(0,0,W,220)}
          pages=[]
          for page_no,clip in areas.items():
              page=doc[page_no-1]
              blocks=page.get_text('blocks',clip=clip)
              lines=[]
              for b in sorted(blocks,key=lambda z:(z[1],z[0])):
                  txt=' '.join(unicodedata.normalize('NFKC',b[4]).split())
                  if txt: lines.append({'text':txt,'x0':round(b[0],1),'y0':round(b[1],1),'x1':round(b[2],1),'y1':round(b[3],1)})
              pages.append({'page':page_no,'header_blocks':lines})
          out={'record':'TAMANO_PRE_HEADER_DATE_PROBE_v1','generated_utc':datetime.now(timezone.utc).isoformat(),
               'event_day':day,'pdf_raw_sha256':hashlib.sha256(p.content).hexdigest(),'pre_header_only':True,
               'full_document_extraction':False,'holdout_accessed':False,'result_payout_price_accessed':False,
               'pages':pages,'status':'PASS_PROBE'}
          q=pathlib.Path('v3/prospective_shadow250_v2/runtime_receipts/TAMANO_PRE_HEADER_DATE_PROBE_v1.json'); q.parent.mkdir(parents=True,exist_ok=True)
          q.write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8'); print(q.read_text())
          PY
      - name: Persist probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/prospective_shadow250_v2/runtime_receipts/TAMANO_PRE_HEADER_DATE_PROBE_v1.json
          git commit -m 'Record Tamano PRE header date probe'
          git push
