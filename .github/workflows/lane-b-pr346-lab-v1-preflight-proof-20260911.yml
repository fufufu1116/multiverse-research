name: lane-b-pr346-lab-v1-owner-free-preflight-proof-20260911
on:
  push:
    branches:
      - agent/lane-b-pr346-lab-v1-preflight-proof-20260911
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact boundary and schema classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE=2bd2cde16e490c1f9d620121ed43c29e1f4fe77d
          TREE=0a2ee126916ed3f6b0da7eafcd9c19f664a5cca6
          MAIN=bb133e196efa818bc9b8dc59519c02796e70658e
          EXPECTED_SHA=c97cffaddc212cb85eaa70e3bf52abe4db7b2320fa2d1b7e739f6e6e3746fe98
          LAB_BLOB=2d4ec751dee4e507a08313d403c7d0521c172ae5
          AUDITOR_BLOB=c42bae003a3b1dc6d11cf5e6c33996369a4d22d6
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/lane-b-pr346-lab-v1-preflight-proof-20260911.yml"
          git checkout --detach "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          git fetch --no-tags origin "$MAIN"
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN"
          test "$(git rev-parse "$MAIN:automation/review_dispatcher_v1/publisher_legacy_v1.py")" = "$(git rev-parse "$CANDIDATE:automation/review_dispatcher_v1/publisher_legacy_v1.py")"
          test "$(git rev-parse "$MAIN:automation/review_dispatcher_v1/github_read_resilience_v1.py")" = "$(git rev-parse "$CANDIDATE:automation/review_dispatcher_v1/github_read_resilience_v1.py")"
          git ls-tree -r "$MAIN" > /tmp/main-tree.txt
          git ls-tree -r "$CANDIDATE" > /tmp/candidate-tree.txt
          grep -q "$LAB_BLOB" /tmp/main-tree.txt && grep -q "$LAB_BLOB" /tmp/candidate-tree.txt
          grep -q "$AUDITOR_BLOB" /tmp/main-tree.txt && grep -q "$AUDITOR_BLOB" /tmp/candidate-tree.txt
          EXPECTED_SHA="$EXPECTED_SHA" GH_TOKEN="$GH_TOKEN" PYTHONPATH=. python - <<'PY'
          import json, os, urllib.request
          from automation.review_dispatcher_v1.model_legacy_v1 import (
              REQUEST_KEYS, ReviewContractError, parse_request_from_comment,
              sha256_json, validate_request,
          )
          url='https://api.github.com/repos/fufufu1116/multiverse-research/issues/comments/5632796417'
          req=urllib.request.Request(url, headers={
              'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'multiverse-pr346-lab-v1-preflight-proof',
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              comment=json.load(r)
          assert comment['id']==5632796417
          assert comment['user']['login']=='fufufu1116'
          request=parse_request_from_comment(comment.get('body') or '')
          assert isinstance(request, dict)
          reconstructed=sha256_json(request)
          print('RECONSTRUCTED_REQUEST_SHA256='+reconstructed)
          assert reconstructed == os.environ['EXPECTED_SHA'], (reconstructed, os.environ['EXPECTED_SHA'])
          missing=sorted(REQUEST_KEYS-set(request))
          extra=sorted(set(request)-REQUEST_KEYS)
          print('REQUEST_MISSING_KEYS='+json.dumps(missing))
          print('REQUEST_EXTRA_KEYS='+json.dumps(extra))
          assert missing == ['supersedes_request_sha256'], missing
          assert extra == [], extra
          try:
              validate_request(request)
          except ReviewContractError as exc:
              print('VALIDATE_REQUEST_BLOCKER='+str(exc))
              assert str(exc) == 'REQUEST_SCHEMA_KEYS', str(exc)
          else:
              raise AssertionError('validate_request unexpectedly passed')
          print('REQUEST_ID='+str(request.get('request_id')))
          print('REQUEST_ENVELOPE_HEAD='+str(request.get('head')))
          print('REQUEST_ENVELOPE_TREE='+str(request.get('tree')))
          print('REQUEST_ENVELOPE_BASE='+str(request.get('base')))
          print('REQUEST_ENVELOPE_MAIN='+str(request.get('main')))
          print('PREFLIGHT_TERMINAL=BLOCKED_REQUEST_SCHEMA_KEYS')
          print('RUNTIME=OFF')
          PY
