name: MULTIVERSE Automation Shared Engine Local Persistent Worker v9 pre-Lab

on:
  push:
    branches:
      - agent/automation-shared-engine-persistent-worker-v9-20260904-v1
    paths:
      - 'automation/shared_engine/local_persistent_worker_v9.py'
      - 'automation/shared_engine/LOCAL_PERSISTENT_WORKER_V9.json'
      - 'automation/shared_engine/README_LOCAL_PERSISTENT_WORKER_V9.md'
      - 'automation/shared_engine/mechanical_gate_local_persistent_worker_v9.py'
      - 'automation/shared_engine/tests/test_local_persistent_worker_v9.py'
      - 'automation/shared_engine/tests/test_local_persistent_worker_v9_integration.py'
      - '.github/workflows/multiverse-automation-shared-engine-persistent-worker-v9-prelab.yml'

permissions:
  contents: read

jobs:
  exact-head-prelab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind exact head, predecessor, and Fresh main
        shell: bash
        run: |
          set -euo pipefail
          EXACT_HEAD="$(git rev-parse HEAD)"
          FRESH_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${EXACT_HEAD}" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "agent/automation-shared-engine-persistent-worker-v9-20260904-v1"
          test "${FRESH_MAIN}" = "040d37f0a4e426cf2e119706484c90cbb48f0e56"
          git merge-base --is-ancestor 61f4e330fd5b1945dbfbceb223cbc71d205860f2 HEAD
          python - <<'PY'
          import json
          d=json.load(open('automation/shared_engine/LOCAL_PERSISTENT_WORKER_V9.json'))
          assert d['predecessor_head']=='61f4e330fd5b1945dbfbceb223cbc71d205860f2'
          assert d['predecessor_tree']=='2c957c4ad8a553b3a0e7122ebcdb22e75398afaf'
          assert d['predecessor_closure_comment']==5528780140
          assert d['stacked_v7_head']=='4a72ef46116043094c7a8e494404956925a5b3bf'
          assert d['canonical_main']=='040d37f0a4e426cf2e119706484c90cbb48f0e56'
          assert all(v is False for v in d['authority'].values())
          PY
          echo "V9_EXACT_HEAD=${EXACT_HEAD}"
          echo "V9_FRESH_MAIN=${FRESH_MAIN}"
      - name: Persistent worker v9 mechanical gate and inherited regressions
        shell: bash
        env:
          PYTHONPATH: automation/shared_engine:automation
        run: |
          set -euo pipefail
          python automation/shared_engine/mechanical_gate_local_persistent_worker_v9.py
      - name: Candidate nonauthority receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "V9_CANDIDATE_ONLY=true"
          echo "V9_DEPLOYED_DAEMON=false"
          echo "V9_CONTINUOUS_AUTONOMOUS_OPERATION=false"
          echo "V9_AUTHENTICATED_EXTERNAL_WORKER_IDENTITY=false"
          echo "V9_REMOTE_PROVIDER_EXACTLY_ONCE=false"
          echo "V9_DISTRIBUTED_NETWORK_LEASE_SAFETY=false"
          echo "V9_TASK_CREATION_AUTHORITY=false"
          echo "V9_LIVE_PROVIDER=false"
          echo "V9_NETWORK=false"
          echo "V9_EXTERNAL_EFFECT=false"
          echo "V9_SPEND=false"
          echo "V9_SECRET_CREDENTIAL=false"
          echo "V9_MAIN_MUTATION_AUTHORITY=false"
          echo "V9_RULESET_MUTATION_AUTHORITY=false"
          echo "V9_CORE_ADOPTION_AUTHORITY=false"
          echo "V9_KEIRIN_ADOPTION_AUTHORITY=false"
          echo "V9_RUNTIME=OFF"
          echo "V9_INDEPENDENT_REVIEW_REQUIRED=true"
