name: Keirin Historical VirtualWorld Independent Meeting Replication 100 B1a v1

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - v3/historical_all_market/historical_virtualworld_independent_meeting_replication_100_b1a_v1.py
      - v3/historical_all_market/research_candidates/KEIRIN_INDEPENDENT_MEETING_REPLICATION_100_SELECTION_RULE_20260913_v1.json
      - .github/workflows/keirin-historical-virtualworld-independent-meeting-replication-100-b1a-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-meeting-replication-100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install numpy requests beautifulsoup4 lxml
      - name: Run preregistered independent-meeting replication 100
        run: python v3/historical_all_market/historical_virtualworld_independent_meeting_replication_100_b1a_v1.py
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-independent-meeting-replication-100-b1a-v1
          path: v3/historical_all_market/research_candidates/virtualworld_independent_meeting_replication_100_b1a_v1/
          if-no-files-found: warn
