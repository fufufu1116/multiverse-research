name: MULTIVERSE V19.7.36 v7r7 Static Env Guard Pre-Lab

on:
  push:
    branches:
      - agent/r1-stage1-phase-c-v19-7-36-v7r7-static-env-guard-remediation-v1

permissions:
  contents: read

jobs:
  exact-static-env-guard-image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact event commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin https://github.com/fufufu1116/multiverse-research.git
          git -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'PRELAB_EXACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PRELAB_EXACT_TREE=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Build exact image and prove static env guard
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export MULTIVERSE_PRELAB_DOCKER_TAG="multiverse-v7r7-static-guard:${GITHUB_SHA}"
          guard='governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_UI_READY_STATIC_ENV_GUARD_20260902.go'

          grep -F 'expectedHelperSHA256 = "2fd9e085e866924fb52995e5bb5fcb58763bdbd1fa1ee2c96e1d57df28a42301"' "${guard}"
          grep -F 'os.Clearenv()' "${guard}"
          grep -F 'syscall.Exec(helperPath, argv, env)' "${guard}"
          grep -F 'env := []string{"CODESPACES=true", "CODESPACE_NAME=" + name}' "${guard}"
          grep -F 'syscall.O_NOFOLLOW' "${guard}"
          grep -F 'PHASE_C_V19_7_36_V7R7_UI_READY_ENV_GUARD_PASS' "${guard}"
          if grep -E '"net/|"net$|net/http|crypto/tls|os/exec|plugin|unsafe' "${guard}"; then exit 92; fi
          printf 'PRELAB_STATIC_ENV_GUARD_SOURCE_GATE_PASS=true\n'

          python3 governance/MULTIVERSE_PRE_LAB_MECHANICAL_GATE_V1_20260901.py
          docker image inspect "${MULTIVERSE_PRELAB_DOCKER_TAG}" >/dev/null

          test "$(docker run --rm --entrypoint /usr/bin/stat "${MULTIVERSE_PRELAB_DOCKER_TAG}" -c '%u %g %a' /usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r7)" = '0 0 555'
          test "$(docker run --rm --entrypoint /usr/bin/sha256sum "${MULTIVERSE_PRELAB_DOCKER_TAG}" /usr/local/bin/multiverse-v36-ui-ready-v7r7 | awk '{print $1}')" = '2fd9e085e866924fb52995e5bb5fcb58763bdbd1fa1ee2c96e1d57df28a42301'

          interp="$(docker run --rm --entrypoint /usr/bin/readelf "${MULTIVERSE_PRELAB_DOCKER_TAG}" -l /usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r7 | grep -F 'Requesting program interpreter' || true)"
          test -z "${interp}"
          printf 'PRELAB_STATIC_ENV_GUARD_NO_PT_INTERP_PASS=true\n'

          identity="$(docker run --rm --entrypoint /bin/cat "${MULTIVERSE_PRELAB_DOCKER_TAG}" /opt/multiverse/v36/image-identity-v7r3.json)"
          python3 -c 'import json,sys; x=json.loads(sys.stdin.read()); p=[o["path"] for o in x["objects"]]; assert "/usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r7" in p' <<<"${identity}"
          printf 'PRELAB_STATIC_ENV_GUARD_IMAGE_IDENTITY_BOUND_PASS=true\n'

          set +e
          poison_output="$(docker run --rm --user codespace \
            -e CODESPACES=false \
            -e CODESPACE_NAME=mechanical-env-guard \
            -e LD_PRELOAD=/definitely/not-present.so \
            -e LD_LIBRARY_PATH=/definitely/not-present \
            -e LD_AUDIT=/definitely/not-present.so \
            -e GODEBUG=x509roots=1 \
            -e SSL_CERT_FILE=/definitely/not-present.pem \
            -e GITHUB_TOKEN=SHOULD_NOT_BE_USED \
            --entrypoint /usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r7 \
            "${MULTIVERSE_PRELAB_DOCKER_TAG}" mechanical-env-guard 2>&1)"
          poison_rc=$?
          set -e
          printf '%s\n' "${poison_output}"
          test "${poison_rc}" -eq 92
          grep -Fx 'PHASE_C_V19_7_36_V7R7_UI_READY_ENV_GUARD_DENIED:CODESPACES' <<<"${poison_output}"
          if grep -F 'ERROR: ld.so' <<<"${poison_output}"; then exit 92; fi
          printf 'PRELAB_STATIC_ENV_GUARD_AMBIENT_LOADER_POISON_IMMUNE_PASS=true\n'

          workvol="multiverse-static-guard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "${workvol}" >/dev/null
          cleanup() { docker volume rm -f "${workvol}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm -v "${workvol}:/workspaces" --entrypoint /bin/bash "${MULTIVERSE_PRELAB_DOCKER_TAG}" -lc '
            set -euo pipefail
            uid="$(id -u codespace)"; gid="$(id -g codespace)"
            mkdir -p /workspaces/.codespaces/.persistedshare /workspaces/multiverse-research
            chown -R "${uid}:${gid}" /workspaces/.codespaces /workspaces/multiverse-research
            chmod 0755 /workspaces /workspaces/.codespaces /workspaces/.codespaces/.persistedshare /workspaces/multiverse-research
            printf "%s\n" "# MULTIVERSE PRE-LIVE CONTROL — V19.7.36 v7r7" "" "STATE: WAITING_FOR_CODESPACE_ATTACH_READY" > /workspaces/multiverse-research/MULTIVERSE_PRELIVE_START_HERE.md
            chown "${uid}:${gid}" /workspaces/multiverse-research/MULTIVERSE_PRELIVE_START_HERE.md
            chmod 0644 /workspaces/multiverse-research/MULTIVERSE_PRELIVE_START_HERE.md
          '

          set +e
          child_output="$(docker run --rm --user codespace --network=none -v "${workvol}:/workspaces" \
            -e CODESPACES=true \
            -e CODESPACE_NAME=mechanical-env-guard \
            -e LD_PRELOAD=/definitely/not-present.so \
            -e LD_LIBRARY_PATH=/definitely/not-present \
            -e LD_AUDIT=/definitely/not-present.so \
            -e GODEBUG=x509roots=1 \
            -e SSL_CERT_FILE=/definitely/not-present.pem \
            -e GITHUB_TOKEN=SHOULD_NOT_REACH_HELPER \
            --entrypoint /usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r7 \
            "${MULTIVERSE_PRELAB_DOCKER_TAG}" mechanical-env-guard 2>&1)"
          child_rc=$?
          set -e
          printf '%s\n' "${child_output}"
          test "${child_rc}" -eq 92
          grep -F 'PHASE_C_V19_7_36_V7R7_UI_READY_ENV_GUARD_PASS codespace=mechanical-env-guard child_env=EXACT_COSPACES_AND_NAME_ONLY' <<<"${child_output}"
          grep -Fx 'PHASE_C_V19_7_36_V7R7_UI_READY_DENIED:PREARM_GITHUB_RATE_NETWORK' <<<"${child_output}"
          if grep -F 'ERROR: ld.so' <<<"${child_output}"; then exit 92; fi
          printf 'PRELAB_STATIC_ENV_GUARD_EXACT_CHILD_ENV_PATH_PASS=true\n'

          image_sha="$(printf '%s' "${identity}" | sha256sum | awk '{print $1}')"
          guard_sha="$(docker run --rm --entrypoint /usr/bin/sha256sum "${MULTIVERSE_PRELAB_DOCKER_TAG}" /usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r7 | awk '{print $1}')"
          printf 'PRELAB_IMAGE_IDENTITY_SHA256=%s\n' "${image_sha}"
          printf 'PRELAB_STATIC_ENV_GUARD_SHA256=%s\n' "${guard_sha}"
          printf 'PRELAB_FINAL_TREE_DOCKER_BUILD_PASS=true\n'
          printf 'SECURITY_AUTHORITY_GRANTED=false\n'
          printf 'RUNTIME=OFF\n'
