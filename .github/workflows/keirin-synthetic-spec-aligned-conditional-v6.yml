name: Keirin Synthetic Spec-Aligned Conditional v6

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - 'v3/historical_all_market/research_candidates/KEIRIN_SYNTHETIC_SPEC_ALIGNED_CONDITIONAL_PREREG_20260914_v6.json'
      - 'v3/historical_all_market/new_lineage/synthetic_spec_aligned_conditional_v6.py'
      - '.github/workflows/keirin-synthetic-spec-aligned-conditional-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-spec-aligned-conditional-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh-check canonical main synthetic-only authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          echo "fresh canonical main: $(git rev-parse origin/main)"
          git show origin/main:KEIRIN_NOW.md | grep -F 'Synthetic（合成）限定' >/dev/null
          git show origin/main:v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json > /tmp/CURRENT_STATE_KEIRIN.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/CURRENT_STATE_KEIRIN.json',encoding='utf-8'))
          if x.get('status') != 'LIMITED_SYNTHETIC_SCIENTIFIC_EXECUTION_AUTHORIZED_POST_LAB_AUDITOR_OWNER_GATE':
              raise SystemExit('FAIL_CLOSED: canonical Keirin status is not limited synthetic authorization')
          if x.get('scientific_state',{}).get('ECON_HOLDOUT1000') != 'SEALED':
              raise SystemExit('FAIL_CLOSED: ECON_HOLDOUT1000 authority drift')
          print('CANONICAL_SYNTHETIC_ONLY_AUTHORITY_PASS')
          PY
      - name: Verify exact preregistration and implementation hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "ae37504ea0abbc56058a0acb499785d91485ed439f6b67ae8e553135085b7f4f  v3/historical_all_market/research_candidates/KEIRIN_SYNTHETIC_SPEC_ALIGNED_CONDITIONAL_PREREG_20260914_v6.json" | sha256sum -c -
          echo "4a3d7091dad23de2df4108bb3bae0846eb0b710fbb3953a20dabf7f1557501de  v3/historical_all_market/new_lineage/synthetic_spec_aligned_conditional_v6.py" | sha256sum -c -
      - name: Compile synthetic component validation
        run: python -m py_compile v3/historical_all_market/new_lineage/synthetic_spec_aligned_conditional_v6.py
      - name: Run preregistered synthetic component validation
        run: python v3/historical_all_market/new_lineage/synthetic_spec_aligned_conditional_v6.py
      - name: Upload synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-synthetic-spec-aligned-conditional-v6
          path: v3/historical_all_market/research_candidates/synthetic_spec_aligned_conditional_v6/
          if-no-files-found: warn
          retention-days: 90
