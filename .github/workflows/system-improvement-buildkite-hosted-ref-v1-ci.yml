name: System Improvement Buildkite Hosted Ref v1 CI

on:
  pull_request:
    paths:
      - 'tools/buildkite_hosted_ref_preflight_v1.py'
      - 'tools/test_buildkite_hosted_ref_preflight_v1.py'
      - 'docs/control/BUILDKITE_HOSTED_AUDITOR_EXPLICIT_MAIN_REF_v1.md'
      - '.github/workflows/system-improvement-buildkite-hosted-ref-v1-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tools.test_buildkite_hosted_ref_preflight_v1
