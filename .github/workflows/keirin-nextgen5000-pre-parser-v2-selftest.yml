name: keirin-nextgen5000-pre-parser-v2-selftest
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - 'tools/keirin_nextgen5000_pre_bulk_recovery_v2.py'
      - 'tools/keirin_nextgen5000_pre_bulk_recovery_selftest_v2.py'
      - '.github/workflows/keirin-nextgen5000-pre-parser-v2-selftest.yml'
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - run: python -m py_compile tools/keirin_nextgen5000_pre_bulk_recovery_v2.py tools/keirin_nextgen5000_pre_bulk_recovery_selftest_v2.py
      - run: python tools/keirin_nextgen5000_pre_bulk_recovery_selftest_v2.py
