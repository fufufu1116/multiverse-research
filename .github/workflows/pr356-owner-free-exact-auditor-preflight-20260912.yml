name: pr356-owner-free-exact-auditor-preflight-20260912

on:
  push:
    branches:
      - agent/pr356-owner-free-exact-auditor-preflight-20260912

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      EXACT_HEAD: 06dcbd9f597bdbb3d00d2b47a3837db5901313db
      EXACT_TREE: cc91da3814accdc3cd6ee0b91bb19ae5ecc07635
      EXACT_MAIN: bb133e196efa818bc9b8dc59519c02796e70658e
      EXACT_REQUEST_COMMENT: '5642152591'
      EXACT_REQUEST_SHA: 9609c2960be92c0ba344ae96cad77efaf40ab797796464c222714fc5f54ff61a
      BUILDKITE_COMMIT: 06dcbd9f597bdbb3d00d2b47a3837db5901313db
      BUILDKITE_BUILD_ID: OWNER_FREE_AUDITOR_PREFLIGHT_PR356_20260912
      BUILDKITE_BUILD_NUMBER: '0'
      BUILDKITE_BRANCH: agent/global-build-prelaunch-singleflight-20260912
      MULTIVERSE_DISPATCHER_REF: bb133e196efa818bc9b8dc59519c02796e70658e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact proof carrier boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_HEAD"
          test "$(git show -s --format=%T HEAD^)" = "$EXACT_TREE"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/pr356-owner-free-exact-auditor-preflight-20260912.yml"
          test "$(git show HEAD^:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml | git hash-object --stdin)" = "2d4ec751dee4e507a08313d403c7d0521c172ae5"
          test "$(git show HEAD^:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml | git hash-object --stdin)" = "c42bae003a3b1dc6d11cf5e6c33996369a4d22d6"
      - name: Run exact owner-free Auditor preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin "$EXACT_MAIN"
          git checkout -q --detach "$EXACT_HEAD"
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "$(git show -s --format=%T HEAD)" = "$EXACT_TREE"
          rm -rf .mv_dispatcher
          mkdir -p .mv_dispatcher
          git archive "$EXACT_MAIN" automation/review_dispatcher_v1 | tar -x -C .mv_dispatcher
          PYTHONPATH=.mv_dispatcher python3 .mv_dispatcher/automation/review_dispatcher_v1/dispatcher.py \
            --lane AUDITOR \
            --repo fufufu1116/multiverse-research \
            --head "$EXACT_HEAD" \
            --output review_job.json
          python3 - <<'PY'
          import json
          j=json.load(open('review_job.json'))
          assert j['pr']==356
          assert j['lane']=='AUDITOR'
          assert j['head']=='06dcbd9f597bdbb3d00d2b47a3837db5901313db'
          assert j['tree']=='cc91da3814accdc3cd6ee0b91bb19ae5ecc07635'
          assert j['main']=='bb133e196efa818bc9b8dc59519c02796e70658e'
          assert j['dispatcher_ref']=='bb133e196efa818bc9b8dc59519c02796e70658e'
          assert j['request_comment']==5642152591
          assert j['request_sha256']=='9609c2960be92c0ba344ae96cad77efaf40ab797796464c222714fc5f54ff61a'
          assert j['request_id']=='pr356-global-prelaunch-singleflight-auditor-v1-labv1-main-bb133e19'
          print('EXACT_DISPATCH_SELECTION=PASS')
          PY
          test -z "${MULTIVERSE_INDEPENDENT_LAB_PRIVATE_KEY:-}"
          test -z "${MULTIVERSE_INDEPENDENT_AUDITOR_PRIVATE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${RENDER_API_KEY:-}"
          PYTHONPATH=.mv_dispatcher python3 .mv_dispatcher/automation/review_dispatcher_v1/review.py \
            --job review_job.json \
            --output review_artifact.json \
            --repo-root .
          python3 - <<'PY'
          import json
          a=json.load(open('review_artifact.json'))
          assert a['verdict']=='PASS', a['findings']
          assert a['findings']==[]
          assert a['test_count']==152, a['test_count']
          assert a['lane']=='AUDITOR'
          assert a['request_comment']==5642152591
          assert a['request_sha256']=='9609c2960be92c0ba344ae96cad77efaf40ab797796464c222714fc5f54ff61a'
          assert a['reviewed_head']=='06dcbd9f597bdbb3d00d2b47a3837db5901313db'
          assert a['reviewed_tree']=='cc91da3814accdc3cd6ee0b91bb19ae5ecc07635'
          assert a['reviewed_main']=='bb133e196efa818bc9b8dc59519c02796e70658e'
          print('FULL_APPLICABLE_TESTS=152/152_PASS')
          print('VALIDATOR=PASS')
          print('VALIDATOR_FINDINGS=[]')
          print('PREFLIGHT_TERMINAL=READY')
          PY
