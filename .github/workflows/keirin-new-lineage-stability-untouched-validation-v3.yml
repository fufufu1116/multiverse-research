name: Keirin New Lineage Stability Untouched Validation v3

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - v3/historical_all_market/historical_virtualworld_new_lineage_stability_untouched_validation_v3.py
      - v3/historical_all_market/research_candidates/KEIRIN_NEW_LINEAGE_STABILITY_UNTOUCHED_VALIDATION_SELECTION_RULE_20260913_v3.json
      - v3/historical_all_market/research_candidates/KEIRIN_NEW_LINEAGE_STABILITY_MODEL_FREEZE_20260913_v2.json
      - v3/historical_all_market/research_candidates/KEIRIN_NEW_LINEAGE_MODEL_FREEZE_20260913_v1.json
      - .github/workflows/keirin-new-lineage-stability-untouched-validation-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  untouched-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install numpy requests beautifulsoup4 lxml
      - name: Run preregistered NL2 untouched validation v3
        run: python v3/historical_all_market/historical_virtualworld_new_lineage_stability_untouched_validation_v3.py
      - name: Upload NL2 untouched validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-new-lineage-stability-untouched-validation-v3
          path: v3/historical_all_market/research_candidates/new_lineage_stability_untouched_validation_v3/
          if-no-files-found: warn
