name: MULTIVERSE Runtime Supervisor v1 Candidate pre-Lab

on:
  push:
    branches:
      - agent/runtime-supervisor-v1-candidate-20260904-v1
    paths:
      - 'automation/runtime_v1/**'
      - '.github/workflows/multiverse-runtime-supervisor-v1-candidate-prelab.yml'

permissions:
  contents: read

jobs:
  exact-lineage-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind frozen construction and Fresh main
        shell: bash
        run: |
          set -euo pipefail
          EXACT_HEAD="$(git rev-parse HEAD)"
          FRESH_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${EXACT_HEAD}" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "agent/runtime-supervisor-v1-candidate-20260904-v1"
          test "${FRESH_MAIN}" = "a6f56facc80709f2e7b8218d927484d522bfa356"
          python - <<'PY'
          import json
          d=json.load(open('automation/runtime_v1/RUNTIME_V1_CANDIDATE_FREEZE.json'))
          assert d['frozen'] is True
          assert d['construction_head']=='faffe058718368cc9fcdab346e2835650b8a6d6d'
          assert d['construction_ci']['run_id']==33838094759
          assert d['construction_ci']['conclusion']=='success'
          assert d['canonical_main']=='a6f56facc80709f2e7b8218d927484d522bfa356'
          assert d['canonical_tree']=='2c957c4ad8a553b3a0e7122ebcdb22e75398afaf'
          assert d['runtime']=='OFF'
          assert d['mode']=='SEALED_DRY_RUN'
          assert all(v is False for v in d['authority'].values())
          PY
          echo "RUNTIME_V1_CANDIDATE_HEAD=${EXACT_HEAD}"
          echo "RUNTIME_V1_FRESH_MAIN=${FRESH_MAIN}"

      - name: Full Runtime v1 regression
        shell: bash
        env:
          PYTHONPATH: automation/runtime_v1:automation/shared_engine
        run: |
          set -euo pipefail
          python -m unittest discover -s automation/runtime_v1 -p 'test_*.py' -v

      - name: Candidate mechanical authority gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[
              Path('automation/runtime_v1/runtime_supervisor.py'),
              Path('automation/runtime_v1/shared_engine_driver.py'),
              Path('automation/runtime_v1/runtime_service.py'),
          ]
          forbidden=('requests','urllib','http.client','socket','boto3','openai','anthropic')
          for p in files:
              s=p.read_text()
              for item in forbidden:
                  assert f'import {item}' not in s and f'from {item}' not in s, (p,item)
          supervisor=files[0].read_text()
          assert 'INDEPENDENT_REVIEW_CANNOT_BE_SELF_MANUFACTURED' in supervisor
          assert 'KILL_SWITCH_ENGAGED' in supervisor
          assert 'MAX_STEPS_BOUNDED_1_100_REQUIRED' in supervisor
          assert 'set_test_kill_switch' not in supervisor
          assert 'disable_kill_switch' not in supervisor
          assert 'Callable[[], dict' not in supervisor
          driver=files[1].read_text()
          assert 'claim_task' in driver and 'claim_next_task' not in driver
          service=files[2].read_text()
          assert 'run_forever' in service
          assert 'EXACT_SHARED_ENGINE_DRIVER_REQUIRED' in service
          print('RUNTIME_V1_CANDIDATE_MECHANICAL_GATE=PASS')
          PY

      - name: Candidate nonauthority receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNTIME=OFF"
          echo "MODE=SEALED_DRY_RUN"
          echo "LIVE_PROVIDER=false"
          echo "NETWORK=false"
          echo "EXTERNAL_EFFECT=false"
          echo "SPEND=false"
          echo "PROTECTED_KEIRIN_DATA=false"
          echo "LAB_VERDICT_AUTHORITY=false"
          echo "AUDITOR_VERDICT_AUTHORITY=false"
          echo "RUNTIME_ACTIVATION_AUTHORITY=false"
          echo "INDEPENDENT_REVIEW_REQUIRED=true"
