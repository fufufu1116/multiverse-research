    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact PR557 Auditor r4 semantic admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=. python -m tools.review_build_admission_preflight_v2
          --repo fufufu1116/multiverse-research
          --lane AUDITOR
          --head 805cd54393270085b63215daa1a462b5fa245bd6
          --expected-request-comment 5672870367
          --expected-request-sha256 c22756173b2c322e3adc084143878a99ef5e3cfa1250ecf17a3b5b5e046f50fd
          --expected-main f6f145cf197f5e5cb9e8ad4d3d0b98e562039bb4
