name: TEMP PR557 Auditor r2 Admission
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact PR557 Auditor r2 semantic admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=. python -m tools.review_build_admission_preflight_v2
          --repo fufufu1116/multiverse-research
          --lane AUDITOR
          --head 805cd54393270085b63215daa1a462b5fa245bd6
          --expected-request-comment 5672670014
          --expected-request-sha256 PLACEHOLDER_REQUEST_SHA256
          --expected-main f6f145cf197f5e5cb9e8ad4d3d0b98e562039bb4
          --expected-tree 8b6b3d52ebc9de7b141bb37eeb3147792b1eb7d5
