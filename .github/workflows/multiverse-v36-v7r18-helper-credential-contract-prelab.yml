name: MULTIVERSE V19.7.36 v7r18 Helper Credential Contract Pre-Lab

on:
  push:
    branches:
      - agent/r1-stage1-phase-c-v19-7-36-v7r18-helper-credential-contract-redesign-v1

permissions:
  contents: read

jobs:
  test-v7r18-helper-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact event commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin https://github.com/fufufu1116/multiverse-research.git
          git -c protocol.version=2 fetch --depth=120 origin "${GITHUB_SHA}" 249e4276e176dea811b7d3fb9d9670b5bbe5f10b
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 249e4276e176dea811b7d3fb9d9670b5bbe5f10b HEAD
          main_now="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_now" = 'a6f56facc80709f2e7b8218d927484d522bfa356'
          printf 'PRELAB_V7R18_EXACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PRELAB_V7R18_EXACT_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          printf 'PRELAB_V7R18_CANONICAL_MAIN=%s\n' "$main_now"

      - name: Generate and statically verify exact v7r18 guard and helper
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          python3 governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R18_HELPER_CREDENTIAL_CONTRACT_PATCHER_20260904.py \
            governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R16_POST_AUTH_CREDENTIAL_DROP_GUARD_20260904.go \
            governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_UI_READY_WRITER_20260901.go \
            /tmp/v7r18-guard.go /tmp/v7r18-helper.go
          gofmt -w /tmp/v7r18-guard.go /tmp/v7r18-helper.go
          go test /tmp/v7r18-guard.go -count=1
          go test /tmp/v7r18-helper.go -count=1
          grep -F 'retireAuthorityBeforeProtectedHelperExec' /tmp/v7r18-guard.go
          grep -F 'syscall.Exec(helperPath, argv, env)' /tmp/v7r18-guard.go
          ! grep -F 'dropToOrdinaryUser' /tmp/v7r18-guard.go
          grep -F 'v7r18ProtectedStartup' /tmp/v7r18-helper.go
          grep -F 'v7r18DropIrreversibly(targetUID)' /tmp/v7r18-helper.go
          grep -F 'SYS_SETRESUID' /tmp/v7r18-helper.go
          grep -F 'authority-regain-succeeded' /tmp/v7r18-helper.go
          ! grep -F 'syscall.Exec(' /tmp/v7r18-helper.go
          python3 - <<'PY'
          s=open('/tmp/v7r18-helper.go').read(); m=s[s.index('func main() {'):]
          assert m.index('PHASE_C_V19_7_36_V7R18_PROTECTED_HELPER_ENTRY') < m.index('imageIdentitySHA256()') < m.index('v7r18DropIrreversibly(targetUID)') < m.index('githubPreflight()')
          g=open('/tmp/v7r18-guard.go').read(); gm=g[g.index('func main() {'):]
          assert gm.index('retireAuthorityBeforeProtectedHelperExec(fd)') < gm.index('syscall.Exec(helperPath, argv, env)')
          PY
          grep -F 'prearmMinRateBeforeComments = 55' governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_UI_READY_WRITER_20260901.go
          grep -F 'prearmMinRateAfterComments = 54' governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_UI_READY_WRITER_20260901.go
          printf 'PRELAB_V7R18_STATIC_STRUCTURAL_GATE_PASS=true\n'

      - name: Build exact predecessor images then v7r18 child image
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          base="multiverse-v7r18-base:${GITHUB_SHA}"
          v16="multiverse-v7r18-v16:${GITHUB_SHA}"
          tag="multiverse-v7r18-helper-contract:${GITHUB_SHA}"
          docker build -f .devcontainer/Dockerfile -t "$base" .
          docker build --build-arg BASE_IMAGE="$base" -f .devcontainer/Dockerfile.v7r16 -t "$v16" .
          docker build --build-arg BASE_IMAGE="$v16" -f .devcontainer/Dockerfile.v7r18 -t "$tag" .
          helper_sha="$(docker run --rm --entrypoint sha256sum "$tag" /usr/local/bin/multiverse-v36-ui-ready-v7r18 | awk '{print $1}')"
          guard_sha="$(docker run --rm --entrypoint sha256sum "$tag" /usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r18 | awk '{print $1}')"
          probe_sha="$(docker run --rm --entrypoint sha256sum "$tag" /usr/local/bin/multiverse-v36-prearm-rate-readiness-v7r9 | awk '{print $1}')"
          test "$(docker run --rm --entrypoint stat "$tag" -c '%u %g %a' /usr/local/bin/multiverse-v36-ui-ready-v7r18)" = '0 0 555'
          test "$(docker run --rm --entrypoint stat "$tag" -c '%u %g %a' /usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r18)" = '0 0 555'
          identity="$(docker run --rm --entrypoint cat "$tag" /opt/multiverse/v36/image-identity-v7r18.json)"
          grep -F "$helper_sha" <<<"$identity"
          grep -F "$guard_sha" <<<"$identity"
          grep -F "$probe_sha" <<<"$identity"
          grep -F 'PROTECTED_GUARD_EXEC_PROTECTED_HELPER_THEN_HELPER_IRREVERSIBLE_USER_DROP' <<<"$identity"
          printf 'PRELAB_V7R18_HELPER_SHA256=%s\n' "$helper_sha"
          printf 'PRELAB_V7R18_GUARD_SHA256=%s\n' "$guard_sha"
          printf 'PRELAB_V7R18_RATE_PROBE_SHA256=%s\n' "$probe_sha"
          printf 'PRELAB_V7R18_IMAGE_IDENTITY_SHA256=%s\n' "$(printf '%s' "$identity" | sha256sum | awk '{print $1}')"

      - name: Direct ordinary same-UID and root helper invocation denied
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          tag="multiverse-v7r18-helper-contract:${GITHUB_SHA}"
          out="$(docker run --rm --user codespace --network=none -e CODESPACES=true -e CODESPACE_NAME=rate-v7r18-test -e GOTRACEBACK=none --entrypoint /usr/local/bin/multiverse-v36-ui-ready-v7r18 "$tag" 2>&1 || true)"
          grep -F 'PHASE_C_V19_7_36_V7R18_HELPER_DENIED:PROTECTED_STARTUP' <<<"$out"
          out="$(docker run --rm --network=none -e CODESPACES=true -e CODESPACE_NAME=rate-v7r18-test -e GOTRACEBACK=none --entrypoint /usr/local/bin/multiverse-v36-ui-ready-v7r18 "$tag" 2>&1 || true)"
          grep -F 'PHASE_C_V19_7_36_V7R18_HELPER_DENIED:PROTECTED_STARTUP' <<<"$out"
          printf 'PRELAB_V7R18_DIRECT_HELPER_CREDENTIAL_NEGATIVES_PASS=true\n'

      - name: Inherited launcher-to-probe attacks remain closed
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          tag="multiverse-v7r18-helper-contract:${GITHUB_SHA}"
          docker run --rm -v "$PWD:/src:ro" --entrypoint /bin/bash "$tag" /src/governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R13_WHOLE_PROCESS_ATTACK_DRIVER_20260903.sh
          printf 'PRELAB_V7R18_INHERITED_LAUNCHER_TO_PROBE_ATTACK_GATE_PASS=true\n'

      - name: Actual protected-helper credential transition attack proof
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          tag="multiverse-v7r18-helper-contract:${GITHUB_SHA}"
          docker run --rm --network=none -v "$PWD:/src:ro" --entrypoint /usr/bin/python3 "$tag" /src/governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R18_HELPER_CREDENTIAL_CONTRACT_ATTACK_SELFTEST_20260904.py
          printf 'PRELAB_V7R18_HELPER_CREDENTIAL_CONTRACT_GATE_PASS=true\n'
          printf 'FINAL_COMMIT_RATE_FLOOR=60/59\n'
          printf 'HELPER_RATE_FLOOR=55/54\n'
          printf 'RATE_TOCTOU_RESIDUAL_NONZERO=true\n'
          printf 'ONE_SHOT_LIVE_PATH_CONSUMED_BY_CI=false\n'
          printf 'SECURITY_AUTHORITY_GRANTED=false\n'
          printf 'CAN_CREATE_OR_REUSE_CODESPACE_NOW=false\n'
          printf 'CAN_RUN_LIVE_NOW=false\n'
          printf 'RUNTIME=OFF\n'
