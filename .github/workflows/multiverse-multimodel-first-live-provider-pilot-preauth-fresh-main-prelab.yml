name: MULTIVERSE Multi-Model Fresh-Main Executable Preauth Successor pre-Lab

on:
  push:
    branches:
      - research/multimodel-first-live-preauth-fresh-main-post-pr313-20260911-v1
    paths:
      - 'automation/multimodel_research_v1/**'
      - '.github/workflows/multiverse-multimodel-first-live-provider-pilot-preauth-fresh-main-prelab.yml'

permissions:
  contents: read

jobs:
  fresh-main-executable-preauth-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "FRESH_MAIN_PREAUTH_HEAD=$GITHUB_SHA"

      - name: Compile successor files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            automation/multimodel_research_v1/phase_b_live_preauth.py \
            automation/multimodel_research_v1/phase_b_live_preauth_fresh_main.py \
            automation/multimodel_research_v1/test_phase_b_live_preauth.py \
            automation/multimodel_research_v1/test_phase_b_live_preauth_fresh_main.py \
            automation/multimodel_research_v1/phase_b_live_preauth_fresh_main_validator.py

      - name: Full cumulative applicable Multi-model tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            automation.multimodel_research_v1.test_phase_a \
            automation.multimodel_research_v1.test_phase_b_launch_generation \
            automation.multimodel_research_v1.test_phase_b_execution_packet \
            automation.multimodel_research_v1.test_phase_b_live_preauth \
            automation.multimodel_research_v1.test_phase_b_live_preauth_fresh_main \
            -v

      - name: Phase A validator
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python automation/multimodel_research_v1/validator.py)"
          echo "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1]); assert d["verdict"]=="PASS", d; assert d["findings"]==[], d; assert d["runtime"]=="OFF"
          PY

      - name: Phase B launch-generation validator
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python -m automation.multimodel_research_v1.phase_b_validator)"
          echo "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1]); assert d["verdict"]=="PASS", d; assert d["findings"]==[], d; assert d["runtime"]=="OFF"
          PY

      - name: First provider execution-packet validator
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python -m automation.multimodel_research_v1.phase_b_execution_packet_validator)"
          echo "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1]); assert d["verdict"]=="PASS", d; assert d["findings"]==[], d; assert d["runtime"]=="OFF"
          PY

      - name: Fresh-main executable preauth successor validator
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python -m automation.multimodel_research_v1.phase_b_live_preauth_fresh_main_validator)"
          echo "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1])
          assert d["verdict"]=="PASS", d
          assert d["findings"]==[], d
          assert sum(d["test_counts"].values())==564, d
          assert d["packet_summary"]["canonical"]["main"]=="d1edc2eabb847c10a4faa59a039b480e85dfb0e4", d
          assert d["provider_call_authorized"] is False
          assert d["provider_credentials"] is False
          assert d["spend_authorized"] is False
          assert d["live_effect"] is False
          assert d["runtime"]=="OFF"
          PY
