name: Keirin HFT Frozen Day1 PRE Acquire V3 One-Shot

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-hft-frozen-day1-acquire-v3-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frozen-day1-acquire-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACQUIRER: 'tools/keirin_kdreams_historical_pre_quarantine_acquire_v3.py'
      ACQUIRER_BLOB: 'd9ee8186b013b389fc0ae228566de3587b3dbfcc'
      PRESPEC: 'v3/historical_all_market/research_candidates/KEIRIN_HFT_L1_PRE_PARSER_SCHEMA_DELTA_PRESPEC_20260904_v1.json'
      MANIFEST: 'v3/historical_all_market/research_candidates/KEIRIN_HFT_POSITIVELY_OBSERVED_DAY1_MANIFEST_20260904_v2.json'
      PRE: 'v3/historical_all_market/research_candidates/KEIRIN_HFT_FROZEN_DAY1_PRE_ROWS_20260904_v3.csv'
      RECEIPT: 'v3/historical_all_market/research_candidates/KEIRIN_HFT_FROZEN_DAY1_FETCH_RECEIPT_20260904_v3.json'
      STATUS: 'v3/historical_all_market/research_candidates/KEIRIN_HFT_FROZEN_DAY1_RUN_STATUS_20260904_v3.json'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/keirin-real-evidence-dual-lane-20260901-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet beautifulsoup4

      - name: Verify frozen parser delta and acquirer selftest
        run: |
          set -euo pipefail
          test "$(git hash-object "$ACQUIRER")" = "$ACQUIRER_BLOB"
          python - <<'PY'
          import json,os
          p=json.load(open(os.environ['PRESPEC'],encoding='utf-8'))
          if p.get('status')!='PRE_RESULT_PARSER_SCHEMA_REPAIR_FROZEN_NO_SUPPORT_AUTHORITY': raise SystemExit('FAIL_CLOSED:prespec')
          if p.get('frozen_parser_delta',{}).get('allowed_class_tokens')!=['S1','S2','A1','A2','A3','L1']: raise SystemExit('FAIL_CLOSED:class_lock')
          if p.get('support_increment_authorized_now')!=0 or p.get('result_join_authorized') is not False: raise SystemExit('FAIL_CLOSED:authority')
          PY
          python "$ACQUIRER" selftest > /tmp/acquirer_selftest.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/acquirer_selftest.json',encoding='utf-8'))
          if x.get('status')!='PASS' or not all(x.get('tests',{}).values()): raise SystemExit('FAIL_CLOSED:selftest')
          if x.get('network_access') is not False or x.get('race_id_guessing') is not False: raise SystemExit('FAIL_CLOSED:selftest_firewall')
          print('L1_AWARE_ACQUIRER_SELFTEST_PASS')
          PY

      - name: Validate previously frozen exact Day1 manifest
        run: |
          python - <<'PY'
          import json,os
          from urllib.parse import urlparse
          m=json.load(open(os.environ['MANIFEST'],encoding='utf-8'))
          if m.get('record')!='KEIRIN_HFT_POSITIVELY_OBSERVED_DAY1_MANIFEST_20260904_v2': raise SystemExit('FAIL_CLOSED:manifest_record')
          if m.get('confirmed_day1_blocks')!=1 or len(m.get('blocks',[]))!=1: raise SystemExit('FAIL_CLOSED:block_count')
          b=m['blocks'][0]
          if b.get('race_date')!='2026-08-30' or b.get('venue')!='川崎' or b.get('day1_confirmed') is not True: raise SystemExit('FAIL_CLOSED:block_identity')
          if len(b.get('detail_urls',[]))!=12: raise SystemExit('FAIL_CLOSED:detail_count')
          if m.get('race_id_guessed') is not False or m.get('result_fields_emitted') is not False: raise SystemExit('FAIL_CLOSED:manifest_firewall')
          for u in b['detail_urls']:
              p=urlparse(u)
              if p.scheme!='https' or p.hostname!='keirin.kdreams.jp' or p.query or p.fragment or '/racedetail/' not in p.path: raise SystemExit('FAIL_CLOSED:detail_url')
          print('FROZEN_12R_MANIFEST_PASS')
          PY

      - name: Re-acquire all frozen races with unchanged PRE schema
        run: |
          set +e
          python "$ACQUIRER" acquire --manifest "$MANIFEST" --pre-csv "$PRE" --receipt "$RECEIPT" --timeout 25
          rc=$?
          echo "ACQUIRE_RC=$rc" >> "$GITHUB_ENV"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          exit 0

      - name: Require whole-day completion and write sanitized status
        run: |
          python - <<'PY'
          import csv,hashlib,json,os,re
          from pathlib import Path
          fields=['race_id','race_date','venue','race_no','car_no','rider_name_raw','class','style','competition_score','S','B','nige','makuri','sashi','mark','source_url','source_file_sha256','evidence_role']
          r=json.load(open(os.environ['RECEIPT'],encoding='utf-8'))
          for k in ['raw_html_written_to_disk','raw_html_printed','result_fields_emitted','payout_fields_emitted','odds_fields_emitted','forecast_fields_emitted','narabiyoso_fields_emitted','race_id_guessed','support_increment_authorized_by_tool']:
              if r.get(k) is not False: raise SystemExit('FAIL_CLOSED:receipt_firewall')
          rows=[]
          with open(os.environ['PRE'],encoding='utf-8',newline='') as f:
              rd=csv.DictReader(f)
              if rd.fieldnames!=fields: raise SystemExit('FAIL_CLOSED:schema')
              for x in rd:
                  if x['class'] not in {'S1','S2','A1','A2','A3','L1'}: raise SystemExit('FAIL_CLOSED:class')
                  if float(x['competition_score'])==0: raise SystemExit('FAIL_CLOSED:zero_score')
                  rows.append(x)
          accepted=int(r.get('successful_races',0)); rejected=len(r.get('rejected',[])); race_nos=sorted({int(x['race_no']) for x in rows})
          complete=accepted==12 and rejected==0 and race_nos==list(range(1,13))
          status='PRE_ONLY_WHOLE_DAY_COMPLETE_IDENTITY_MAPPING_PENDING' if complete else 'PRE_ONLY_PARTIAL_FAIL_CLOSED_NO_SUPPORT'
          out={'record':'KEIRIN_HFT_FROZEN_DAY1_RUN_STATUS_20260904_v3','status':status,'source_manifest':os.environ['MANIFEST'],'parser_delta_prespec':os.environ['PRESPEC'],'successful_races':accepted,'rejected_races':rejected,'pre_rows':len(rows),'race_numbers':race_nos,'class_tokens':sorted({x['class'] for x in rows}),'whole_day_complete':complete,'pre_csv_sha256':hashlib.sha256(Path(os.environ['PRE']).read_bytes()).hexdigest(),'receipt_sha256':hashlib.sha256(Path(os.environ['RECEIPT']).read_bytes()).hexdigest(),'raw_html_persisted':False,'raw_html_printed':False,'target_result_accessed':False,'payout_accessed':False,'race_id_guessed':False,'identity_mapping_status':'PENDING_FAIL_CLOSED','support_increment_authorized_now':0,'result_join_authorized':False,'model_fit_authorized':False,'main_or_runtime_mutation':False}
          Path(os.environ['STATUS']).write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:out[k] for k in ['status','successful_races','rejected_races','pre_rows','race_numbers','class_tokens','whole_day_complete','support_increment_authorized_now','target_result_accessed']},ensure_ascii=False,sort_keys=True))
          if not complete: raise SystemExit('FAIL_CLOSED:whole_day_incomplete')
          PY

      - name: Commit sanitized complete PRE artifacts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PRE" "$RECEIPT" "$STATUS"
          git diff --cached --quiet && exit 0
          git commit -m 'research(keirin): complete frozen Kawasaki Day1 PRE with L1-aware parser'
          git push origin HEAD:research/keirin-real-evidence-dual-lane-20260901-v1
