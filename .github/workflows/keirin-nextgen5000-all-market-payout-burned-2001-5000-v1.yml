name: Keirin NEXTGEN5000 All-Market Payout Burned Diagnostic 2001-5000 v1
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-nextgen5000-all-market-payout-burned-2001-5000-v1.yml'
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 2001, end: 2500}
          - {start: 2501, end: 3000}
          - {start: 3001, end: 3500}
          - {start: 3501, end: 4000}
          - {start: 4001, end: 4500}
          - {start: 4501, end: 5000}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Collect all car-market payouts
        run: |
          mkdir -p out
          python tools/keirin_nextgen5000_all_market_payout_recovery_v1.py \
            --start-position ${{ matrix.start }} --end-position ${{ matrix.end }} \
            --workers 10 \
            --out-csv out/NEXTGEN5000_ALL_MARKET_PAYOUT_${{ matrix.start }}_${{ matrix.end }}.csv \
            --receipt out/NEXTGEN5000_ALL_MARKET_PAYOUT_${{ matrix.start }}_${{ matrix.end }}_RECEIPT.json
      - name: Assert market coverage
        run: |
          python - <<'PY'
          import csv,glob,collections
          p=glob.glob('out/NEXTGEN5000_ALL_MARKET_PAYOUT_*.csv')[0]
          rows=list(csv.DictReader(open(p,encoding='utf-8')))
          c=collections.Counter(r['market'] for r in rows)
          for k in ['2shahuku','3renhuku','wide','2shatan','3rentan']:
              assert c[k]>0,(k,c)
          print('PASS_MARKETS',dict(c))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keirin-nextgen5000-all-market-payout-${{ matrix.start }}-${{ matrix.end }}
          path: out/
          retention-days: 30
