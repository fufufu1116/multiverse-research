name: All-Market Stage3 ticket filter static self-check

on:
  push:
    paths:
      - '.github/workflows/all-market-stage3-ticket-filter-static.yml'
      - 'v3/historical_all_market/stage3_ticket_filter_diagnostics_v1.py'
      - 'v3/historical_all_market/governance/STAGE3_TICKET_FILTER_FAMILY_PREREG_v1.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and verify Stage3 bindings
        run: |
          python -m py_compile v3/historical_all_market/stage3_ticket_filter_diagnostics_v1.py
          python - <<'PY'
          import ast, hashlib, json, runpy
          from pathlib import Path

          ENGINE=Path('v3/historical_all_market/stage3_ticket_filter_diagnostics_v1.py')
          PREREG=Path('v3/historical_all_market/governance/STAGE3_TICKET_FILTER_FAMILY_PREREG_v1.md')

          def blob(p):
              b=p.read_bytes(); return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()

          expected_engine='dc509e03b464faca97ac2e242ad7ac4c79f55a3d'
          expected_prereg='ba4175bb044bcacfa66a7b8d089e92c04762b2e6'
          obs_engine=blob(ENGINE); obs_prereg=blob(PREREG)
          if obs_engine != expected_engine or obs_prereg != expected_prereg:
              raise SystemExit(f'FAIL_CLOSED blob mismatch engine={obs_engine} prereg={obs_prereg}')

          tree=ast.parse(ENGINE.read_text(encoding='utf-8'))
          imports=[]
          for n in ast.walk(tree):
              if isinstance(n,ast.Import): imports.extend(a.name for a in n.names)
              elif isinstance(n,ast.ImportFrom): imports.append(n.module or '')
          bad=[x for x in imports if x=='requests' or x.startswith('requests.') or 'settlement' in x.lower()]
          if bad: raise SystemExit(f'FAIL_CLOSED forbidden import={bad}')

          ns=runpy.run_path(str(ENGINE),run_name='stage3_static_check')
          expected_profiles=(
              ('P00',0.00,1.00),('P05',0.05,1.05),('P10',0.10,1.10),
              ('P20',0.20,1.20),('P35',0.35,1.35),('P50',0.50,1.50),('P100',1.00,2.00),
          )
          if ns.get('PROFILES') != expected_profiles:
              raise SystemExit(f'FAIL_CLOSED profile drift={ns.get("PROFILES")}')
          if ns.get('EXPECTED_STAGE2_SHA256') != '34ad32bed6e8b4d700864c46f4533bef1da254c7d87dc7ffe6ec266fd74530dc':
              raise SystemExit('FAIL_CLOSED Stage2 SHA binding drift')
          if ns.get('EXPECTED_STAGE3_PREREG_GIT_BLOB') != expected_prereg:
              raise SystemExit('FAIL_CLOSED prereg binding drift')

          receipt={
            'record':'ALL_MARKET_STAGE3_TICKET_FILTER_STATIC_SELF_CHECK_v1',
            'status':'PASS',
            'stage3_engine_git_blob':obs_engine,
            'stage3_prereg_git_blob':obs_prereg,
            'python_compile':'PASS',
            'profile_count':7,
            'profile_registry':'PASS_EXACT',
            'stage2_catalog_sha_binding':'PASS_EXACT',
            'network_race_data_imported':False,
            'settlement_executable_imported':False,
            'result_payout_parser_imported':False,
            'scientific_trial_count':0,
            'ECON_HOLDOUT1000':'SEALED'
          }
          out=Path('v3/historical_all_market/runtime_receipts/ALL_MARKET_STAGE3_TICKET_FILTER_STATIC_SELF_CHECK_v1.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Commit PASS receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/historical_all_market/runtime_receipts/ALL_MARKET_STAGE3_TICKET_FILTER_STATIC_SELF_CHECK_v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Stage3 ticket filter static PASS'
          git push
