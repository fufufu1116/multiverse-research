name: Keirin NL2 Economics Fallback Market Routing Development v8

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - 'v3/historical_all_market/research_candidates/KEIRIN_NL2_ECONOMICS_FALLBACK_MARKET_ROUTING_DEVELOPMENT_PREREG_20260913_v8.json'
      - 'v3/historical_all_market/historical_virtualworld_nl2_economics_fallback_market_routing_development_v8.py'
      - '.github/workflows/keirin-nl2-economics-fallback-market-routing-development-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economics-fallback-market-routing-development-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check numpy requests beautifulsoup4 lxml
      - name: Verify frozen v8 development files before exposed evidence scoring
        shell: bash
        run: |
          set -euo pipefail
          echo "ce936ca88932be96d6387a99fd0d37c6c565d334f71e1a2e15e933c0b3e4bb6a  v3/historical_all_market/research_candidates/KEIRIN_NL2_ECONOMICS_FALLBACK_MARKET_ROUTING_DEVELOPMENT_PREREG_20260913_v8.json" | sha256sum -c -
          echo "e2e5b43945edb12f6cb6d7a285d6870439337a65e85ccab2eedc36b7a5a7b896  v3/historical_all_market/historical_virtualworld_nl2_economics_fallback_market_routing_development_v8.py" | sha256sum -c -
      - name: Run preregistered exposed-only fallback market routing development v8
        run: python v3/historical_all_market/historical_virtualworld_nl2_economics_fallback_market_routing_development_v8.py
      - name: Upload v8 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-nl2-economics-fallback-market-routing-development-v8
          path: v3/historical_all_market/research_candidates/nl2_economics_fallback_market_routing_development_v8/
          if-no-files-found: warn
          retention-days: 90
