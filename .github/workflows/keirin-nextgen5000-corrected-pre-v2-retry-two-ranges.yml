name: Keirin NEXTGEN5000 Corrected PRE v2 Retry 2501-3000 4501-5000
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-nextgen5000-corrected-pre-v2-retry-two-ranges.yml'
permissions:
  contents: read
jobs:
  acquire-and-freeze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 2501, end: 3000}
          - {start: 4501, end: 5000}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Reacquire strict corrected PRE with 90pct batch continuation gate
        run: |
          mkdir -p out
          python tools/keirin_nextgen5000_pre_bulk_recovery_v2.py \
            --start-position ${{ matrix.start }} --end-position ${{ matrix.end }} \
            --workers 8 --min-success-rate 0.90 \
            --pre-csv out/NEXTGEN5000_PRE_V2_${{ matrix.start }}_${{ matrix.end }}.csv \
            --receipt out/NEXTGEN5000_PRE_V2_${{ matrix.start }}_${{ matrix.end }}_RECEIPT.json
      - name: Freeze Candidate A + B1a predictions
        run: |
          python tools/keirin_nextgen5000_candidate_ab_preoutcome_materializer_v1.py \
            --pre-csv out/NEXTGEN5000_PRE_V2_${{ matrix.start }}_${{ matrix.end }}.csv \
            --out out/NEXTGEN5000_CANDIDATE_AB_PREOUTCOME_${{ matrix.start }}_${{ matrix.end }}.json
      - name: Assert firewalls
        run: |
          python - <<'PY'
          import csv,json,glob
          pre=glob.glob('out/NEXTGEN5000_PRE_V2_*.csv')[0]
          pred=glob.glob('out/NEXTGEN5000_CANDIDATE_AB_PREOUTCOME_*.json')[0]
          rows=list(csv.DictReader(open(pre,encoding='utf-8')))
          assert all(40<=float(r['competition_score'])<=130 for r in rows)
          assert all(2<=float(r['gear_ratio'])<=5 for r in rows)
          x=json.load(open(pred,encoding='utf-8'))
          assert x['safeguards']['result_accessed'] is False
          assert x['safeguards']['payout_accessed'] is False
          assert x['safeguards']['odds_accessed'] is False
          print('PASS_PRE_ROWS',len(rows))
          print('PASS_PRED_SUMMARY',json.dumps(x['summary'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: keirin-nextgen5000-corrected-v2-retry-${{ matrix.start }}-${{ matrix.end }}
          path: out/
          retention-days: 30
