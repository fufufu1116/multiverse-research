name: DEV2000 Stage7 Settlement Official Fetch
on:
  push:
    paths:
      - '.github/workflows/dev2000-stage7-settlement-official-fetch.yml'
permissions:
  contents: write
jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check lxml
      - name: Verify audited frozen bindings
        run: |
          test "$(git hash-object v3/historical_all_market/kdreams_settlement_recovery_v1.py)" = "b8b8ab0e0904541bd6fc45e7fe415d323e63ec45"
          test "$(git hash-object v3/historical_all_market/governance/STAGE7_TIME_SPLIT_SELECTION_VALIDATION_PREREG_v1.md)" = "0cb70520777d4ac9d00ddd90b888df1f403c3a7e"
          python - <<'PY'
          import json
          p='v3/historical_all_market/governance/INDEPENDENT_GEMINI_SETTLEMENT_BOUNDARY_APPROVE_RECEIPT_v1.json'
          x=json.load(open(p))
          assert x['verdict']=='APPROVE'
          assert x['DEV2000_SETTLEMENT_BULK']=='AUTHORIZED_FOR_FROZEN_STAGE7_ONLY'
          assert x['ECON_HOLDOUT1000']=='SEALED'
          PY
      - name: Fetch and parse authorized DEV2000 official Settlement
        run: |
          mkdir -p stage7_settlement_output
          python v3/historical_all_market/stage7_settlement_official_fetch_candidate_v1.py \
            --parser v3/historical_all_market/kdreams_settlement_recovery_v1.py \
            --output stage7_settlement_output/DEV2000_SETTLEMENT_OFFICIAL_FETCH_CANDIDATE_v1.jsonl \
            --receipt stage7_settlement_output/DEV2000_SETTLEMENT_OFFICIAL_FETCH_CANDIDATE_RECEIPT_v1.json \
            --workers 4
      - name: Package compact transport parts
        if: success()
        run: |
          mkdir -p v3/historical_all_market/runtime_artifacts/DEV2000_SETTLEMENT_OFFICIAL_FETCH_CANDIDATE_v1_parts
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib
          src=pathlib.Path('stage7_settlement_output/DEV2000_SETTLEMENT_OFFICIAL_FETCH_CANDIDATE_v1.jsonl')
          b=src.read_bytes(); enc=base64.b64encode(gzip.compress(b,9)).decode()
          d=pathlib.Path('v3/historical_all_market/runtime_artifacts/DEV2000_SETTLEMENT_OFFICIAL_FETCH_CANDIDATE_v1_parts')
          size=30000; parts=[enc[i:i+size] for i in range(0,len(enc),size)]
          for i,s in enumerate(parts): (d/f'part_{i:03d}.b64').write_text(s,encoding='ascii')
          rec=json.load(open('stage7_settlement_output/DEV2000_SETTLEMENT_OFFICIAL_FETCH_CANDIDATE_RECEIPT_v1.json'))
          rec['transport_encoding']='gzip+base64'; rec['transport_part_chars']=size; rec['transport_part_count']=len(parts); rec['uncompressed_sha256']=hashlib.sha256(b).hexdigest()
          pathlib.Path('v3/historical_all_market/runtime_receipts/DEV2000_SETTLEMENT_OFFICIAL_FETCH_CANDIDATE_RECEIPT_v1.json').write_text(json.dumps(rec,sort_keys=True,indent=2)+'\n')
          print('parts',len(parts),'encoded_chars',len(enc))
          PY
      - name: Commit transport receipt and parts
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/historical_all_market/runtime_artifacts/DEV2000_SETTLEMENT_OFFICIAL_FETCH_CANDIDATE_v1_parts v3/historical_all_market/runtime_receipts/DEV2000_SETTLEMENT_OFFICIAL_FETCH_CANDIDATE_RECEIPT_v1.json
          git commit -m 'Record authorized DEV2000 Settlement fetch candidate' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev2000-stage7-settlement-official-fetch-v1
          path: stage7_settlement_output/
          retention-days: 7
