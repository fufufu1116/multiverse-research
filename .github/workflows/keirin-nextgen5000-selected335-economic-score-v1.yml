name: Keirin NEXTGEN5000 Selected 335 Economic Score v1
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-nextgen5000-selected335-economic-score-v1.yml'
permissions:
  contents: read
  actions: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Download aggregate PREOUTCOME freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in out
          gh run download 34297933454 \
            -n keirin-nextgen5000-candidateab-aggregate-freeze-corrected-v2 \
            -D in
      - name: Fetch payout only for 335 preselected races
        run: |
          python tools/keirin_nextgen5000_selected_payout_recovery_v1.py \
            --aggregate-freeze in/KEIRIN_NEXTGEN5000_CANDIDATE_AB_PREOUTCOME_AGGREGATE_FREEZE_20260909_v1.json \
            --out-csv out/NEXTGEN5000_SELECTED335_PAYOUT.csv \
            --receipt out/NEXTGEN5000_SELECTED335_PAYOUT_RECEIPT.json \
            --workers 12
      - name: Score flat100 frozen economic rule
        run: |
          python tools/keirin_nextgen5000_candidate_ab_economic_scorer_v1.py \
            --prediction in/KEIRIN_NEXTGEN5000_CANDIDATE_AB_PREOUTCOME_AGGREGATE_FREEZE_20260909_v1.json \
            --payout out/NEXTGEN5000_SELECTED335_PAYOUT.csv \
            --out out/KEIRIN_NEXTGEN5000_CANDIDATE_AB_PRICE_INDEPENDENT_ECON_SCORE_v1.json
      - name: Print headline
        run: |
          python - <<'PY'
          import json
          x=json.load(open('out/KEIRIN_NEXTGEN5000_CANDIDATE_AB_PRICE_INDEPENDENT_ECON_SCORE_v1.json',encoding='utf-8'))
          print('PASS_HEADLINE',json.dumps(x['overall'],sort_keys=True))
          print('FIRST_HALF',json.dumps(x['chronological_first_half'],sort_keys=True))
          print('SECOND_HALF',json.dumps(x['chronological_second_half'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keirin-nextgen5000-selected335-economic-score-v1
          path: out/
          retention-days: 30
