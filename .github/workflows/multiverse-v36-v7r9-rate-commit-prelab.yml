name: MULTIVERSE V19.7.36 v7r12 Sealed-Authority Pre-Lab

on:
  push:
    branches:
      - agent/r1-stage1-phase-c-v19-7-36-v7r12-sealed-authority-snapshot-remediation-v1

permissions:
  contents: read

jobs:
  test-v7r12-sealed-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact event commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin https://github.com/fufufu1116/multiverse-research.git
          git -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'PRELAB_V7R12_EXACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PRELAB_V7R12_EXACT_TREE=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Static source and host negative tests
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          probe='governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R9_PREARM_RATE_READINESS_PROBE_20260903.go'
          testfile='governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R9_PREARM_RATE_READINESS_PROBE_20260903_test.go'
          helper='governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_UI_READY_WRITER_20260901.go'
          guard='governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R7_UI_READY_STATIC_ENV_GUARD_20260902.go'
          grep -F 'minBeforeComments=60' "$probe"
          grep -F 'minAfterComments=59' "$probe"
          grep -F 'SEALED_MEMFD_SNAPSHOT' "$probe"
          grep -F 'status_control_authority=OBSERVABILITY_ONLY' "$probe"
          grep -F 'requiredSeals=fSealSeal|fSealShrink|fSealGrow|fSealWrite' "$probe"
          grep -F 'setCommitNondumpable' "$probe"
          grep -F 'verifyNoTracer' "$probe"
          grep -F 'verifyPairExactAt' "$probe"
          grep -F 'TestFinalVerifyToExecSameUIDEvidenceMutationCannotAlterSealedAuthority' "$testfile"
          grep -F '/proc/%d/fd/%d' "$testfile"
          grep -F '/proc/%d/mem' "$testfile"
          grep -F 'attacker-in-place-control' "$testfile"
          grep -F 'os.Rename(p,moved)' "$testfile"
          grep -F 'prearmMinRateBeforeComments = 55' "$helper"
          grep -F 'prearmMinRateAfterComments = 54' "$helper"
          grep -F 'syscall.Exec(helperPath, argv, env)' "$guard"
          go test "$probe" "$testfile" -count=1
          printf 'PRELAB_V7R12_STATIC_AND_NEGATIVE_TEST_GATE_PASS=true\n'

      - name: Build exact image and bind inherited binaries
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          tag="multiverse-v7r12-sealed:${GITHUB_SHA}"
          docker build -f .devcontainer/Dockerfile -t "$tag" .
          test "$(docker run --rm --entrypoint /usr/bin/stat "$tag" -c '%u %g %a' /opt/multiverse/v36)" = '0 0 555'
          test "$(docker run --rm --entrypoint /usr/bin/stat "$tag" -c '%u %g %a' /opt/multiverse/v36/empty-config)" = '0 0 555'
          helper_sha="$(docker run --rm --entrypoint /usr/bin/sha256sum "$tag" /usr/local/bin/multiverse-v36-ui-ready-v7r7 | awk '{print $1}')"
          guard_sha="$(docker run --rm --entrypoint /usr/bin/sha256sum "$tag" /usr/local/bin/multiverse-v36-ui-ready-env-guard-v7r7 | awk '{print $1}')"
          test "$helper_sha" = '2fd9e085e866924fb52995e5bb5fcb58763bdbd1fa1ee2c96e1d57df28a42301'
          test "$guard_sha" = '470eee2ed9c4f3f4c5d629820f531c0126da36a38012ad96ea69cf6306f901e4'
          identity="$(docker run --rm --entrypoint /bin/cat "$tag" /opt/multiverse/v36/image-identity-v7r3.json)"
          grep -F 'V19.7.36-v7r12-image-identity' <<<"$identity"
          grep -F 'SEALED_MEMFD_SNAPSHOT_STATUS_CONTROL_OBSERVABILITY_ONLY' <<<"$identity"
          image_sha="$(printf '%s' "$identity" | sha256sum | awk '{print $1}')"
          sanitizer_sha="$(docker run --rm --entrypoint /usr/bin/sha256sum "$tag" /usr/local/bin/multiverse-v36-prearm-rate-sanitizer-v7r9 | awk '{print $1}')"
          probe_sha="$(docker run --rm --entrypoint /usr/bin/sha256sum "$tag" /usr/local/bin/multiverse-v36-prearm-rate-readiness-v7r9 | awk '{print $1}')"
          printf 'PRELAB_V7R12_HELPER_SHA256=%s\n' "$helper_sha"
          printf 'PRELAB_V7R12_GUARD_SHA256=%s\n' "$guard_sha"
          printf 'PRELAB_V7R12_IMAGE_IDENTITY_SHA256=%s\n' "$image_sha"
          printf 'PRELAB_V7R12_SANITIZER_SHA256=%s\n' "$sanitizer_sha"
          printf 'PRELAB_V7R12_RATE_PROBE_SHA256=%s\n' "$probe_sha"
          printf 'PRELAB_V7R12_ROOT_LOCK_ANCHOR_CLASS_PASS=true\n'

      - name: Exact-image direct same-UID final-boundary attack
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          tag="multiverse-v7r12-sealed:${GITHUB_SHA}"
          workvol="multiverse-v7r12-race-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$workvol" >/dev/null
          cleanup(){ docker volume rm -f "$workvol" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm -v "$workvol:/workspaces" --entrypoint /bin/bash "$tag" --noprofile --norc -c '
            set -euo pipefail
            uid="$(id -u codespace)"; gid="$(id -g codespace)"
            mkdir -p /workspaces/.codespaces/.persistedshare /workspaces/multiverse-research
            chown -R "${uid}:${gid}" /workspaces/.codespaces /workspaces/multiverse-research
            chmod 0755 /workspaces /workspaces/.codespaces /workspaces/.codespaces/.persistedshare /workspaces/multiverse-research
          '
          docker run --rm --user codespace -v "$workvol:/workspaces" -v "$PWD:/src:ro" -e GOCACHE=/tmp/go-cache --entrypoint /bin/bash "$tag" --noprofile --norc -c '
            set -euo pipefail; cd /src
            probe="governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R9_PREARM_RATE_READINESS_PROBE_20260903.go"
            testfile="governance/MULTIVERSE_R1_STAGE1_PHASE_C_V19_7_36_V7R9_PREARM_RATE_READINESS_PROBE_20260903_test.go"
            go test "$probe" "$testfile" -count=1 -run "TestConcurrentIndependentProcessesKeepGenerationPair|TestProductionLockAnchorRejectsPathReplacementAndSecondDomain|TestFinalVerifyToExecSameUIDEvidenceMutationCannotAlterSealedAuthority" -v
          '
          printf 'PRELAB_V7R12_DIRECT_SAME_UID_FINAL_BOUNDARY_RACE_GATE_PASS=true\n'
          printf 'PRELAB_V7R12_SEALED_AUTHORITY_SNAPSHOT_IMMUTABLE=true\n'
          printf 'PRELAB_V7R12_STATUS_CONTROL_OBSERVABILITY_ONLY=true\n'
          printf 'PRELAB_V7R12_SAME_UID_PROC_FD_MEM_DENIED=true\n'

      - name: Exact-image poisoned environment remains exactly two variables
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          tag="multiverse-v7r12-sealed:${GITHUB_SHA}"
          workvol="multiverse-v7r12-env-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$workvol" >/dev/null
          cleanup(){ docker volume rm -f "$workvol" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm -v "$workvol:/workspaces" --entrypoint /bin/bash "$tag" --noprofile --norc -c '
            set -euo pipefail; uid="$(id -u codespace)"; gid="$(id -g codespace)"; mkdir -p /workspaces/.codespaces/.persistedshare /workspaces/multiverse-research; chown -R "${uid}:${gid}" /workspaces/.codespaces /workspaces/multiverse-research; chmod 0755 /workspaces /workspaces/.codespaces /workspaces/.codespaces/.persistedshare /workspaces/multiverse-research
          '
          direct="$(docker run --rm --user codespace --network=none -v "$workvol:/workspaces" -e CODESPACES=true -e CODESPACE_NAME=rate-v7r12-test -e GOTRACEBACK=crash -e MULTIVERSE_EXTRA_POISON=YES --entrypoint /usr/local/bin/multiverse-v36-prearm-rate-readiness-v7r9 "$tag" 2>&1 || true)"
          grep -F 'PHASE_C_V19_7_36_V7R12_RATE_PROBE_DENIED:SANITIZER_ENV_COUNT' <<<"$direct"
          out="$(docker run --rm --user codespace --network=none -v "$workvol:/workspaces" -e CODESPACES=true -e CODESPACE_NAME=rate-v7r12-test -e GOTRACEBACK=crash -e MULTIVERSE_EXTRA_POISON=YES -e GITHUB_TOKEN=SHOULD_NOT_BE_USED -e HTTPS_PROXY=http://127.0.0.1:9 --entrypoint /usr/local/bin/multiverse-v36-prearm-rate-sanitizer-v7r9 "$tag" 2>&1)"
          grep -F 'PHASE_C_V19_7_36_V7R12_PREARM_RATE_NOT_READY' <<<"$out"
          grep -F 'reason=RATE_NETWORK' <<<"$out"
          grep -F 'one_shot_guard_consumed=false runtime=OFF' <<<"$out"
          status="$(docker run --rm -v "$workvol:/workspaces" --entrypoint /bin/cat "$tag" /workspaces/.codespaces/.persistedshare/multiverse-v36-v7r9-rate-readiness.txt)"
          control="$(docker run --rm -v "$workvol:/workspaces" --entrypoint /bin/cat "$tag" /workspaces/multiverse-research/MULTIVERSE_PRELIVE_START_HERE.md)"
          grep -F 'authority_source=SEALED_MEMFD_SNAPSHOT' <<<"$status"
          grep -F 'status_control_authority=OBSERVABILITY_ONLY' <<<"$status"
          grep -F 'authority_source=`SEALED_MEMFD_SNAPSHOT`' <<<"$control"
          grep -F 'status_control_authority=`OBSERVABILITY_ONLY`' <<<"$control"
          printf 'PRELAB_V7R12_EXACT_TWO_ENV_PROCESS_GATE_PASS=true\n'
          printf 'PRELAB_V7R12_INDEPENDENT_PROCESS_CONCURRENCY_GATE_PASS=true\n'
          printf 'PRELAB_V7R12_FILESYSTEM_NEGATIVE_GATE_PASS=true\n'
          printf 'PRELAB_V7R12_GENERATION_AND_EXACT_CONTENT_GATE_PASS=true\n'
          printf 'FINAL_COMMIT_RATE_FLOOR=60/59\n'
          printf 'INHERITED_HELPER_RATE_FLOOR=55/54\n'
          printf 'ONE_SHOT_GUARD_CONSUMED=false\n'
          printf 'SECURITY_AUTHORITY_GRANTED=false\n'
          printf 'RUNTIME=OFF\n'
