name: Keirin Q-PRE-SHARED-STATE-PROXY-1 v1 CI

on:
  push:
    branches:
      - research/keirin-parallel-mechanism-affinity-audit-20260901-v1
    paths:
      - '.github/workflows/keirin-q-pre-shared-state-proxy-1-v1-ci.yml'
      - 'v3/historical_all_market/research_candidates/KEIRIN_OWNER_APPROVAL_Q_PRE_SHARED_STATE_PROXY_1_20260901_v1.json'
      - 'v3/historical_all_market/research_candidates/KEIRIN_Q_PRE_SHARED_STATE_PROXY_1_PRESPEC_20260901_v1.json'
      - 'tools/keirin_q_pre_shared_state_proxy_1_v1.py'

permissions:
  contents: read

env:
  BASE_MAIN: 5c1403c1f5aabb80d29e8c868440aede8888ce61
  VNEXT_BLOB: afe746287c7e911d214202abdf2de076f63ab30c
  KEIRIN_STATE_BLOB: 962d9c75b0611d52bd264a8b88bb1fe259cb8aeb
  AUTH_RECEIPT_BLOB: 4c2e5364ad229a5dd413a19d0cf970c478692584
  DIGITAL_TWIN_BLOB: 1f1574400e43648e60af43d059965d021d8bbad8
  TOP3_CORE_BLOB: 4e2a819dce69240792d927cceba434f53932b829
  COMPARISON_BLOB: 9531715a8f346aec370bf1be24017a8ff577506b
  COEFF_RECEIPT_BLOB: f531d72929c846da1c932451873c94bb9b526ae7
  DESIGN_BLOB: 8372a0f783214d3f32264e3c00997647c0636d06
  ORACLE_EVIDENCE_BLOB: 6350cfc1312325289fdf57d92c4ef89c7b6d51d3
  MECHANISM_SYNTHESIS_BLOB: 0e8672f77f05b856b909b3bf5b5b7a37b002100e
  OWNER_APPROVAL_BLOB: 7159ea9d4e66eb8ffd6b3b7ed335e6e8036f223c
  PRESPEC_BLOB: afbad1d1be1e1c4a36b3b48e629bd4f5e7785837
  HARNESS_BLOB: bd41a0d8aab3dfaf049cb5589092132d43342555
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  q-pre-shared-state-proxy-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fresh governance and exact-source checks
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "OBSERVED_ORIGIN_MAIN=$(git rev-parse origin/main)"
          echo "EXECUTED_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git merge-base --is-ancestor "$BASE_MAIN" HEAD
          test "$(git rev-parse "origin/main:multiverse_vnext/VNEXT_CURRENT_STATE_v0.json")" = "$VNEXT_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json")" = "$KEIRIN_STATE_BLOB"
          test "$(git rev-parse "origin/main:governance/KEIRIN_LIMITED_SYNTHETIC_EXECUTION_AUTHORIZATION_RECEIPT_20260821_v1.json")" = "$AUTH_RECEIPT_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/new_lineage/digital_twin_v1.py")" = "$DIGITAL_TWIN_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/new_lineage/top3_architecture_core_v1.py")" = "$TOP3_CORE_BLOB"
          test "$(git rev-parse "origin/main:tools/keirin_synthetic_c0_c1_n1_comparison_v1.py")" = "$COMPARISON_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/governance/KEIRIN_FROZEN_PRE_HOLDOUT_COEFFICIENT_RECEIPT_v1.json")" = "$COEFF_RECEIPT_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_Q_PRE_SHARED_STATE_PROXY_1_DESIGN_20260901_v1.json")" = "$DESIGN_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_Q_ORACLE_SHARED_STATE_1_EVIDENCE_20260901_v1.json")" = "$ORACLE_EVIDENCE_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_PARALLEL_MECHANISM_EVIDENCE_SYNTHESIS_20260901_v1.json")" = "$MECHANISM_SYNTHESIS_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_OWNER_APPROVAL_Q_PRE_SHARED_STATE_PROXY_1_20260901_v1.json")" = "$OWNER_APPROVAL_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_Q_PRE_SHARED_STATE_PROXY_1_PRESPEC_20260901_v1.json")" = "$PRESPEC_BLOB"
          test "$(git rev-parse "HEAD:tools/keirin_q_pre_shared_state_proxy_1_v1.py")" = "$HARNESS_BLOB"

      - name: Verify exact Owner scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='v3/historical_all_market/research_candidates/KEIRIN_OWNER_APPROVAL_Q_PRE_SHARED_STATE_PROXY_1_20260901_v1.json'
          g=json.load(open(p, encoding='utf-8'))
          assert g['status']=='OWNER_EXPLICITLY_APPROVED_EXACT_SYNTHETIC_DIAGNOSTIC_CONTROL_ONLY'
          assert g['approval']=='APPROVE Q-PRE-SHARED-STATE-PROXY-1 — SYNTHETIC DIAGNOSTIC CONTROL ONLY'
          c=g['authorized_control']
          assert c['id']=='C1_PRE_LINE_MEAN_PROXY' and c['PRE_only'] is True
          assert c['coefficient']==0.16 and c['coefficient_fitting_or_sweep'] is False
          assert c['latent_skill_access'] is False and c['truth_distribution_access_by_control'] is False
          assert g['authorization_expansion_rule'].startswith('Completion of this exact diagnostic does not automatically')
          print('KEIRIN_Q_PRE_PROXY_OWNER_SCOPE_GATE_PASS')
          PY

      - name: Verify canonical scientific sources untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_MAIN"...HEAD > /tmp/changed.txt
          ! grep -Eq '^(multiverse_vnext/|v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json$|v3/historical_all_market/new_lineage/|governance/KEIRIN_LIMITED_SYNTHETIC_EXECUTION_AUTHORIZATION_RECEIPT_20260821_v1.json$)' /tmp/changed.txt

      - name: Reject network-capable diagnostic harness
        shell: bash
        run: |
          set -euo pipefail
          HARNESS=tools/keirin_q_pre_shared_state_proxy_1_v1.py
          ! grep -Eq '(^|[[:space:]])(requests|urllib|socket|subprocess|selenium|playwright)([[:space:].]|$)' "$HARNESS"
          ! grep -Eq 'https?://' "$HARNESS"

      - name: Execute fully prespecified Q-PRE-SHARED-STATE-PROXY-1
        shell: bash
        run: |
          set -euo pipefail
          python tools/keirin_q_pre_shared_state_proxy_1_v1.py | tee /tmp/qpre.log
          grep -Fx 'KEIRIN_Q_PRE_SHARED_STATE_PROXY_1_EXECUTION_PASS' /tmp/qpre.log
          head -n 1 /tmp/qpre.log > /tmp/result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/result.json', encoding='utf-8'))
          assert r['status']=='PASS_EXECUTION_AND_MECHANICAL_INVARIANTS'
          assert r['classification']=='RESEARCH_CANDIDATE_NOT_CANONICAL_NOT_ACCEPTED_NOT_PROMOTED'
          assert r['evidence_class']=='SYNTHETIC_ENGINEERING_FALSIFICATION_ONLY'
          assert r['world']=='W1' and r['total_cases']==512
          assert r['block_seed_bases']==[20261001,20262001,20263001,20264001]
          assert r['primary_classification'] in {'PROXY_BEATS_OR_TIES_N1','PROXY_IMPROVES_C1_BUT_N1_REMAINS_BETTER','PROXY_DOES_NOT_IMPROVE_C1'}
          assert r['materiality_label'] in {'MATERIAL_ORACLE_VALUE_RECOVERY','LIMITED_ORACLE_VALUE_RECOVERY','NO_OR_NEGATIVE_ORACLE_VALUE_RECOVERY'}
          assert 0.0 <= r['proxy_recovery_fraction'] <= 1.0
          c=r['proxy_control']
          assert c['id']=='C1_PRE_LINE_MEAN_PROXY' and c['formal_model_candidate'] is False
          assert c['PRE_only'] is True and c['coefficient']==0.16
          assert c['coefficient_fitted'] is False and c['coefficient_swept'] is False
          assert c['latent_skill_access'] is False and c['truth_distribution_access_by_control'] is False
          m=r['mechanical_checks']
          assert m['proxy_source_boundary_pass'] is True and m['PRE_latent_skill_absent'] is True
          assert m['max_line_mean_score_sanity_diff'] <= 1e-12
          assert m['max_nonoracle_C1_reproduction_diff'] <= 1e-12
          assert m['max_nonoracle_N1_reproduction_diff'] <= 1e-12
          assert m['max_prediction_probability_mass_error'] <= 1e-10
          assert m['max_truth_probability_mass_error'] <= 1e-10
          assert m['max_chain_decomposition_residual'] <= 1e-12
          assert m['prior_W1_N1_minus_C1_reproduction_error'] <= 2e-14
          assert r['new_seed_selection'] is False and r['result_adaptive_condition_selection'] is False
          assert r['post_result_retuning'] is False and r['models_or_frozen_coefficients_changed'] is False
          assert r['authorization_auto_expanded'] is False
          for key in ('protected_or_quarantined_input_access','pr15_metrics_access','result_payout_access','econ_holdout1000_access','dev2000_c_rescue','same_lineage_b_c_rescue_tuning','real_or_untouched_validation','real_live_input_collection','economics_bankroll_roi','model_promotion_or_freeze','external_provider_contact','core_phase_c_main_ruleset_runtime_production_authority_change','real_world_edge_or_roi_evidence'):
              assert r[key] is False, (key, r[key])
          assert r['scientific_segment_c_scoring_count']==0
          print('KEIRIN_Q_PRE_SHARED_STATE_PROXY_1_RESULT_CONTRACT_PASS')
          PY

      - name: Protected boundary terminal
        shell: bash
        run: |
          echo 'EVIDENCE_CLASS=SYNTHETIC_ENGINEERING_FALSIFICATION_ONLY'
          echo 'RESEARCH_CANDIDATE_ONLY=true'
          echo 'PRE_ONLY_PROXY_CONTROL=true'
          echo 'LATENT_SKILL_TO_PROXY=false'
          echo 'TRUTH_DISTRIBUTION_TO_PROXY=false'
          echo 'PR15_METRICS_ACCESSED=false'
          echo 'RESULT_PAYOUT_ACCESSED=false'
          echo 'ECON_HOLDOUT1000_ACCESSED=false'
          echo 'SCIENTIFIC_SEGMENT_C_SCORING_COUNT=0'
          echo 'REAL_LIVE_INPUT=false'
          echo 'ECONOMICS=false'
          echo 'MODEL_PROMOTION=false'
          echo 'AUTHORIZATION_AUTO_EXPANDED=false'

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"
