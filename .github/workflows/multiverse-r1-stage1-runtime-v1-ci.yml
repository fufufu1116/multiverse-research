name: Multiverse R1 Limited Internal Runtime Stage 1 Candidate CI v1

on:
  pull_request:
    paths:
      - '.github/workflows/multiverse-r1-stage1-runtime-v1-ci.yml'
      - 'governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OWNER_GATE_APPROVAL_20260821_v1.json'
      - 'governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_IMPLEMENTATION_CONTRACT_20260821_v1.json'
      - 'governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OPERATION_GRANT_20260821_v1.json'
      - 'tools/multiverse_r1_stage1_runtime_v1.py'
      - 'tools/multiverse_r1_stage1_authority_v1.py'
      - 'tools/multiverse_r1_stage1_git_runtime_v1.py'

permissions:
  contents: read

env:
  EXPECTED_BASE_MAIN: 3871de67900f31496ee9725a77ff1048cede906f
  REVIEWED_SCOPE_HEAD: 785e8d08029d57122076309fb4eb0b4c568c2229
  OWNER_APPROVAL_COMMENT: '5367308652'

jobs:
  stage1-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact base and seven-file remediation scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_MAIN"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$EXPECTED_BASE_MAIN"...HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/multiverse-r1-stage1-runtime-v1-ci.yml
          governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_IMPLEMENTATION_CONTRACT_20260821_v1.json
          governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OPERATION_GRANT_20260821_v1.json
          governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OWNER_GATE_APPROVAL_20260821_v1.json
          tools/multiverse_r1_stage1_authority_v1.py
          tools/multiverse_r1_stage1_git_runtime_v1.py
          tools/multiverse_r1_stage1_runtime_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Validate Owner Gate, separate P1 grant, and dormancy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          gate=json.load(open('governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OWNER_GATE_APPROVAL_20260821_v1.json'))
          contract=json.load(open('governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_IMPLEMENTATION_CONTRACT_20260821_v1.json'))
          grant=json.load(open('governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OPERATION_GRANT_20260821_v1.json'))
          assert gate['status']=='OWNER_APPROVED_SCOPE_SPECIFIC_STAGE1_IMPLEMENTATION_AND_CONDITIONAL_ACTIVATION'
          assert gate['owner_decision']['github_record_comment_id']==5367308652
          assert gate['fresh_read_at_approval']['reviewed_scope_head']=='785e8d08029d57122076309fb4eb0b4c568c2229'
          assert gate['fresh_read_at_approval']['lab_micro_verdict']=='PASS'
          assert contract['status']=='CONTROL_PLANE_REMEDIATION_CANDIDATE_OWNER_APPROVED_RUNTIME_NOT_ACTIVATED'
          assert contract['lab_remediation_basis']['prior_lab_result_comment']==5367753588
          assert contract['trusted_authority_control_plane']['caller_supplied_AuthorizationRuntime_or_valid_grant_set_accepted'] is False
          assert contract['single_invocation_interlock']['durable_claim_required_before_R1_side_effect'] is True
          assert contract['ceiling_and_crash_reconciliation']['restart_reconciles_all_unseen_durable_receipt_ids_before_new_claim'] is True
          assert contract['candidate_runtime_behavior']['runtime_workflow_present'] is False
          assert contract['candidate_runtime_behavior']['runtime_activation_performed'] is False
          assert contract['runtime_activation_authorized_now'] is False
          assert grant['status']=='ACTIVE_ONLY_WHEN_READ_FROM_CANONICAL_MAIN_AFTER_AUDIT'
          assert grant['owner_gate_approval_comment']==5367308652
          assert grant['authority_semantics']['owner_gate_is_reused_as_operation_grant'] is False
          assert grant['authority_semantics']['feature_branch_copy_is_authority'] is False
          assert grant['grant']['permission_class']=='P1_REVERSIBLE_INTERNAL_WRITE'
          assert grant['grant']['permission_ceiling']=='P1_REVERSIBLE_INTERNAL_WRITE'
          assert len(grant['grant']['operations'])==5
          assert grant['scope_ceiling']['max_concurrent_workers']==1
          assert grant['scope_ceiling']['max_terminal_tasks']==25
          assert grant['scope_ceiling']['runtime_window_days']==7
          assert grant['scope_ceiling']['source_collection_or_admission'] is False
          assert grant['activation_dependency']['this_record_alone_activates_runtime'] is False
          print('STAGE1_GATE_GRANT_AND_CONTRACT_VALID')
          PY
          if git cat-file -e "$EXPECTED_BASE_MAIN:governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OPERATION_GRANT_20260821_v1.json" 2>/dev/null; then
            echo 'Stage1 operation grant unexpectedly already exists on pre-remediation canonical main'
            exit 1
          fi
          echo 'FEATURE_BRANCH_GRANT_NOT_CANONICAL_AUTHORITY=true'

      - name: Reject public-web/source network imports and activation triggers
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[[:space:]])(import|from)[[:space:]]+(requests|urllib|httpx|aiohttp|socket|ftplib|paramiko)\b' tools/multiverse_r1_stage1_runtime_v1.py tools/multiverse_r1_stage1_authority_v1.py tools/multiverse_r1_stage1_git_runtime_v1.py; then
            echo 'public-web/source-network capable import found'
            exit 1
          fi
          grep -F 'R1_STAGE1_LIBRARY_ONLY_RUNTIME_OFF_NO_ACTIVATION_WORKFLOW' tools/multiverse_r1_stage1_runtime_v1.py
          p1='sche'; p2='dule:'
          p3='workflow_'; p4='dispatch:'
          p5='repository_'; p6='dispatch:'
          p7='pu'; p8='sh:'
          trigger_pattern="${p1}${p2}|${p3}${p4}|${p5}${p6}|${p7}${p8}"
          if grep -nE "$trigger_pattern" .github/workflows/multiverse-r1-stage1-runtime-v1-ci.yml; then
            echo 'candidate CI unexpectedly contains runtime/schedule trigger'
            exit 1
          fi

      - name: Run control-plane remediation negative evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/multiverse_r1_stage1_runtime_v1.py tools/multiverse_r1_stage1_authority_v1.py tools/multiverse_r1_stage1_git_runtime_v1.py
          PYTHONPATH=tools python tools/multiverse_r1_stage1_runtime_v1.py --selftest | tee /tmp/stage1.log
          grep -F 'CANONICAL_GIT_AUTHORITY_PROVENANCE_ENFORCED' /tmp/stage1.log
          grep -F 'CALLER_SUPPLIED_AUTHORIZATION_CONTEXT_REJECTED' /tmp/stage1.log
          grep -F 'EXPLICIT_AUTHORIZED_ENQUEUE_ONLY' /tmp/stage1.log
          grep -F 'RAW_GITHUB_EVENT_COMMENT_URL_NOT_AUTHORITY' /tmp/stage1.log
          grep -F 'REMOTE_SINGLE_INVOCATION_CAS_DISTINCT_PROCESS_REPLAY_REJECTED' /tmp/stage1.log
          grep -F 'RUNTIME_BRANCH_HIGH_WATER_ROLLBACK_DETECTED' /tmp/stage1.log
          grep -F 'DURABLE_R1_RECEIPT_RECONCILED_BEFORE_NEXT_CLAIM' /tmp/stage1.log
          grep -F 'TERMINAL_25_OR_7_DAY_AUTO_PAUSE_CONTRACT_ENFORCED' /tmp/stage1.log
          grep -F 'RUNTIME_STATE_SECOND_AUTHORITY_REJECTED' /tmp/stage1.log
          grep -F 'ADMITTED_AND_PERMISSION_LIKE_RUNTIME_STATE_DENIED' /tmp/stage1.log
          grep -F 'NETWORK_PUBLIC_WEB_ACCESS_PERFORMED=false' /tmp/stage1.log
          grep -F 'RUNTIME_ACTIVATION_PERFORMED=false' /tmp/stage1.log
          grep -F 'MULTIVERSE_R1_STAGE1_CONTROL_PLANE_SELFTEST_PASS' /tmp/stage1.log

      - name: Re-run canonical R1 safety selftest
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/multiverse_r1_source_vertical_slice_v2.py --selftest | tee /tmp/r1.log
          grep -F 'MULTIVERSE_R1_SOURCE_VERTICAL_SLICE_SELFTEST_PASS' /tmp/r1.log
          grep -F 'NETWORK_ACCESS_PERFORMED=false' /tmp/r1.log
          grep -F 'RUNTIME_ACTIVATION_PERFORMED=false' /tmp/r1.log
