name: Multiverse R1 Limited Internal Runtime Stage 1 Candidate CI v1

on:
  pull_request:
    paths:
      - '.github/workflows/multiverse-r1-stage1-runtime-v1-ci.yml'
      - 'governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OWNER_GATE_APPROVAL_20260821_v1.json'
      - 'governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_IMPLEMENTATION_CONTRACT_20260821_v1.json'
      - 'tools/multiverse_r1_stage1_runtime_v1.py'

permissions:
  contents: read

env:
  EXPECTED_BASE_MAIN: 3871de67900f31496ee9725a77ff1048cede906f
  REVIEWED_SCOPE_HEAD: 785e8d08029d57122076309fb4eb0b4c568c2229
  OWNER_APPROVAL_COMMENT: '5367308652'

jobs:
  stage1-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact base and candidate file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_MAIN"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$EXPECTED_BASE_MAIN"...HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/multiverse-r1-stage1-runtime-v1-ci.yml
          governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_IMPLEMENTATION_CONTRACT_20260821_v1.json
          governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OWNER_GATE_APPROVAL_20260821_v1.json
          tools/multiverse_r1_stage1_runtime_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Validate Owner Gate and dormant implementation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          gate=json.load(open('governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_OWNER_GATE_APPROVAL_20260821_v1.json'))
          contract=json.load(open('governance/MULTIVERSE_R1_LIMITED_INTERNAL_RUNTIME_STAGE1_IMPLEMENTATION_CONTRACT_20260821_v1.json'))
          assert gate['status']=='OWNER_APPROVED_SCOPE_SPECIFIC_STAGE1_IMPLEMENTATION_AND_CONDITIONAL_ACTIVATION'
          assert gate['owner_decision']['decision_text']=='すすめて'
          assert gate['owner_decision']['github_record_comment_id']==5367308652
          assert gate['fresh_read_at_approval']['canonical_main']=='3871de67900f31496ee9725a77ff1048cede906f'
          assert gate['fresh_read_at_approval']['reviewed_scope_head']=='785e8d08029d57122076309fb4eb0b4c568c2229'
          assert gate['fresh_read_at_approval']['lab_micro_verdict']=='PASS'
          assert gate['authorized_scope']['max_concurrent_workers']==1
          assert gate['authorized_scope']['max_terminal_tasks']==25
          assert gate['authorized_scope']['runtime_window_days']==7
          assert gate['authorized_scope']['network_or_public_web_authorized'] is False
          assert gate['authorized_scope']['source_collection_or_admission_authorized'] is False
          assert gate['runtime_activation_performed_by_this_receipt'] is False
          assert contract['status']=='FORMAL_IMPLEMENTATION_CANDIDATE_OWNER_APPROVED_RUNTIME_NOT_ACTIVATED_CONTROL_PLANE_HARDENED'
          assert contract['owner_gate']['approval_comment_id']==5367308652
          assert contract['enqueue_contract']['caller_supplied_wall_clock_allowed'] is False
          dp=contract['decision_provenance_contract']
          assert dp['validated_decision_objects_are_json_deep_copied_and_immutable_sealed_before_adapter_reentry'] is True
          assert dp['post_validation_mutation_of_adapter_owned_decision_dicts_can_change_consumed_decision'] is False
          assert 'R1_TASK_RECORD_FAILURE' in dp['required_decisions']
          tc=contract['trusted_clock_contract']
          assert tc['production_entrypoint_accepts_caller_wall_clock'] is False
          assert tc['enqueue_and_worker_authorization_runtime_now_must_match_exactly'] is True
          assert tc['trusted_time_is_used_for_7_day_ceiling'] is True
          cp=contract['control_plane_contract']
          assert cp['production_shaped_entrypoint_accepts_caller_supplied_authorization_runtime'] is False
          assert cp['production_shaped_entrypoint_accepts_caller_supplied_authorization_decisions'] is False
          assert cp['production_shaped_entrypoint_accepts_caller_supplied_wall_clock'] is False
          assert cp['single_invocation_claim_must_be_remote_durable_before_r1_side_effect'] is True
          assert cp['single_invocation_claim_requires_expected_old_head_cas'] is True
          assert cp['durable_r1_receipts_must_be_reconciled_into_terminal_count_before_new_work'] is True
          rc=contract['retry_contract']
          assert rc['retry_budget_per_task']==2
          assert rc['canonical_failure_operation']=='R1_TASK_RECORD_FAILURE'
          assert rc['expired_nonterminal_prior_lease_is_accounted_before_retry_work'] is True
          assert rc['fourth_attempt_after_three_failed_prior_attempts']=='DENY_DEAD_LETTER_AND_RELEASE_STAGE1_INVOCATION'
          dep=contract['trusted_authority_dependency']
          assert dep['control_plane_adapter_protocol_implemented'] is True
          assert dep['canonical_live_authority_snapshot_provider_in_this_candidate']=='NOT_IMPLEMENTED_AND_NOT_FAKED'
          assert dep['stage1_live_entrypoint_may_accept_trusted_authority_context_from_caller'] is False
          assert dep['stage1_live_entrypoint_may_accept_authorization_decisions_from_caller'] is False
          assert dep['stage1_live_entrypoint_may_accept_wall_clock_from_caller'] is False
          assert contract['candidate_runtime_behavior']['runtime_workflow_present'] is False
          assert contract['candidate_runtime_behavior']['runtime_activation_performed'] is False
          assert contract['runtime_activation_authorized_now'] is False
          assert contract['source_or_scientific_permission_expansion'] is False
          print('STAGE1_GATE_AND_CONTROL_PLANE_CONTRACT_VALID')
          PY

      - name: Reject hidden network or activation triggers in Stage 1 library
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[[:space:]])(import|from)[[:space:]]+(requests|urllib|httpx|aiohttp|socket|ftplib|paramiko)\b' tools/multiverse_r1_stage1_runtime_v1.py; then
            echo 'network-capable import found in Stage 1 runtime library'
            exit 1
          fi
          grep -F 'R1_STAGE1_LIBRARY_ONLY_RUNTIME_OFF_CONTROL_PLANE_ADAPTER_REQUIRED' tools/multiverse_r1_stage1_runtime_v1.py
          p1='sche'; p2='dule:'
          p3='workflow_'; p4='dispatch:'
          p5='repository_'; p6='dispatch:'
          p7='pu'; p8='sh:'
          trigger_pattern="${p1}${p2}|${p3}${p4}|${p5}${p6}|${p7}${p8}"
          if grep -nE "$trigger_pattern" .github/workflows/multiverse-r1-stage1-runtime-v1-ci.yml; then
            echo 'candidate CI unexpectedly contains runtime/schedule trigger'
            exit 1
          fi

      - name: Compile and run dedicated Stage 1 control-plane negative selftest
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/multiverse_r1_stage1_runtime_v1.py
          PYTHONPATH=tools python tools/multiverse_r1_stage1_runtime_v1.py --selftest | tee /tmp/stage1.log
          grep -F 'EXPLICIT_AUTHORIZED_ENQUEUE_ONLY' /tmp/stage1.log
          grep -F 'RAW_GITHUB_EVENT_COMMENT_URL_NOT_AUTHORITY' /tmp/stage1.log
          grep -F 'TRUSTED_AUTHORITY_CONTEXT_NOT_CALLER_INJECTABLE_ON_CONTROLLED_PATH' /tmp/stage1.log
          grep -F 'TRUSTED_AUTHORITY_PROVENANCE_FAIL_CLOSED' /tmp/stage1.log
          grep -F 'CALLER_SUPPLIED_AUTHORIZATION_DECISIONS_REJECTED_AT_ENQUEUE_SCHEMA' /tmp/stage1.log
          grep -F 'CANONICAL_ADAPTER_SUPPLIES_AUTHORIZATION_DECISION_OBJECTS' /tmp/stage1.log
          grep -F 'FORGED_BUT_OTHERWISE_VALID_ALLOW_DECISION_INJECTION_DENIED' /tmp/stage1.log
          grep -F 'AUTHORIZATION_DECISION_PAYLOAD_DIGEST_ENFORCED' /tmp/stage1.log
          grep -F 'POST_VALIDATION_DECISION_BUNDLE_MUTATION_ISOLATED' /tmp/stage1.log
          grep -F 'AUTHORIZATION_RUNTIME_CLOCK_BOUND_TO_TRUSTED_TIME' /tmp/stage1.log
          grep -F 'TRUSTED_CONTROL_PLANE_CLOCK_ENFORCES_7_DAY_CEILING' /tmp/stage1.log
          grep -F 'RETRY_BUDGET_2_ENFORCED_VIA_RECORD_FAILURE' /tmp/stage1.log
          grep -F 'FOURTH_ATTEMPT_BLOCKED_AFTER_INITIAL_PLUS_TWO_RETRIES' /tmp/stage1.log
          grep -F 'REMOTE_SINGLE_INVOCATION_CAS_SHARED_BACKEND_REJECTS_SECOND' /tmp/stage1.log
          grep -F 'STALE_CONTROL_PLANE_CLAIM_REJECTED' /tmp/stage1.log
          grep -F 'CROSS_STORE_RECEIPT_RECONCILIATION_AFTER_CRASH' /tmp/stage1.log
          grep -F 'DURABLE_RECEIPT_COUNTED_EXACTLY_ONCE_AFTER_RESTART' /tmp/stage1.log
          grep -F 'ROLLBACK_ANCESTRY_AND_HIGH_WATER_TAMPER_DENIED' /tmp/stage1.log
          grep -F 'TERMINAL_25_OR_7_DAY_AUTO_PAUSE_ENFORCED' /tmp/stage1.log
          grep -F 'RUNTIME_BRANCH_AND_PATH_BOUNDARY_ENFORCED' /tmp/stage1.log
          grep -F 'RUNTIME_STATE_SECOND_AUTHORITY_REJECTED' /tmp/stage1.log
          grep -F 'ADMITTED_AND_PERMISSION_LIKE_RUNTIME_STATE_DENIED' /tmp/stage1.log
          grep -F 'CONCRETE_LIVE_CONTROL_PLANE_ADAPTER_STILL_REQUIRED' /tmp/stage1.log
          grep -F 'NETWORK_ACCESS_PERFORMED=false' /tmp/stage1.log
          grep -F 'RUNTIME_ACTIVATION_PERFORMED=false' /tmp/stage1.log
          grep -F 'MULTIVERSE_R1_STAGE1_RUNTIME_SELFTEST_PASS' /tmp/stage1.log

      - name: Re-run canonical R1 safety selftest
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/multiverse_r1_source_vertical_slice_v2.py --selftest | tee /tmp/r1.log
          grep -F 'MULTIVERSE_R1_SOURCE_VERTICAL_SLICE_SELFTEST_PASS' /tmp/r1.log
          grep -F 'NETWORK_ACCESS_PERFORMED=false' /tmp/r1.log
          grep -F 'RUNTIME_ACTIVATION_PERFORMED=false' /tmp/r1.log
