name: Keirin Successor GirlsGap3 Complete Settlement Score v3
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-successor-girls-gap3-complete-settlement-score-v3.yml'
permissions:
  contents: read
  actions: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Download exact extended PREOUTCOME freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p freeze out
          gh run download 34305251240 -n keirin-successor-girls-gap3-preoutcome-freeze-extended-v1 -D freeze
      - name: Assert frozen sample unchanged
        run: |
          python - <<'PY'
          import json
          p='freeze/KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_PREOUTCOME_FREEZE_EXTENDED_20260909_v1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['summary']['selected_races']==81
          assert x['safeguards']['result_accessed'] is False
          assert x['safeguards']['payout_accessed'] is False
          assert x['safeguards']['odds_accessed'] is False
          print('PASS_UNCHANGED_FREEZE',x['summary'])
          PY
      - name: Recover all official settlement alternatives for same 81 races
        run: |
          python tools/keirin_successor_selected_3rentan_payout_recovery_v2.py \
            --freeze freeze/KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_PREOUTCOME_FREEZE_EXTENDED_20260909_v1.json \
            --out-csv out/SUCCESSOR_SELECTED_3RENTAN_ALL_SETTLEMENTS.csv \
            --receipt out/SUCCESSOR_SELECTED_3RENTAN_ALL_SETTLEMENTS_RECEIPT.json \
            --workers 12
      - name: Score exact frozen tickets
        run: |
          python tools/keirin_successor_girls_gap3_3rentan_complete_settlement_scorer_v1.py \
            --freeze freeze/KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_PREOUTCOME_FREEZE_EXTENDED_20260909_v1.json \
            --payout out/SUCCESSOR_SELECTED_3RENTAN_ALL_SETTLEMENTS.csv \
            --extension-spec v3/historical_all_market/research_candidates/KEIRIN_SUCCESSOR_GIRLS_3RENTAN_GAP3_UNTOUCHED_SAMPLE_SIZE_EXTENSION_20260909_v1.json \
            --out out/KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_COMPLETE_SETTLEMENT_SCORE_20260909_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keirin-successor-girls-gap3-complete-settlement-score-v3
          path: out/
          retention-days: 30
