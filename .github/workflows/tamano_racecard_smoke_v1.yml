# trigger: fresh completed noncandidate 2026-07-24 direct-receipt smoke
name: Tamano Racecard Smoke v1

on:
  push:
    paths:
      - '.github/workflows/tamano_racecard_smoke_v1.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install restricted adapter dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pymupdf

      - name: Synthetic hard-limit gate
        run: python v3/prospective/tamano_racecard_hardlimit_adapter_v1.py --synthetic

      - name: Single authorized completed non-candidate live smoke
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python v3/prospective/tamano_racecard_hardlimit_adapter_v1.py \
            --smoke \
            --event-day '2026-07-24' \
            --discovery-url 'https://www.tamano-keirin.jp/racepdf/' \
            --output tamano_live_receipt.json \
            2> tamano_live_stderr.txt
          echo $? > tamano_live_exit_code.txt
          exit 0

      - name: Build normalized diagnostic receipt
        run: |
          mkdir -p v3/prospective/runtime_receipts
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          adapter=Path('v3/prospective/tamano_racecard_hardlimit_adapter_v1.py')
          exit_code=int(Path('tamano_live_exit_code.txt').read_text().strip())
          err=Path('tamano_live_stderr.txt').read_text(errors='replace').strip()[:2000]
          out={
            'record':'TAMANO_RACECARD_RUNTIME_SMOKE_DIAGNOSTIC_v2',
            'workflow_commit_sha':os.environ['GITHUB_SHA'],
            'adapter_sha256':hashlib.sha256(adapter.read_bytes()).hexdigest(),
            'event_day':'2026-07-24',
            'raw_html_persisted':False,
            'raw_pdf_persisted':False,
            'shadow250_collected':0,
            'scientific_trial_consumed':False,
            'exit_code':exit_code
          }
          src=Path('tamano_live_receipt.json')
          if exit_code==0 and src.exists():
            try:
              d=json.loads(src.read_text())
              pages=d.get('region_anchor_receipt',[])
              if d.get('status')!='PASS' or len(pages)!=2:
                  raise ValueError('normalized receipt validation failed')
              if any(any(x for x in p.get('post_hits',{}).values()) for p in pages):
                  raise ValueError('POST sentinel hit in receipt')
              if d.get('raw_html_persisted') is not False or d.get('raw_pdf_persisted') is not False:
                  raise ValueError('raw persistence invariant failed')
              out.update({
                'status':'PASS',
                'capture_timestamp_utc':d['capture_timestamp_utc'],
                'discovery_url':d['discovery_url'],
                'discovery_content_hash':d['discovery_content_hash'],
                'pdf_url':d['pdf_url'],
                'pdf_raw_sha256':d['pdf_raw_sha256'],
                'pdf_byte_size':d['pdf_byte_size'],
                'region_anchor_receipt':pages,
                'error':None
              })
            except Exception as e:
              out.update({'status':'FAIL_CLOSED_RECEIPT_PARSE','error':type(e).__name__+': '+str(e)})
          else:
            out.update({'status':'FAIL_CLOSED_LIVE_SMOKE','error':err or 'receipt file missing'})
          Path('v3/prospective/runtime_receipts/tamano_racecard_smoke_diagnostic_v2.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Remove transient local receipt
        if: always()
        run: rm -f tamano_live_receipt.json tamano_live_stderr.txt tamano_live_exit_code.txt

      - name: Commit normalized diagnostic receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/prospective/runtime_receipts/tamano_racecard_smoke_diagnostic_v2.json
          git commit -m 'Record Tamano 7/24 runtime smoke diagnostic'
          git push

      - name: Final fail-closed verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('v3/prospective/runtime_receipts/tamano_racecard_smoke_diagnostic_v2.json').read_text())
          if d.get('status')!='PASS':
              raise SystemExit('FAIL_CLOSED Tamano live smoke: '+str(d.get('error')))
          print(json.dumps({'status':'PASS','pdf_url':d['pdf_url'],'pdf_sha256':d['pdf_raw_sha256'],'adapter_sha256':d['adapter_sha256']},ensure_ascii=False))
          PY
