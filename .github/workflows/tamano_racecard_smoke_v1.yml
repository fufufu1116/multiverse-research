# trigger: diagnostic restricted smoke after source APPROVE
name: Tamano Racecard Smoke v1

on:
  push:
    paths:
      - '.github/workflows/tamano_racecard_smoke_v1.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install restricted adapter dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pymupdf

      - name: Synthetic hard-limit gate
        run: python v3/prospective/tamano_racecard_hardlimit_adapter_v1.py --synthetic

      - name: Single authorized completed non-candidate live smoke with diagnostic capture
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python v3/prospective/tamano_racecard_hardlimit_adapter_v1.py \
            --smoke \
            --event-day '2026-07-29' \
            --discovery-url 'https://www.tamano-keirin.jp/racepdf/7-27%EF%BD%9E7-29-%E4%BB%A4%E5%92%8C8%E5%B9%B4%E5%BA%A6-%E7%AC%AC4%E5%9B%9E%E5%89%8D%E7%AF%80-%E7%8E%89%E9%87%8E%E5%B8%82%E5%96%B6%E7%8E%89%E9%87%8E%E7%AB%B6%E8%BC%AAf%E2%85%B0%E3%83%8A%E3%82%A4/' \
            --pdf-url 'https://www.tamano-keirin.jp/wp-content/uploads/2026/07/20260729-%E7%8E%89%E9%87%8E.pdf' \
            > tamano_live_stdout.json 2> tamano_live_stderr.txt
          echo $? > tamano_live_exit_code.txt
          exit 0

      - name: Build normalized PASS/FAIL diagnostic receipt
        run: |
          mkdir -p v3/prospective/runtime_receipts
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          adapter=Path('v3/prospective/tamano_racecard_hardlimit_adapter_v1.py')
          exit_code=int(Path('tamano_live_exit_code.txt').read_text().strip())
          err=Path('tamano_live_stderr.txt').read_text(errors='replace').strip()[:2000]
          out={
            'record':'TAMANO_RACECARD_RUNTIME_SMOKE_DIAGNOSTIC_v1',
            'workflow_commit_sha':os.environ['GITHUB_SHA'],
            'adapter_sha256':hashlib.sha256(adapter.read_bytes()).hexdigest(),
            'event_day':'2026-07-29',
            'raw_html_persisted':False,
            'raw_pdf_persisted':False,
            'shadow250_collected':0,
            'scientific_trial_consumed':False,
            'exit_code':exit_code
          }
          if exit_code==0:
            try:
              d=json.loads(Path('tamano_live_stdout.json').read_text())
              pages=d.get('region_anchor_receipt',[])
              if d.get('status')!='PASS' or len(pages)!=2 or any(any(x for x in p.get('post_hits',{}).values()) for p in pages):
                  raise ValueError('normalized receipt validation failed')
              out.update({
                'status':'PASS',
                'capture_timestamp_utc':d['capture_timestamp_utc'],
                'discovery_content_hash':d['discovery_content_hash'],
                'pdf_raw_sha256':d['pdf_raw_sha256'],
                'pdf_byte_size':d['pdf_byte_size'],
                'region_anchor_receipt':pages,
                'error':None
              })
            except Exception as e:
              out.update({'status':'FAIL_CLOSED_RECEIPT_PARSE','error':type(e).__name__+': '+str(e)})
          else:
            out.update({'status':'FAIL_CLOSED_LIVE_SMOKE','error':err})
          Path('v3/prospective/runtime_receipts/tamano_racecard_smoke_diagnostic_v1.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit diagnostic receipt regardless of live result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3/prospective/runtime_receipts/tamano_racecard_smoke_diagnostic_v1.json
          git commit -m 'Record Tamano racecard runtime smoke diagnostic'
          git push

      - name: Final fail-closed verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('v3/prospective/runtime_receipts/tamano_racecard_smoke_diagnostic_v1.json').read_text())
          if d.get('status')!='PASS':
              raise SystemExit('FAIL_CLOSED Tamano live smoke: '+str(d.get('error')))
          print(json.dumps({'status':'PASS','pdf_sha256':d['pdf_raw_sha256']},ensure_ascii=False))
          PY
