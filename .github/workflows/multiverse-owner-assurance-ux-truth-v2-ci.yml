name: Multiverse Owner Assurance UX Truth v2 CI

on:
  push:
    branches:
      - agent/multiverse-owner-assurance-ux-truth-v2
    paths:
      - 'tools/multiverse_owner_assurance_view_v2.py'
      - 'tools/multiverse_owner_assurance_view_selftest_v2.py'
      - '.github/workflows/multiverse-owner-assurance-ux-truth-v2-ci.yml'
  pull_request:
    paths:
      - 'tools/multiverse_owner_assurance_view_v2.py'
      - 'tools/multiverse_owner_assurance_view_selftest_v2.py'
      - '.github/workflows/multiverse-owner-assurance-ux-truth-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-assurance-ux-truth-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify exact head
        run: |
          echo "TARGET_SHA=${TARGET_SHA}"
          echo "CHECKED_OUT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Owner Assurance v2 selftest
        working-directory: tools
        run: python multiverse_owner_assurance_view_selftest_v2.py
      - name: Render refreshed v3 inputs
        run: |
          python tools/multiverse_owner_assurance_view_v2.py \
            --lifecycle governance/MULTIVERSE_OPEN_WORK_LIFECYCLE_REGISTRY_20260820_v3.json \
            --operational governance/KEIRIN_OPERATIONAL_STATE_SYNC_CANDIDATE_20260820_v3.json \
            --safe-mode governance/MULTIVERSE_SAFE_MODE_STATE_CANDIDATE_20260820_v2.json \
            > /tmp/owner_assurance_v2.md
          grep -F '今進める場所:** PR #22 Foundation Lab remediation candidate v1' /tmp/owner_assurance_v2.md
          grep -F '競輪研究:** PAUSED（科学実験停止中）' /tmp/owner_assurance_v2.md
          grep -F 'ECON_HOLDOUT1000:** SEALED' /tmp/owner_assurance_v2.md
          grep -F 'RESULT/PAYOUT:** UNAUTHORIZED' /tmp/owner_assurance_v2.md
      - name: Protected boundary terminal
        run: |
          echo 'MULTIVERSE_OWNER_ASSURANCE_UX_TRUTH_V2_EXACT_HEAD_CI_PASS'
          echo 'OWNER_FOCUS_DERIVED_FROM_OPERATIONAL_POINTER=true'
          echo 'SCIENTIFIC_EXECUTION_PERFORMED=false'
          echo 'RESULT_PAYOUT_ACCESSED=false'
          echo 'HOLDOUT_ACCESSED=false'
          echo 'PR15_QUARANTINED_METRICS_INSPECTED=false'
          echo 'SCIENTIFIC_RESUME_ALLOWED=false'
