name: keirin-sep10-nara-pending-support-resolver-v1-selftest
on:
  push:
    paths:
      - '.github/workflows/keirin-sep10-nara-pending-support-resolver-v1-selftest.yml'
permissions:
  contents: write
jobs:
  selftest:
    if: github.ref == 'refs/heads/research/keirin-real-evidence-dual-lane-20260901-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline Sep10 Nara pending support resolver selftest
        shell: bash
        run: |
          set -o pipefail
          python tools/keirin_sep10_nara_pending_support_candidate_resolver_v1.py selftest \
            | tee v3/historical_all_market/research_candidates/KEIRIN_SEP10_NARA_PENDING_SUPPORT_CANDIDATE_RESOLVER_SELFTEST_20260904_v1.json
      - name: Persist research-only selftest evidence
        if: always()
        run: |
          f=v3/historical_all_market/research_candidates/KEIRIN_SEP10_NARA_PENDING_SUPPORT_CANDIDATE_RESOLVER_SELFTEST_20260904_v1.json
          test -f "$f" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$f"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(keirin): persist Sep10 Nara pending resolver selftest v1'
          git push origin HEAD:${{ github.ref_name }}
