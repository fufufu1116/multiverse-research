name: Multiverse Security v3.3 Oracle v2 Zero Audit
on:
  workflow_dispatch:
  push:
    branches: [automation/security-v3.3-oracle-v2]
permissions:
  contents: read
jobs:
  zero-audit-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography google-genai
      - name: Syntax preflight
        run: python -m compileall -q oracle_candidate_v2 automation/security_v3_3_v2 candidate/security_v3_3
      - name: Create isolated test user and protect Oracle surface
        run: |
          sudo useradd --system --create-home --shell /usr/sbin/nologin mv_candidate
          sudo chown -R root:root oracle_candidate_v2
          sudo chmod -R a-w oracle_candidate_v2
          sudo chown root:root ZERO_AUDIT_ORACLE_V2_MANIFEST.json
          sudo chmod a-w ZERO_AUDIT_ORACLE_V2_MANIFEST.json
      - name: Run Oracle v2 repair loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          AUTOPILOT_OUTPUT_DIR: autopilot_v2_output
          MAX_REPAIRS: "8"
        run: |
          mkdir -p autopilot_v2_output
          python -m automation.security_v3_3_v2.orchestrator_v2
      - name: End manifest verification
        if: always()
        run: python oracle_candidate_v2/immutable_validator.py --verify-manifest WORKFLOW_END
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiverse-security-v3.3-oracle-v2-zero-audit
          path: autopilot_v2_output
          if-no-files-found: warn
