name: Keirin Burned Tactical Expansion Batch3 Replacement Frames V1

on:
  push:
    branches:
      - research/keirin-parallel-mechanism-affinity-audit-20260901-v1
    paths:
      - '.github/workflows/keirin-burned-tactical-expansion-batch3-replacement-frames-v1.yml'

permissions:
  contents: read

jobs:
  batch3-replacement-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download prespecified final-day R7 replacement official replay
        run: |
          set -euo pipefail
          mkdir -p /tmp/keirin-batch3-replacement/video
          curl --fail --location --retry 2 --output /tmp/keirin-batch3-replacement/video/r07.mp4 "https://wm.st.keirin.jp/wm-keirin13/20260808-13-01-07-01-00.mp4"
      - name: Record source hash and duration
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          p=Path('/tmp/keirin-batch3-replacement/video/r07.mp4')
          dur=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)], text=True).strip()
          out=[{'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'duration_seconds':round(float(dur),3),'bytes':p.stat().st_size}]
          Path('/tmp/keirin-batch3-replacement/source_manifest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Extract one-second human-review frames
        run: |
          set -euo pipefail
          mkdir -p /tmp/keirin-batch3-replacement/frames/r07
          ffmpeg -hide_banner -loglevel error -i /tmp/keirin-batch3-replacement/video/r07.mp4 -vf "fps=1,scale=960:-2,drawtext=text='%{pts\\:hms}':x=20:y=20:fontsize=30:fontcolor=white:box=1:boxcolor=black@0.65" -q:v 3 /tmp/keirin-batch3-replacement/frames/r07/r07_%03d.jpg
          find /tmp/keirin-batch3-replacement/frames -type f -name '*.jpg' | sort > /tmp/keirin-batch3-replacement/frame_manifest.txt
          wc -l /tmp/keirin-batch3-replacement/frame_manifest.txt
      - name: Upload source manifest
        uses: actions/upload-artifact@v4
        with:
          name: burned-tactical-expansion-batch3-replacement-source-manifest-v1
          path: /tmp/keirin-batch3-replacement/source_manifest.json
          retention-days: 14
      - name: Upload one-second frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: burned-tactical-expansion-batch3-replacement-frames-v1
          path: /tmp/keirin-batch3-replacement/frames
          retention-days: 7
      - name: Terminal boundary
        run: echo 'REGIME_SCREEN_THEN_HUMAN_PASS_A_ONLY_NO_AUTOMATED_TACTICAL_INFERENCE_NO_FINISH_TARGET'
