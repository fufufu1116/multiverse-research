name: System Improvement Event Continuation v1 CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run continuation regression suite
        run: python -m unittest tools.test_event_continuation_model_v1 tools.test_continuation_queue_v1
