name: Keirin Quarantine All-Market Payout Parser Smoke v1
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-quarantine-all-market-payout-parser-smoke-v1.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Parse quarantined race only
        run: |
          mkdir -p out
          python tools/keirin_nextgen5000_all_market_payout_recovery_v1.py \
            --start-position 2001 --end-position 2001 --workers 1 \
            --out-csv out/ALL_MARKET_2001.csv \
            --receipt out/ALL_MARKET_2001_RECEIPT.json
      - name: Assert known quarantined payout values
        run: |
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('out/ALL_MARKET_2001.csv',encoding='utf-8')))
          d={(r['market'],r['winning_ticket']):int(r['payout_yen_per_100']) for r in rows}
          assert d[('2shahuku','2=7')]==2220
          assert d[('3renhuku','2=5=7')]==3820
          assert d[('2shatan','7-2')]==2810
          assert d[('3rentan','7-2-5')]==15650
          assert d[('wide','2=5')]==530 and d[('wide','2=7')]==640 and d[('wide','5=7')]==610
          assert len(rows)==7
          print('PASS',d)
          PY
