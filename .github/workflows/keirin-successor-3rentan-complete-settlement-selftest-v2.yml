name: Keirin Successor 3Rentan Complete Settlement Selftest v2
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-successor-3rentan-complete-settlement-selftest-v2.yml'
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - run: python tools/keirin_successor_selected_3rentan_payout_recovery_selftest_v2.py
