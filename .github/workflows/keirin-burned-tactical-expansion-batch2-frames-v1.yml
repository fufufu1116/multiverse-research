name: Keirin Burned Tactical Expansion Batch2 Frames V1

on:
  push:
    branches:
      - research/keirin-parallel-mechanism-affinity-audit-20260901-v1
    paths:
      - '.github/workflows/keirin-burned-tactical-expansion-batch2-frames-v1.yml'

permissions:
  contents: read

jobs:
  batch2-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download prespecified day2 R1-R6 official replay sample
        run: |
          set -euo pipefail
          mkdir -p /tmp/keirin-batch2/video
          for r in 01 02 03 04 05 06; do
            curl --fail --location --retry 2 --output /tmp/keirin-batch2/video/r${r}.mp4 "https://wm.st.keirin.jp/wm-keirin13/20260807-13-01-${r}-01-00.mp4"
          done
      - name: Record source hashes and durations
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          out=[]
          for p in sorted(Path('/tmp/keirin-batch2/video').glob('*.mp4')):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              dur=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)], text=True).strip()
              out.append({'file':p.name,'sha256':h,'duration_seconds':round(float(dur),3),'bytes':p.stat().st_size})
          Path('/tmp/keirin-batch2/source_manifest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Extract one-second human-review frames
        run: |
          set -euo pipefail
          mkdir -p /tmp/keirin-batch2/frames
          for r in 01 02 03 04 05 06; do
            mkdir -p /tmp/keirin-batch2/frames/r${r}
            ffmpeg -hide_banner -loglevel error -i /tmp/keirin-batch2/video/r${r}.mp4 -vf "fps=1,scale=960:-2,drawtext=text='%{pts\\:hms}':x=20:y=20:fontsize=30:fontcolor=white:box=1:boxcolor=black@0.65" -q:v 3 /tmp/keirin-batch2/frames/r${r}/r${r}_%03d.jpg
          done
          find /tmp/keirin-batch2/frames -type f -name '*.jpg' | sort > /tmp/keirin-batch2/frame_manifest.txt
          wc -l /tmp/keirin-batch2/frame_manifest.txt
      - name: Upload source manifest
        uses: actions/upload-artifact@v4
        with:
          name: burned-tactical-expansion-batch2-source-manifest-v1
          path: /tmp/keirin-batch2/source_manifest.json
          retention-days: 14
      - name: Upload one-second frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: burned-tactical-expansion-batch2-frames-v1
          path: /tmp/keirin-batch2/frames
          retention-days: 7
      - name: Terminal boundary
        run: echo 'HUMAN_REVIEW_FRAMES_ONLY_NO_AUTOMATED_TACTICAL_INFERENCE_NO_FINISH_TARGET'
