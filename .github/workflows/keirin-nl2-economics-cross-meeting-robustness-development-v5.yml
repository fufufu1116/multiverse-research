name: Keirin NL2 Economics Cross-Meeting Robustness Development v5

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - v3/historical_all_market/historical_virtualworld_nl2_economics_cross_meeting_robustness_development_v5.py
      - v3/historical_all_market/research_candidates/KEIRIN_NL2_ECONOMICS_CROSS_MEETING_ROBUSTNESS_DEVELOPMENT_PREREG_20260913_v5.json
      - .github/workflows/keirin-nl2-economics-cross-meeting-robustness-development-v5.yml

permissions:
  contents: read

jobs:
  economics-cross-meeting-robustness-development-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install numpy requests beautifulsoup4 lxml
      - name: Verify frozen v5 development files before exposed evidence scoring
        shell: bash
        run: |
          test "$(sha256sum v3/historical_all_market/research_candidates/KEIRIN_NL2_ECONOMICS_CROSS_MEETING_ROBUSTNESS_DEVELOPMENT_PREREG_20260913_v5.json | awk '{print $1}')" = "c4a28ebb1808399cf3216a536196623f2233b669d2913408b455ef8853138bfc"
          test "$(sha256sum v3/historical_all_market/historical_virtualworld_nl2_economics_cross_meeting_robustness_development_v5.py | awk '{print $1}')" = "b82e348de81b29da57492413f449158706376896a67ba682a7288ee46ac00624"
      - name: Run preregistered exposed-only cross-meeting robustness development v5
        run: python v3/historical_all_market/historical_virtualworld_nl2_economics_cross_meeting_robustness_development_v5.py
      - name: Upload v5 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-nl2-economics-cross-meeting-robustness-development-v5
          path: v3/historical_all_market/research_candidates/nl2_economics_cross_meeting_robustness_development_v5/
          if-no-files-found: warn
