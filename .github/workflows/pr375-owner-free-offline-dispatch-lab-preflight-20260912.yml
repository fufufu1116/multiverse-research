name: pr375-owner-free-offline-dispatch-lab-preflight-20260912

on:
  push:
    branches:
      - agent/pr375-owner-free-offline-dispatch-lab-preflight-20260912

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      EXACT_HEAD: 0c533f9c9a761157e6d6c0d92de6ecd20d3b778f
      EXACT_TREE: a1da2b523cb797f84463b5e3dfbb1731454373af
      EXACT_MAIN: c3455ef933227d52a2aa365ff9a2befde431218e
      BUILDKITE_COMMIT: 0c533f9c9a761157e6d6c0d92de6ecd20d3b778f
      MULTIVERSE_DISPATCHER_REF: c3455ef933227d52a2aa365ff9a2befde431218e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact proof carrier boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_HEAD"
          test "$(git show -s --format=%T HEAD^)" = "$EXACT_TREE"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/pr375-owner-free-offline-dispatch-lab-preflight-20260912.yml"
          test "$(git show HEAD^:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml | git hash-object --stdin)" = "2d4ec751dee4e507a08313d403c7d0521c172ae5"
          test "$(git show HEAD^:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml | git hash-object --stdin)" = "c42bae003a3b1dc6d11cf5e6c33996369a4d22d6"
      - name: Canonical dispatcher + review against Fresh-bound deterministic fixture
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin "$EXACT_MAIN"
          git checkout -q --detach "$EXACT_HEAD"
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "$(git show -s --format=%T HEAD)" = "$EXACT_TREE"
          rm -rf .mv_dispatcher
          mkdir -p .mv_dispatcher
          git archive "$EXACT_MAIN" automation/review_dispatcher_v1 | tar -x -C .mv_dispatcher
          PYTHONPATH=.mv_dispatcher:. python3 - <<'PY'
          import json
          from pathlib import Path
          from automation.review_dispatcher_v1.dispatcher import discover_request
          from automation.review_dispatcher_v1.review import run_review

          repo='fufufu1116/multiverse-research'
          head='0c533f9c9a761157e6d6c0d92de6ecd20d3b778f'
          tree='a1da2b523cb797f84463b5e3dfbb1731454373af'
          main='c3455ef933227d52a2aa365ff9a2befde431218e'
          request_comment_id=5644720560
          freeze_id=5644716221
          request_sha='09dee40650d4b95e3be07a7188f48e5b5022a9be9cdbc360b1e70d855b3db6d1'
          request=json.loads(r'''{"base":"c3455ef933227d52a2aa365ff9a2befde431218e","execution_state":"FIXED_REQUEST_ONLY_BASELINE_OPPORTUNITY_ENGINE_SLICE_B_V6_REVIEW_REQUESTED","head":"0c533f9c9a761157e6d6c0d92de6ecd20d3b778f","lane":"LAB","main":"c3455ef933227d52a2aa365ff9a2befde431218e","mode":"REPOSITORY_ONLY","nonauthority":{"additional_spend":false,"database_mutation":false,"deploy":false,"live_business_effect":false,"main_mutation":false,"merge":false,"production_credentials":false,"production_deployment":false,"protected_data":false,"provider_effect_enablement":false,"provider_resource_mutation":false,"ruleset_mutation":false,"runtime_activation":false,"runtime_activation_bridge_enablement":false,"workflow_dispatch_rerun":false},"pr":375,"proof_ceiling":"OPPORTUNITY_ENGINE_SLICE_B_FORECAST_INTEGRITY_REPOSITORY_ONLY","recipe":{"durable_comments":[{"app_slug":"chatgpt-codex-connector","body_contains":["PR #375","0c533f9c9a761157e6d6c0d92de6ecd20d3b778f","a1da2b523cb797f84463b5e3dfbb1731454373af","Runtime OFF"],"id":5644716221,"login":"fufufu1116"}],"forbidden_patterns":["AIza","sk-ant-","sk-"],"http":null,"secret_scan_paths":["research/opportunity_engine_v0/SLICE_B_SUCCESSOR_BINDING_20260912.json","research/opportunity_engine_v0/forecast_ledger.py","research/opportunity_engine_v0/forecast_revision.py","research/opportunity_engine_v0/trend_forecast.py","research/opportunity_engine_v0/trend_retrospective.py","research/opportunity_engine_v0/test_forecast_ledger.py","research/opportunity_engine_v0/test_forecast_revision.py","research/opportunity_engine_v0/test_trend_forecast.py"],"source_rules":[{"contains":["FRESH_MAIN_SUCCESSOR_PRE_REVIEW_FREEZE","B_FORECAST_INTEGRITY","expected_unit_test_count","COMMITMENT_COLLISION_ON_SATURATED_DERIVED_SCORE_REPAIRED_AND_EXACTLY_CARRIED"],"not_contains":[],"path":"research/opportunity_engine_v0/SLICE_B_SUCCESSOR_BINDING_20260912.json"}],"subtrees":{},"unittest_modules":[{"count":3,"module":"research.opportunity_engine_v0.test_forecast_ledger"},{"count":7,"module":"research.opportunity_engine_v0.test_forecast_revision"},{"count":8,"module":"research.opportunity_engine_v0.test_trend_forecast"}],"validators":[]},"repo":"fufufu1116/multiverse-research","request_id":"pr375-opportunity-engine-slice-b-v6-lab-v1-main-c3455ef9","schema":"MULTIVERSE_REVIEW_REQUEST_v1","supersedes_request_sha256":null,"tree":"a1da2b523cb797f84463b5e3dfbb1731454373af","upstream":{}}''')
          freeze_body='PR #375\n'+head+'\n'+tree+'\nRuntime OFF\nbyte-identical to PR #361 v5'
          request_body='<!-- MULTIVERSE_REVIEW_REQUEST_V1 -->\n```json\n'+json.dumps(request,sort_keys=True,separators=(',',':'))+'\n```\nRuntime OFF'
          freeze_comment={
              'id': freeze_id,
              'body': freeze_body,
              'user': {'login':'fufufu1116','type':'User'},
              'performed_via_github_app': {'slug':'chatgpt-codex-connector'},
              'created_at':'2026-09-12T08:25:00Z',
          }
          request_comment={
              'id': request_comment_id,
              'body': request_body,
              'user': {'login':'fufufu1116','type':'User'},
              'performed_via_github_app': {'slug':'chatgpt-codex-connector'},
              'created_at':'2026-09-12T08:25:30Z',
          }
          pr_summary={'number':375,'state':'open','head':{'sha':head}}
          full_pr={'number':375,'state':'open','draft':True,'merged':False,'head':{'sha':head,'ref':'candidate/opportunity-engine-slice-b-fresh-main-20260912-v6'},'base':{'sha':main}}
          commit={'commit':{'tree':{'sha':tree}}}
          branch={'commit':{'sha':main}}
          comments=[freeze_comment,request_comment]

          def fetch(url):
              if '/commits/'+head+'/pulls' in url:
                  return pr_summary and [pr_summary]
              if url.endswith('/pulls/375'):
                  return full_pr
              if url.endswith('/commits/'+head):
                  return commit
              if url.endswith('/branches/main'):
                  return branch
              if '/issues/375/comments' in url:
                  return comments
              if url.endswith('/issues/comments/'+str(freeze_id)):
                  return freeze_comment
              raise AssertionError('UNEXPECTED_FIXTURE_URL:'+url)

          job=discover_request(repo=repo,lane='LAB',head=head,fetch=fetch)
          assert job['pr']==375
          assert job['head']==head
          assert job['tree']==tree
          assert job['base']==main
          assert job['main']==main
          assert job['request_comment']==request_comment_id
          assert job['request_sha256']==request_sha
          assert job['request_id']=='pr375-opportunity-engine-slice-b-v6-lab-v1-main-c3455ef9'
          print('OFFLINE_CANONICAL_DISPATCH_SELECTION=PASS')
          print('REQUEST_SHA256='+job['request_sha256'])

          artifact=run_review(job,repo_root=Path('.'),fetch=fetch)
          assert artifact['verdict']=='PASS', artifact['findings']
          assert artifact['findings']==[]
          assert artifact['test_count']==18
          assert artifact['reviewed_head']==head
          assert artifact['reviewed_tree']==tree
          assert artifact['reviewed_base']==main
          assert artifact['reviewed_main']==main
          print('OFFLINE_CANONICAL_REVIEW=PASS')
          print('FULL_APPLICABLE_TESTS=18/18_PASS')
          print('FINDINGS=[]')
          print('PUBLICATION_ATTEMPTED=NO')
          print('OWNER_BUILD_CONSUMED=NO')
          print('RUNTIME=OFF')
          PY
