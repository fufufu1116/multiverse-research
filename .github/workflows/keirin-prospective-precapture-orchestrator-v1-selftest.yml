name: keirin-prospective-precapture-orchestrator-v1-selftest

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - tools/keirin_kdreams_prospective_precapture_orchestrator_v1.py
      - .github/workflows/keirin-prospective-precapture-orchestrator-v1-selftest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/keirin-real-evidence-dual-lane-20260901-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run offline orchestrator selftest
        run: |
          mkdir -p v3/historical_all_market/research_candidates
          python tools/keirin_kdreams_prospective_precapture_orchestrator_v1.py selftest             > v3/historical_all_market/research_candidates/KEIRIN_KDREAMS_PROSPECTIVE_PRECAPTURE_ORCHESTRATOR_SELFTEST_20260904_v1.json
          python - <<'PY'
          import json
          p="v3/historical_all_market/research_candidates/KEIRIN_KDREAMS_PROSPECTIVE_PRECAPTURE_ORCHESTRATOR_SELFTEST_20260904_v1.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x["status"]=="PASS", x
          assert x["network_access"] is False
          assert x["result_accessed"] is False
          assert x["support_increment_authorized_now"] == 0
          assert x["result_join_authorized"] is False
          assert x["model_fit_authorized"] is False
          print(json.dumps({"record":x["record"],"status":x["status"]},sort_keys=True))
          PY
      - name: Persist research-only selftest evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/historical_all_market/research_candidates/KEIRIN_KDREAMS_PROSPECTIVE_PRECAPTURE_ORCHESTRATOR_SELFTEST_20260904_v1.json
          if git diff --cached --quiet; then
            echo "No evidence delta"
            exit 0
          fi
          git commit -m "research(keirin): persist prospective PRE capture orchestrator v1 selftest"
          git pull --rebase origin research/keirin-real-evidence-dual-lane-20260901-v1
          git push origin HEAD:research/keirin-real-evidence-dual-lane-20260901-v1
