name: Keirin JulAug2026 Result Blind Universe Discovery v1
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-julaug2026-result-blind-universe-discovery-v1.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Discover July-August race identities only
        run: |
          mkdir -p out
          python tools/keirin_julaug2026_result_blind_universe_discovery_v1.py \
            --out-csv out/KEIRIN_JULAUG2026_RESULT_BLIND_UNIVERSE_v1.csv \
            --receipt out/KEIRIN_JULAUG2026_RESULT_BLIND_UNIVERSE_RECEIPT_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: keirin-julaug2026-result-blind-universe-v1
          path: out/
          retention-days: 30
