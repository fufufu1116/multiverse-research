name: Keirin NL2 Economics Robustness Development and Untouched Validation v2

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - v3/historical_all_market/historical_virtualworld_nl2_economics_robustness_validation_v2.py
      - v3/historical_all_market/historical_virtualworld_nl2_economics_validation_v1.py
      - v3/historical_all_market/historical_virtualworld_nl2_economics_validation_v1_technical_fix.py
      - v3/historical_all_market/research_candidates/KEIRIN_NL2_ECONOMICS_ROBUSTNESS_DEVELOPMENT_AND_UNTOUCHED_VALIDATION_PREREG_20260913_v2.json
      - v3/historical_all_market/research_candidates/KEIRIN_NEW_LINEAGE_STABILITY_MODEL_FREEZE_20260913_v2.json
      - v3/historical_all_market/research_candidates/KEIRIN_NEW_LINEAGE_MODEL_FREEZE_20260913_v1.json
      - v3/historical_all_market/kdreams_price_catalog_recovery_v1.py
      - v3/historical_all_market/kdreams_settlement_recovery_v1.py
      - v3/historical_all_market/stage1_pl_ticket_probability_engine_v1.py
      - .github/workflows/keirin-nl2-economics-robustness-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economics-robustness-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install numpy requests beautifulsoup4 lxml
      - name: Run preregistered NL2 economics robustness v2
        run: python v3/historical_all_market/historical_virtualworld_nl2_economics_robustness_validation_v2.py
      - name: Upload v2 economics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-nl2-economics-robustness-v2
          path: v3/historical_all_market/research_candidates/nl2_economics_robustness_development_and_untouched_validation_v2/
          if-no-files-found: warn
