name: Keirin Q-PRE-PROXY-CAUSE-DECOMP-1 v1 CI

on:
  push:
    branches:
      - research/keirin-parallel-mechanism-affinity-audit-20260901-v1
    paths:
      - '.github/workflows/keirin-q-pre-proxy-cause-decomp-1-v1-ci.yml'
      - 'v3/historical_all_market/research_candidates/KEIRIN_OWNER_APPROVAL_Q_PRE_PROXY_CAUSE_DECOMP_1_20260901_v1.json'
      - 'v3/historical_all_market/research_candidates/KEIRIN_Q_PRE_PROXY_CAUSE_DECOMP_1_PRESPEC_20260901_v1.json'
      - 'tools/keirin_q_pre_proxy_cause_decomp_1_v1.py'

permissions:
  contents: read

env:
  BASE_MAIN_ANCESTOR: 5c1403c1f5aabb80d29e8c868440aede8888ce61
  VNEXT_BLOB: afe746287c7e911d214202abdf2de076f63ab30c
  KEIRIN_STATE_BLOB: 962d9c75b0611d52bd264a8b88bb1fe259cb8aeb
  AUTH_RECEIPT_BLOB: 4c2e5364ad229a5dd413a19d0cf970c478692584
  DIGITAL_TWIN_BLOB: 1f1574400e43648e60af43d059965d021d8bbad8
  TOP3_CORE_BLOB: 4e2a819dce69240792d927cceba434f53932b829
  COMPARISON_BLOB: 9531715a8f346aec370bf1be24017a8ff577506b
  COEFF_RECEIPT_BLOB: f531d72929c846da1c932451873c94bb9b526ae7
  PRIOR_PROXY_EVIDENCE_BLOB: 869f50ec460d0ae41920b960060ea1bbad508d01
  SYNTHESIS_V2_BLOB: 6edb7b259ac0673f5f3c76e1b9bc38109c0cd6c7
  OWNER_APPROVAL_BLOB: ebe6bc4b65b5fc009f36a880eda95e90b318ee1e
  PRESPEC_BLOB: c124af83e36e11a794b2e7cd4e35e0299a0b0e3d
  HARNESS_BLOB: fda83d10d5bc8a15d6be12d46088e3beab460afa
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  q-pre-proxy-cause-decomp-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fresh governance and exact-source checks
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "OBSERVED_ORIGIN_MAIN=$(git rev-parse origin/main)"
          echo "EXECUTED_HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_MAIN_ANCESTOR" origin/main
          git merge-base --is-ancestor "$BASE_MAIN_ANCESTOR" HEAD
          test "$(git rev-parse "origin/main:multiverse_vnext/VNEXT_CURRENT_STATE_v0.json")" = "$VNEXT_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json")" = "$KEIRIN_STATE_BLOB"
          test "$(git rev-parse "origin/main:governance/KEIRIN_LIMITED_SYNTHETIC_EXECUTION_AUTHORIZATION_RECEIPT_20260821_v1.json")" = "$AUTH_RECEIPT_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/new_lineage/digital_twin_v1.py")" = "$DIGITAL_TWIN_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/new_lineage/top3_architecture_core_v1.py")" = "$TOP3_CORE_BLOB"
          test "$(git rev-parse "origin/main:tools/keirin_synthetic_c0_c1_n1_comparison_v1.py")" = "$COMPARISON_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/governance/KEIRIN_FROZEN_PRE_HOLDOUT_COEFFICIENT_RECEIPT_v1.json")" = "$COEFF_RECEIPT_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_Q_PRE_SHARED_STATE_PROXY_1_EVIDENCE_20260901_v1.json")" = "$PRIOR_PROXY_EVIDENCE_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_PARALLEL_MECHANISM_EVIDENCE_SYNTHESIS_20260901_v2.json")" = "$SYNTHESIS_V2_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_OWNER_APPROVAL_Q_PRE_PROXY_CAUSE_DECOMP_1_20260901_v1.json")" = "$OWNER_APPROVAL_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_Q_PRE_PROXY_CAUSE_DECOMP_1_PRESPEC_20260901_v1.json")" = "$PRESPEC_BLOB"
          test "$(git rev-parse "HEAD:tools/keirin_q_pre_proxy_cause_decomp_1_v1.py")" = "$HARNESS_BLOB"

      - name: Verify exact Owner cause-decomposition gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='v3/historical_all_market/research_candidates/KEIRIN_OWNER_APPROVAL_Q_PRE_PROXY_CAUSE_DECOMP_1_20260901_v1.json'
          g=json.load(open(p, encoding='utf-8'))
          assert g['status']=='OWNER_EXPLICITLY_APPROVED_EXACT_PRE_ONLY_CAUSE_DECOMPOSITION_DIAGNOSTIC'
          assert g['approval']=='APPROVE NEXT PRE-ONLY MECHANISM DIAGNOSTIC — CAUSE DECOMPOSITION ONLY'
          assert g['authorized_execution_family']['diagnostic_controls_only']==['C1_SELF_SCORE_COMPONENT_ONLY','C1_PEER_SCORE_COMPONENT_ONLY_SAME_DENOMINATOR']
          assert g['control_boundaries']['PRE_only'] is True
          assert g['control_boundaries']['latent_skill_access_by_controls'] is False
          assert g['control_boundaries']['truth_distribution_access_by_controls'] is False
          assert g['hard_conditions']['cause_decomposition_only_not_proxy_search'] is True
          assert g['hard_conditions']['coefficient_search'] is False
          assert g['hard_conditions']['result_adaptive_diagnostic_family_addition'] is False
          print('KEIRIN_PRE_PROXY_CAUSE_DECOMP_OWNER_GATE_PASS')
          PY

      - name: Verify canonical scientific sources untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_MAIN_ANCESTOR"...HEAD > /tmp/changed.txt
          ! grep -Eq '^(multiverse_vnext/|v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json$|v3/historical_all_market/new_lineage/|governance/KEIRIN_LIMITED_SYNTHETIC_EXECUTION_AUTHORIZATION_RECEIPT_20260821_v1.json$)' /tmp/changed.txt

      - name: Reject network-capable diagnostic harness
        shell: bash
        run: |
          set -euo pipefail
          HARNESS=tools/keirin_q_pre_proxy_cause_decomp_1_v1.py
          ! grep -Eq '(^|[[:space:]])(requests|urllib|socket|subprocess|selenium|playwright)([[:space:].]|$)' "$HARNESS"
          ! grep -Eq 'https?://' "$HARNESS"

      - name: Execute fully prespecified cause decomposition
        shell: bash
        run: |
          set -euo pipefail
          python tools/keirin_q_pre_proxy_cause_decomp_1_v1.py | tee /tmp/qcause.log
          grep -Fx 'KEIRIN_Q_PRE_PROXY_CAUSE_DECOMP_1_EXECUTION_PASS' /tmp/qcause.log
          head -n 1 /tmp/qcause.log > /tmp/result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/result.json', encoding='utf-8'))
          assert r['status']=='PASS_EXECUTION_AND_MECHANICAL_INVARIANTS'
          assert r['classification']=='RESEARCH_CANDIDATE_NOT_CANONICAL_NOT_ACCEPTED_NOT_PROMOTED'
          assert r['evidence_class']=='SYNTHETIC_ENGINEERING_FALSIFICATION_ONLY'
          assert r['world']=='W1' and r['total_cases']==512
          assert r['block_seed_bases']==[20261001,20262001,20263001,20264001]
          assert r['empirical_classification'] in {
              'A_B_SELF_DOUBLECOUNTING_DOMINANT','A_B_PLUS_C_OR_E_MIXED',
              'C_OR_D_PEER_FAILURE_WITHOUT_SELF_HARM','E_NONLINEAR_COMBINATION',
              'NO_DEGRADATION_REPRODUCED_OR_OTHER'}
          m=r['mechanical_checks']
          assert m['control_source_boundary_pass'] is True and m['PRE_latent_skill_absent'] is True
          assert m['max_SELF_plus_PEER_vs_NAIVE_utility_diff'] <= 1e-12
          assert m['max_reconstructed_NAIVE_distribution_diff'] <= 1e-12
          assert m['max_non_diagnostic_C1_reproduction_diff'] <= 1e-12
          assert m['max_non_diagnostic_N1_reproduction_diff'] <= 1e-12
          assert m['max_prediction_probability_mass_error'] <= 1e-10
          assert m['max_truth_probability_mass_error'] <= 1e-10
          assert m['max_chain_decomposition_residual'] <= 1e-12
          assert m['prior_C1_reproduction_error'] <= 2e-14
          assert m['prior_N1_reproduction_error'] <= 2e-14
          assert m['prior_NAIVE_reproduction_error'] <= 2e-14
          a=r['analytic_measurement_error']
          assert a['observation_noise_sd']==0.55 and a['observation_noise_variance']==0.30250000000000005
          assert a['raw_shared_mean_coefficient']==0.16
          assert a['posterior_shrinkage_kappa'] < 1.0
          assert a['shrinkage_corrected_control_executed'] is False
          assert r['new_seed_selection'] is False and r['post_hoc_slice'] is False
          assert r['result_adaptive_diagnostic_family_addition'] is False
          assert r['post_result_retuning'] is False and r['models_or_frozen_coefficients_changed'] is False
          assert r['authorization_auto_expanded'] is False
          for key in ('protected_or_quarantined_input_access','pr15_metrics_access','result_payout_access','econ_holdout1000_access','dev2000_c_rescue','same_lineage_b_c_rescue_tuning','real_or_untouched_validation','real_live_input_collection','economics_bankroll_roi','model_promotion_or_freeze','external_provider_contact','core_phase_c_main_ruleset_runtime_production_authority_change','real_world_edge_or_roi_evidence'):
              assert r[key] is False, (key, r[key])
          assert r['scientific_segment_c_scoring_count']==0
          print('KEIRIN_Q_PRE_PROXY_CAUSE_DECOMP_1_RESULT_CONTRACT_PASS')
          PY

      - name: Protected boundary terminal
        shell: bash
        run: |
          echo 'EVIDENCE_CLASS=SYNTHETIC_ENGINEERING_FALSIFICATION_ONLY'
          echo 'RESEARCH_CANDIDATE_ONLY=true'
          echo 'CAUSE_DECOMPOSITION_ONLY=true'
          echo 'NEW_PROXY_SEARCH=false'
          echo 'COEFFICIENT_SEARCH=false'
          echo 'LATENT_SKILL_TO_CONTROLS=false'
          echo 'TRUTH_DISTRIBUTION_TO_CONTROLS=false'
          echo 'PR15_METRICS_ACCESSED=false'
          echo 'RESULT_PAYOUT_ACCESSED=false'
          echo 'ECON_HOLDOUT1000_ACCESSED=false'
          echo 'SCIENTIFIC_SEGMENT_C_SCORING_COUNT=0'
          echo 'REAL_LIVE_INPUT=false'
          echo 'ECONOMICS=false'
          echo 'MODEL_PROMOTION=false'
          echo 'AUTHORIZATION_AUTO_EXPANDED=false'

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"
