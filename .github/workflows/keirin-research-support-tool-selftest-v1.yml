name: keirin-research-support-tool-selftest-v1

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-research-support-tool-selftest-v1.yml'
      - 'tools/keirin_support_receipt_guard_v1.py'
      - 'tools/keirin_support_provenance_validator_v1.py'
      - 'tools/keirin_support_receipt_builder_v1.py'
      - 'tools/keirin_support_gate_partial_evaluator_v1.py'
      - 'v3/historical_all_market/research_candidates/KEIRIN_SUPPORT_RECEIPT_DUPLICATE_PROVENANCE_PRESPEC_20260906_v1.json'
      - 'v3/historical_all_market/research_candidates/KEIRIN_RIDER_CIRCUMFERENCE_SUPPORT_ADEQUACY_GATE_PRESPEC_20260903_v1.json'
      - 'v3/historical_all_market/research_candidates/KEIRIN_HOFU_KAWASAKI_CROSS_CIRCUMFERENCE_SUPPORT_RECEIPT_20260904_v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Receipt guard selftest
        run: python tools/keirin_support_receipt_guard_v1.py selftest
      - name: Full provenance validator selftest
        run: python tools/keirin_support_provenance_validator_v1.py selftest
      - name: Receipt builder selftest
        run: python tools/keirin_support_receipt_builder_v1.py selftest
      - name: Partial support gate evaluator selftest
        run: python tools/keirin_support_gate_partial_evaluator_v1.py selftest
      - name: Evaluate confirmed support receipt
        run: |
          python tools/keirin_support_gate_partial_evaluator_v1.py evaluate \
            v3/historical_all_market/research_candidates/KEIRIN_HOFU_KAWASAKI_CROSS_CIRCUMFERENCE_SUPPORT_RECEIPT_20260904_v1.json \
            --out /tmp/gate.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/gate.json'))
          assert x['status']=='FAIL_KNOWN_DIMENSION'
          assert x['checks']['unique_cross_circumference_supported_riders']['value']==1
          assert x['checks']['minimum_supported_rider_race_rows']['value']==2
          assert len(x['unknown_dimensions'])==2
          assert x['full_gate_pass_authorized'] is False
          PY
