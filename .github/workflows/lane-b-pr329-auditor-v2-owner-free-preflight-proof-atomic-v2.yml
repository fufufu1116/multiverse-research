name: lane-b-pr329-auditor-v2-owner-free-preflight-atomic-proof-v2

on:
  push:
    branches:
      - agent/lane-b-pr329-auditor-v2-owner-free-preflight-proof-atomic-20260911-v2

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify atomic proof ref and exact fixed bindings
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=d71461da53d2498e42edcd92e987a26a59a95cd9
          TREE=a2bf5a25abeffed80deacfa5299e97ddee559840
          MAIN=d1edc2eabb847c10a4faa59a039b480e85dfb0e4
          LAB_BLOB=2d4ec751dee4e507a08313d403c7d0521c172ae5
          AUDITOR_BLOB=c42bae003a3b1dc6d11cf5e6c33996369a4d22d6
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse HEAD)" != "$CANDIDATE"
          test "$(git show -s --format=%T "$CANDIDATE")" = "$TREE"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse "$MAIN:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml")" = "$LAB_BLOB"
          test "$(git rev-parse "$CANDIDATE:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml")" = "$LAB_BLOB"
          test "$(git rev-parse "$MAIN:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml")" = "$AUDITOR_BLOB"
          test "$(git rev-parse "$CANDIDATE:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml")" = "$AUDITOR_BLOB"
          echo ATOMIC_PROOF_REF=PASS
          echo VISIBLE_HEAD_IS_PROOF_COMMIT=PASS
          echo FIXED_LAB_STEPS=$LAB_BLOB
          echo FIXED_AUDITOR_STEPS=$AUDITOR_BLOB

      - name: Materialize exact Candidate canonical dispatcher and tooling
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=d71461da53d2498e42edcd92e987a26a59a95cd9
          MAIN=d1edc2eabb847c10a4faa59a039b480e85dfb0e4
          TOOLING=c3e5bbd340b6da75c8fc80fa921becf01b0bc907
          rm -rf /tmp/pr329 /tmp/tooling /tmp/mv_dispatcher /tmp/mv_out
          git worktree add --detach /tmp/pr329 "$CANDIDATE"
          git worktree add --detach /tmp/tooling "$TOOLING"
          mkdir -p /tmp/mv_dispatcher /tmp/mv_out
          git archive "$MAIN" automation/review_dispatcher_v1 | tar -x -C /tmp/mv_dispatcher
          test "$(git -C /tmp/pr329 rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C /tmp/pr329 show -s --format=%T HEAD)" = a2bf5a25abeffed80deacfa5299e97ddee559840
          test "$(git -C /tmp/tooling rev-parse HEAD:automation/review_dispatcher_v1/one_shot_preflight_v1.py)" = 238f03109353b80c951b19c698aca43efd2c422c
          echo MATERIALIZATION=PASS

      - name: Execute exact owner-free Auditor v2 one-shot preflight
        shell: bash
        run: |
          set -euo pipefail
          unset DATABASE_URL RENDER_API_KEY MULTIVERSE_INDEPENDENT_LAB_PRIVATE_KEY MULTIVERSE_INDEPENDENT_AUDITOR_PRIVATE_KEY || true
          python3 /tmp/tooling/automation/review_dispatcher_v1/one_shot_preflight_v1.py \
            --dispatcher-ref d1edc2eabb847c10a4faa59a039b480e85dfb0e4 \
            --lane AUDITOR \
            --repo fufufu1116/multiverse-research \
            --head d71461da53d2498e42edcd92e987a26a59a95cd9 \
            --repo-root /tmp/pr329 \
            | tee /tmp/mv_out/preflight.json
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/mv_out/preflight.json'))
          assert v['schema']=='MULTIVERSE_ONE_SHOT_PREFLIGHT_v1', v
          assert v['state']=='ONE_SHOT_PREFLIGHT_READY', v
          assert v['classification']=='PASS', v
          assert v['ready'] is True, v
          assert v['lane']=='AUDITOR', v
          assert v['request_id']=='pr329-t2-github-read-resilience-auditor-v2-main-d1edc2ea', v
          assert v['request_comment']==5630433273, v
          assert v['request_sha256']=='22e9212bdfabe5fcc65c0b1a0ce6b229435064279a7746a63f0202339fd3c095', v
          assert v['head']=='d71461da53d2498e42edcd92e987a26a59a95cd9', v
          assert v['tree']=='a2bf5a25abeffed80deacfa5299e97ddee559840', v
          assert v['base']=='d1edc2eabb847c10a4faa59a039b480e85dfb0e4', v
          assert v['main']=='d1edc2eabb847c10a4faa59a039b480e85dfb0e4', v
          assert v['dispatcher_ref']=='d1edc2eabb847c10a4faa59a039b480e85dfb0e4', v
          assert v['review_verdict']=='PASS', v
          assert v['test_count']==140, v
          assert v['findings']==[], v
          assert v['artifact_serialization']=='PASS', v
          assert v['publication_attempted'] is False, v
          assert v['owner_build_consumed'] is False, v
          assert v['runtime']=='OFF', v
          print('AUDITOR_V2_ONE_SHOT=READY')
          print('FULL_RECIPE=140/140_PASS')
          print('ARTIFACT_SERIALIZATION=PASS')
          PY

      - name: Reconstruct v2 job artifact and validate supersession upstream validator
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=d71461da53d2498e42edcd92e987a26a59a95cd9
          MAIN=d1edc2eabb847c10a4faa59a039b480e85dfb0e4
          unset DATABASE_URL RENDER_API_KEY MULTIVERSE_INDEPENDENT_LAB_PRIVATE_KEY MULTIVERSE_INDEPENDENT_AUDITOR_PRIVATE_KEY || true
          export MULTIVERSE_DISPATCHER_REF="$MAIN"
          export BUILDKITE_COMMIT="$CANDIDATE"
          export BUILDKITE_BUILD_ID=OWNER_FREE_PR329_AUDITOR_V2_PREFLIGHT
          export BUILDKITE_BUILD_NUMBER=0
          export BUILDKITE_BRANCH=OWNER_FREE_ATOMIC_PROOF
          (cd /tmp/pr329 && PYTHONPATH=/tmp/mv_dispatcher python3 /tmp/mv_dispatcher/automation/review_dispatcher_v1/dispatcher.py --lane AUDITOR --repo fufufu1116/multiverse-research --head "$CANDIDATE" --output /tmp/mv_out/job.json)
          (cd /tmp/pr329 && PYTHONPATH=/tmp/mv_dispatcher python3 /tmp/mv_dispatcher/automation/review_dispatcher_v1/review.py --job /tmp/mv_out/job.json --output /tmp/mv_out/artifact.json --repo-root /tmp/pr329)
          python3 - <<'PY'
          import hashlib,json
          job=json.load(open('/tmp/mv_out/job.json'))
          art=json.load(open('/tmp/mv_out/artifact.json'))
          req=job['request']
          digest=hashlib.sha256(json.dumps(req,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert digest=='22e9212bdfabe5fcc65c0b1a0ce6b229435064279a7746a63f0202339fd3c095'
          assert job['request_comment']==5630433273
          assert job['request_id']=='pr329-t2-github-read-resilience-auditor-v2-main-d1edc2ea'
          assert req['supersedes_request_sha256']=='32dcf456faf972b08b29d0bfdba2541f854c08478b039cc6db25995e9f6380d6'
          assert req['upstream']=={'lab_pass_comment':5630052134,'lab_request_sha256':'aa299037d7b90aaa28d8b2785ce22d60a4f930b3405b31ec83a31efcb885061b','t1_comment':5630112888}
          assert art['lane']=='AUDITOR'
          assert art['verdict']=='PASS'
          assert art['findings']==[]
          assert art['test_count']==140
          assert art['request_sha256']==digest
          checks=art['checks']
          assert checks['validator_exit:automation/review_dispatcher_v1/validator.py']=='PASS'
          assert checks['validator_expect:automation/review_dispatcher_v1/validator.py:findings']=='PASS'
          assert checks['validator_expect:automation/review_dispatcher_v1/validator.py:verdict']=='PASS'
          assert checks['upstream_lab_result_bound_to_latest_request']=='PASS'
          assert checks['upstream_lab_single_authentic_latest_result']=='PASS'
          assert checks['upstream_t1_binding:pass']=='PASS'
          json.loads(json.dumps(job,sort_keys=True))
          json.loads(json.dumps(art,sort_keys=True))
          print('EXACT_REQUEST_SELECTION_SHA=PASS')
          print('SUPERSESSION_V1_TO_V2=PASS')
          print('UPSTREAM_LAB_T1=PASS')
          print('NO_EXISTING_EXACT_V2_RESULT=PASS_BY_CANONICAL_DISPATCHER_SERIALIZATION')
          print('VALIDATOR=PASS')
          print('VALIDATOR_FINDINGS=[]')
          print('ARTIFACT_JSON_ROUNDTRIP=PASS')
          PY

      - name: Run post-publication T2 bounded GET fault matrix
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pr329
          PYTHONPATH=. python3 -m unittest -v automation.review_dispatcher_v1.test_t2_github_read_resilience_v1 2>&1 | tee /tmp/mv_out/t2_faults.log
          grep -q 'Ran 8 tests' /tmp/mv_out/t2_faults.log
          grep -q '^OK$' /tmp/mv_out/t2_faults.log
          echo T2_FAULT_MATRIX=8/8_PASS
          echo TRUSTED_RETRY_AFTER_BOUNDED_GET=PASS
          echo TRUSTED_RESET_BOUNDED_GET=PASS
          echo AMBIGUOUS_403_FAIL_CLOSE=PASS
          echo MISSING_TIMING_403_FAIL_CLOSE=PASS
          echo MALFORMED_TIMING_403_FAIL_CLOSE=PASS
          echo DELAY_OVER_BUDGET_FAIL_CLOSE=PASS
          echo POST_BODY_MUTATION_NO_RETRY=PASS

      - name: Execute exact v2 durable-lineage T2 read-only replay
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pr329
          PYTHONPATH=. python3 - <<'PY'
          import json
          from automation.review_dispatcher_v1 import t2
          job=json.load(open('/tmp/mv_out/job.json'))
          artifact=json.load(open('/tmp/mv_out/artifact.json'))
          synthetic_id=999329002
          receipt={'published_comment_id':synthetic_id,'published_by':t2._legacy.AUDITOR_LOGIN,'github_app_id':t2._legacy.AUDITOR_APP_ID,'request_sha256':job['request_sha256']}
          fence='`'*3
          synthetic={'id':synthetic_id,'user':{'login':t2._legacy.AUDITOR_LOGIN,'type':'Bot'},'performed_via_github_app':{'id':t2._legacy.AUDITOR_APP_ID,'slug':t2._legacy.AUDITOR_APP_SLUG},'body':'\n'.join([fence+'json',json.dumps(artifact,indent=2,sort_keys=True),fence])}
          real=t2._legacy.public_github
          synthetic_url=f"https://api.github.com/repos/{job['repo']}/issues/comments/{synthetic_id}"
          seen=[]
          def fetch(url):
              seen.append(url)
              if url==synthetic_url:
                  return synthetic
              return real(url)
          t2._legacy.public_github=fetch
          try:
              comments=t2._fresh_t2_verify(job,artifact,receipt)
          finally:
              t2._legacy.public_github=real
          assert any('pr329-t2-github-read-resilience-auditor-v2-main-d1edc2ea' in (c.get('body') or '') for c in comments)
          assert any(c.get('id')==5630218394 for c in comments)
          assert any(c.get('id')==5630220201 for c in comments)
          required=[f"https://api.github.com/repos/{job['repo']}/pulls/{job['pr']}",f"https://api.github.com/repos/{job['repo']}/branches/main",f"https://api.github.com/repos/{job['repo']}/commits/{job['head']}",f"https://api.github.com/repos/{job['repo']}/issues/comments/5630112888",synthetic_url]
          for u in required:
              assert u in seen,(u,seen)
          assert any('/issues/329/comments?per_page=100&page=1' in u for u in seen),seen
          print('EXACT_DURABLE_LINEAGE_T2_READ_ONLY_REPLAY=PASS')
          print('LIVE_PR_MAIN_COMMIT_LAB_T1_READS=PASS')
          print('QUARANTINED_V1_HISTORY_PRESERVED=PASS')
          print('T2_PUBLICATION_ATTEMPTED=false')
          PY

      - name: Emit terminal READY no-effect boundary
        shell: bash
        run: |
          set -euo pipefail
          echo PUBLICATION_ATTEMPTED=false
          echo OWNER_BUILD_CONSUMED=false
          echo OWNER_GATE_USED=false
          echo FORMAL_AUDITOR_RESULT_PUBLICATION=false
          echo T2_PUBLICATION=false
          echo BUILD_1710_RETRY_RERUN_REUSE=false
          echo PR329_MUTATION=false
          echo RUNTIME=OFF
          echo TERMINAL=READY
