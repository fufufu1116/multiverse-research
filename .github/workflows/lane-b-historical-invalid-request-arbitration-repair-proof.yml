name: Lane B historical invalid-request arbitration repair proof

on:
  push:
    branches:
      - agent/lane-b-historical-invalid-request-arbitration-repair-v1-proof-20260911

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proof carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Full Candidate tests and validator
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='aa63e0317a78c3924af5f169eaa476bdff3b12b7'
          BASE='04f314c744abbd0a15591e0437c5de178cfb0ef4'
          test "$(git rev-parse "$CANDIDATE")" = "$CANDIDATE"
          git worktree add --detach /tmp/candidate "$CANDIDATE"
          cd /tmp/candidate
          python -m compileall -q automation/review_dispatcher_v1
          python -m unittest discover -v -s automation/review_dispatcher_v1 -p 'test_*.py' 2>&1 | tee /tmp/full-tests.log
          OUT="$(PYTHONPATH=. python automation/review_dispatcher_v1/validator.py)"
          echo "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1])
          assert d['verdict']=='PASS', d
          assert d['findings']==[], d
          print('VALIDATOR_EXACT=PASS_FINDINGS_EMPTY')
          PY
          test "$(git ls-tree "$CANDIDATE" buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml | awk '{print $3}')" = '2d4ec751dee4e507a08313d403c7d0521c172ae5'
          test "$(git ls-tree "$CANDIDATE" buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml | awk '{print $3}')" = 'c42bae003a3b1dc6d11cf5e6c33996369a4d22d6'
          echo CANDIDATE_HEAD="$CANDIDATE"
          echo CANDIDATE_TREE="$(git show -s --format=%T "$CANDIDATE")"
          echo BASE_MAIN="$BASE"

      - name: Prospective repaired arbitration PR311 corrected Auditor v2 preflight
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='aa63e0317a78c3924af5f169eaa476bdff3b12b7'
          CANONICAL_MAIN='04f314c744abbd0a15591e0437c5de178cfb0ef4'
          TARGET_HEAD='251b01949d7eb5eb6a1150eb19cb3b2f9f9587b1'
          TARGET_TREE='7e0590148edd31992bcd5bb13a2d98ba863d4897'
          REQUEST_COMMENT='5626191487'
          REQUEST_ID='pr311-one-shot-preflight-auditor-v2-main-04f314c7'
          REQUEST_SHA='c90ad0edc4a8e9b4492700b40bb00f8a597b7b87088f04a5cdffa84f6827c6a9'

          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$CANONICAL_MAIN"
          test "$(git show -s --format=%T "$TARGET_HEAD")" = "$TARGET_TREE"
          rm -rf /tmp/pr311 /tmp/prospective-runner
          git worktree add --detach /tmp/pr311 "$TARGET_HEAD"
          mkdir -p /tmp/prospective-runner/automation/review_dispatcher_v1
          git archive "$CANONICAL_MAIN" automation/review_dispatcher_v1 | tar -x -C /tmp/prospective-runner
          git show "$CANDIDATE:automation/review_dispatcher_v1/request_arbitration_v6.py" > /tmp/prospective-runner/automation/review_dispatcher_v1/request_arbitration_v6.py

          PYTHONPATH=/tmp/pr311 python - "$CANONICAL_MAIN" "$TARGET_HEAD" "$REQUEST_COMMENT" "$REQUEST_ID" "$REQUEST_SHA" <<'PY'
          import json
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          main, head, request_comment, request_id, request_sha = sys.argv[1:]
          sys.path.insert(0, '/tmp/pr311')
          from automation.review_dispatcher_v1.one_shot_preflight_v1 import run_one_shot_preflight

          real_run = subprocess.run
          def runner(args, **kwargs):
              if (
                  isinstance(args, list)
                  and len(args) >= 2
                  and args[0] == 'git'
                  and args[1] == 'archive'
              ):
                  output = None
                  for item in args:
                      if isinstance(item, str) and item.startswith('--output='):
                          output = item.split('=', 1)[1]
                          break
                  if output is None:
                      return subprocess.CompletedProcess(args, 2, '', 'proof overlay archive output missing')
                  with tarfile.open(output, 'w') as archive:
                      archive.add(
                          '/tmp/prospective-runner/automation/review_dispatcher_v1',
                          arcname='automation/review_dispatcher_v1',
                      )
                  return subprocess.CompletedProcess(args, 0, '', '')
              return real_run(args, **kwargs)

          result = run_one_shot_preflight(
              dispatcher_ref=main,
              lane='AUDITOR',
              repo='fufufu1116/multiverse-research',
              head=head,
              repo_root=Path('/tmp/pr311'),
              command_runner=runner,
          )
          print(json.dumps(result, sort_keys=True, indent=2))
          assert result['publication_attempted'] is False, result
          assert result['owner_build_consumed'] is False, result
          assert result['runtime'] == 'OFF', result
          if result['ready']:
              assert result['state'] == 'ONE_SHOT_PREFLIGHT_READY', result
              assert result['classification'] == 'PASS', result
              assert result['request_comment'] == int(request_comment), result
              assert result['request_id'] == request_id, result
              assert result['request_sha256'] == request_sha, result
              assert result['review_verdict'] == 'PASS', result
              assert result['findings'] == [], result
              print('PR311_CORRECTED_AUDITOR_V2_PROSPECTIVE_REPAIRED_PREFLIGHT=READY')
          else:
              assert result['state'] == 'ONE_SHOT_PREFLIGHT_BLOCKED', result
              print('PR311_CORRECTED_AUDITOR_V2_PROSPECTIVE_REPAIRED_PREFLIGHT=BLOCKED')
          PY
