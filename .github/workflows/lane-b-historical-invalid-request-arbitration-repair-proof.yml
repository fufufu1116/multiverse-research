name: PR313 exact Lab owner-free preflight proof

on:
  push:
    branches:
      - agent/lane-b-historical-invalid-request-arbitration-repair-v1-proof-20260911

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proof carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare exact PR313 target and fixed Steps bindings
        shell: bash
        run: |
          set -euo pipefail
          MAIN='04f314c744abbd0a15591e0437c5de178cfb0ef4'
          TARGET='aa63e0317a78c3924af5f169eaa476bdff3b12b7'
          TREE='488afdff4d5e7b55072ef69baf8dad0056fd3a46'
          HELPER='251b01949d7eb5eb6a1150eb19cb3b2f9f9587b1'
          LAB_BLOB='2d4ec751dee4e507a08313d403c7d0521c172ae5'
          AUDITOR_BLOB='c42bae003a3b1dc6d11cf5e6c33996369a4d22d6'

          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN"
          git cat-file -e "$TARGET^{commit}"
          git cat-file -e "$HELPER^{commit}"
          test "$(git show -s --format=%T "$TARGET")" = "$TREE"

          test "$(git ls-tree "$TARGET" buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml | awk '{print $3}')" = "$LAB_BLOB"
          test "$(git ls-tree "$TARGET" buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml | awk '{print $3}')" = "$AUDITOR_BLOB"
          test "$(git ls-tree "$MAIN" buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml | awk '{print $3}')" = "$LAB_BLOB"
          test "$(git ls-tree "$MAIN" buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml | awk '{print $3}')" = "$AUDITOR_BLOB"

          rm -rf /tmp/pr313 /tmp/preflight-helper
          git worktree add --detach /tmp/pr313 "$TARGET"
          git worktree add --detach /tmp/preflight-helper "$HELPER"

          echo EXACT_MAIN="$MAIN"
          echo EXACT_TARGET_HEAD="$TARGET"
          echo EXACT_TARGET_TREE="$TREE"
          echo FIXED_LAB_STEPS_BLOB="$LAB_BLOB"
          echo FIXED_AUDITOR_STEPS_BLOB="$AUDITOR_BLOB"
          echo FIXED_STEPS_INTEGRITY=PASS

      - name: Execute exact current-main dispatcher plus review owner-free preflight
        shell: bash
        run: |
          set -euo pipefail
          MAIN='04f314c744abbd0a15591e0437c5de178cfb0ef4'
          TARGET='aa63e0317a78c3924af5f169eaa476bdff3b12b7'
          TREE='488afdff4d5e7b55072ef69baf8dad0056fd3a46'
          REQUEST_COMMENT='5626843607'
          REQUEST_ID='pr313-historical-invalid-request-arbitration-repair-lab-v1-main-04f314c7'
          REQUEST_SHA='6d276ea6ff777e1623a424e4401b679aca2a49854daf3389295e7c40a85be065'

          set +e
          PYTHONPATH=/tmp/preflight-helper \
            python /tmp/preflight-helper/automation/review_dispatcher_v1/one_shot_preflight_v1.py \
              --dispatcher-ref "$MAIN" \
              --lane LAB \
              --repo fufufu1116/multiverse-research \
              --head "$TARGET" \
              --repo-root /tmp/pr313 \
              > /tmp/pr313_lab_preflight.json
          RC=$?
          set -e

          cat /tmp/pr313_lab_preflight.json
          python - "$RC" "$MAIN" "$TARGET" "$TREE" "$REQUEST_COMMENT" "$REQUEST_ID" "$REQUEST_SHA" <<'PY'
          import json
          import sys

          rc = int(sys.argv[1])
          main, target, tree, request_comment, request_id, request_sha = sys.argv[2:]
          d = json.load(open('/tmp/pr313_lab_preflight.json'))

          assert d['schema'] == 'MULTIVERSE_ONE_SHOT_PREFLIGHT_v1', d
          assert d['repo'] == 'fufufu1116/multiverse-research', d
          assert d['lane'] == 'LAB', d
          assert d['head'] == target, d
          assert d['dispatcher_ref'] == main, d
          assert d['publication_attempted'] is False, d
          assert d['owner_build_consumed'] is False, d
          assert d['runtime'] == 'OFF', d

          if d['ready']:
              assert rc == 0, (rc, d)
              assert d['state'] == 'ONE_SHOT_PREFLIGHT_READY', d
              assert d['classification'] == 'PASS', d
              assert d['tree'] == tree, d
              assert d['base'] == main, d
              assert d['main'] == main, d
              assert d['request_comment'] == int(request_comment), d
              assert d['request_id'] == request_id, d
              assert d['request_sha256'] == request_sha, d
              assert d['review_verdict'] == 'PASS', d
              assert d['test_count'] == 132, d
              assert d['findings'] == [], d
              assert d['artifact_serialization'] == 'PASS', d
              print('PR313_LAB_OWNER_FREE_PREFLIGHT_TERMINAL=READY')
          else:
              assert rc == 1, (rc, d)
              assert d['state'] == 'ONE_SHOT_PREFLIGHT_BLOCKED', d
              print('PR313_LAB_OWNER_FREE_PREFLIGHT_TERMINAL=BLOCKED')
          PY
