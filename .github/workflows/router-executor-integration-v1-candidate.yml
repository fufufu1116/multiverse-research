name: Router Executor Integration v1 Candidate
on:
  pull_request:
    paths:
      - "config/executor.py"
      - "config/router.py"
      - "config/provider.py"
      - "tests/test_router_executor_integration_v1_candidate.py"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_router_executor_integration_v1_candidate.py tests/test_mission_router_v1_candidate.py tests/test_capability_registry_v1_candidate.py -v
