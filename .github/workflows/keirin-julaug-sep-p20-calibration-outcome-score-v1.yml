name: Keirin JulAugSep P20 Calibration Outcome Score v1
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-julaug-sep-p20-calibration-outcome-score-v1.yml'
permissions:
  contents: read
  actions: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Download exact blind freeze and both locked universes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p freeze lock_julaug lock_sep out
          gh run download 34307338671 -n keirin-julaug-sep08-p20-preoutcome-freeze-v1 -D freeze
          gh run download 34306276745 -n keirin-julaug2026-result-blind-universe-v1 -D lock_julaug
          gh run download 34307215542 -n keirin-sep01-08-result-blind-universe-v1 -D lock_sep
      - name: Assert exact P20 freeze before outcomes
        run: |
          python - <<'PY'
          import json
          p='freeze/KEIRIN_JULAUG_SEP08_GIRLS_GAP3_3RENTAN_P20_PREOUTCOME_FREEZE_20260909_v1.json'
          x=json.load(open(p,encoding='utf-8'));z=x['summary'];s=x['safeguards']
          assert z['selected_girls_gap_ge3_races']==92,z
          assert s['result_accessed'] is False and s['payout_accessed'] is False and s['odds_accessed'] is False
          print('PASS_EXACT_P20_FREEZE',z)
          PY
      - name: Recover complete official 3rentan settlements for exact 92
        run: |
          python tools/keirin_locked_multi_universe_selected_3rentan_payout_recovery_v1.py \
            --freeze freeze/KEIRIN_JULAUG_SEP08_GIRLS_GAP3_3RENTAN_P20_PREOUTCOME_FREEZE_20260909_v1.json \
            --universe-csv lock_julaug/KEIRIN_JULAUG2026_RESULT_BLIND_UNIVERSE_v1.csv \
            --universe-csv lock_sep/KEIRIN_SEP01_08_2026_RESULT_BLIND_UNIVERSE_v1.csv \
            --out-csv out/P20_SELECTED_3RENTAN_SETTLEMENTS.csv \
            --receipt out/P20_SELECTED_3RENTAN_SETTLEMENTS_RECEIPT.json \
            --workers 12
      - name: Score frozen P20 calibration
        run: |
          python tools/keirin_julaug_sep08_girls_gap3_p20_calibration_scorer_v1.py \
            --freeze freeze/KEIRIN_JULAUG_SEP08_GIRLS_GAP3_3RENTAN_P20_PREOUTCOME_FREEZE_20260909_v1.json \
            --payout out/P20_SELECTED_3RENTAN_SETTLEMENTS.csv \
            --prespec v3/historical_all_market/research_candidates/KEIRIN_JULAUG2026_GIRLS_GAP3_3RENTAN_P20_CALIBRATION_PRESPEC_20260909_v1.json \
            --out out/KEIRIN_JULAUG_SEP08_GIRLS_GAP3_3RENTAN_P20_CALIBRATION_SCORE_20260909_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keirin-julaug-sep-p20-calibration-score-v1
          path: out/
          retention-days: 30
