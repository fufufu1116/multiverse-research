name: Keirin NEXTGEN5000 Primary Outcome + Payout Collection 2001-5000 v1
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-nextgen5000-primary-outcome-payout-2001-5000-v1.yml'
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 2001, end: 2500}
          - {start: 2501, end: 3000}
          - {start: 3001, end: 3500}
          - {start: 3501, end: 4000}
          - {start: 4001, end: 4500}
          - {start: 4501, end: 5000}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Collect outcome labels only
        run: |
          mkdir -p out
          python tools/keirin_nextgen5000_outcome_bulk_recovery_v1.py \
            --start-position ${{ matrix.start }} --end-position ${{ matrix.end }} \
            --workers 8 --min-success-rate 0.90 \
            --outcome-csv out/NEXTGEN5000_OUTCOME_${{ matrix.start }}_${{ matrix.end }}.csv \
            --receipt out/NEXTGEN5000_OUTCOME_${{ matrix.start }}_${{ matrix.end }}_RECEIPT.json \
            --pre-freeze-attestation YES
      - name: Collect 3renhuku payout only
        run: |
          python tools/keirin_nextgen5000_3renhuku_payout_bulk_recovery_v1.py \
            --start-position ${{ matrix.start }} --end-position ${{ matrix.end }} \
            --workers 8 --min-success-rate 0.90 \
            --out-csv out/NEXTGEN5000_PAYOUT_${{ matrix.start }}_${{ matrix.end }}.csv \
            --receipt out/NEXTGEN5000_PAYOUT_${{ matrix.start }}_${{ matrix.end }}_RECEIPT.json \
            --pre-freeze-attestation YES
      - name: Assert separated schemas
        run: |
          python - <<'PY'
          import csv,glob,json
          of=glob.glob('out/NEXTGEN5000_OUTCOME_*.csv')[0]
          pf=glob.glob('out/NEXTGEN5000_PAYOUT_*.csv')[0]
          o=list(csv.DictReader(open(of,encoding='utf-8')))
          p=list(csv.DictReader(open(pf,encoding='utf-8')))
          assert o and p
          assert set(o[0])=={'race_id','race_date','venue','race_no','finish_1','finish_2','finish_3','source_url','source_file_sha256','evidence_role'}
          assert set(p[0])=={'race_id','race_date','winning_3renhuku_ticket','payout_yen_per_100','source_url','source_file_sha256','evidence_role'}
          print('PASS_OUTCOME_ROWS',len(o))
          print('PASS_PAYOUT_ROWS',len(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keirin-nextgen5000-primary-outcome-payout-${{ matrix.start }}-${{ matrix.end }}
          path: out/
          retention-days: 30
