name: Keirin Q-W1-STATIC-ABLATION-1 v1 CI

on:
  push:
    branches:
      - research/keirin-parallel-mechanism-affinity-audit-20260901-v1
    paths:
      - '.github/workflows/keirin-q-w1-static-ablation-1-v1-ci.yml'
      - 'v3/historical_all_market/research_candidates/KEIRIN_Q_W1_STATIC_ABLATION_1_PRESPEC_20260901_v1.json'
      - 'tools/keirin_q_w1_static_ablation_1_v1.py'

permissions:
  contents: read

env:
  BASE_MAIN: 5c1403c1f5aabb80d29e8c868440aede8888ce61
  VNEXT_BLOB: afe746287c7e911d214202abdf2de076f63ab30c
  KEIRIN_STATE_BLOB: 962d9c75b0611d52bd264a8b88bb1fe259cb8aeb
  AUTH_RECEIPT_BLOB: 4c2e5364ad229a5dd413a19d0cf970c478692584
  DIGITAL_TWIN_BLOB: 1f1574400e43648e60af43d059965d021d8bbad8
  TOP3_CORE_BLOB: 4e2a819dce69240792d927cceba434f53932b829
  COMPARISON_BLOB: 9531715a8f346aec370bf1be24017a8ff577506b
  COEFF_RECEIPT_BLOB: f531d72929c846da1c932451873c94bb9b526ae7
  MECH_EVIDENCE_BLOB: 25f1a6aa3265b122ed04ae7ff16ff7d8232c22b3
  Q_MISMATCH_EVIDENCE_BLOB: 369ee681a5b296767a717beb72fe8d528b138aeb
  Q_REL_EVIDENCE_BLOB: 5252aa71b64487a382f4b75b418257062d6f0a5e
  Q_CHAIN_EVIDENCE_BLOB: 96c3c212c3395f0a121581e2bf6c010983022a4e
  PRESPEC_BLOB: ed5bca902cddb05edf408dfde3630ca6ec757d8a
  HARNESS_BLOB: 6f782facb9734b68f0a2f7787347295d5ae37bda
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  q-w1-static-ablation-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fresh relevant governance and fixed-source checks
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "OBSERVED_ORIGIN_MAIN=$(git rev-parse origin/main)"
          echo "EXECUTED_HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_MAIN" HEAD
          test "$(git rev-parse "origin/main:multiverse_vnext/VNEXT_CURRENT_STATE_v0.json")" = "$VNEXT_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json")" = "$KEIRIN_STATE_BLOB"
          test "$(git rev-parse "origin/main:governance/KEIRIN_LIMITED_SYNTHETIC_EXECUTION_AUTHORIZATION_RECEIPT_20260821_v1.json")" = "$AUTH_RECEIPT_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/new_lineage/digital_twin_v1.py")" = "$DIGITAL_TWIN_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/new_lineage/top3_architecture_core_v1.py")" = "$TOP3_CORE_BLOB"
          test "$(git rev-parse "origin/main:tools/keirin_synthetic_c0_c1_n1_comparison_v1.py")" = "$COMPARISON_BLOB"
          test "$(git rev-parse "origin/main:v3/historical_all_market/governance/KEIRIN_FROZEN_PRE_HOLDOUT_COEFFICIENT_RECEIPT_v1.json")" = "$COEFF_RECEIPT_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_PARALLEL_MECHANICAL_INVARIANCE_GATE_EVIDENCE_20260901_v1.json")" = "$MECH_EVIDENCE_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_Q_MISMATCH_1_EVIDENCE_20260901_v1.json")" = "$Q_MISMATCH_EVIDENCE_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_Q_REL_STRENGTH_1_EVIDENCE_20260901_v1.json")" = "$Q_REL_EVIDENCE_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_Q_CHAIN_DECOMP_1_EVIDENCE_20260901_v1.json")" = "$Q_CHAIN_EVIDENCE_BLOB"
          test "$(git rev-parse "HEAD:v3/historical_all_market/research_candidates/KEIRIN_Q_W1_STATIC_ABLATION_1_PRESPEC_20260901_v1.json")" = "$PRESPEC_BLOB"
          test "$(git rev-parse "HEAD:tools/keirin_q_w1_static_ablation_1_v1.py")" = "$HARNESS_BLOB"

      - name: Verify no canonical scientific source mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_MAIN"...HEAD > /tmp/changed.txt
          ! grep -Eq '^(multiverse_vnext/|v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json$|v3/historical_all_market/new_lineage/|governance/KEIRIN_LIMITED_SYNTHETIC_EXECUTION_AUTHORIZATION_RECEIPT_20260821_v1.json$)' /tmp/changed.txt

      - name: Reject network-capable experiment harness
        shell: bash
        run: |
          set -euo pipefail
          HARNESS=tools/keirin_q_w1_static_ablation_1_v1.py
          ! grep -Eq '(^|[[:space:]])(requests|urllib|socket|subprocess|selenium|playwright)([[:space:].]|$)' "$HARNESS"
          ! grep -Eq 'https?://' "$HARNESS"

      - name: Execute fully prespecified Q-W1-STATIC-ABLATION-1
        shell: bash
        run: |
          set -euo pipefail
          python tools/keirin_q_w1_static_ablation_1_v1.py | tee /tmp/qw1.log
          grep -Fx 'KEIRIN_Q_W1_STATIC_ABLATION_1_EXECUTION_PASS' /tmp/qw1.log
          head -n 1 /tmp/qw1.log > /tmp/result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/result.json', encoding='utf-8'))
          assert r['status']=='PASS_EXECUTION_AND_MECHANICAL_INVARIANTS'
          assert r['classification']=='RESEARCH_CANDIDATE_NOT_CANONICAL_NOT_ACCEPTED_NOT_PROMOTED'
          assert r['evidence_class']=='SYNTHETIC_ENGINEERING_FALSIFICATION_ONLY'
          assert r['primary_hypothesis_classification'] in {
              'NO_STABLE_W1_GAIN',
              'LATENT_SHARED_PROXY_DOMINANT',
              'OBSERVED_STRUCTURE_PROXY_DOMINANT',
              'BOTH_COMPONENTS_INDEPENDENTLY_SUPPORT_GAIN',
              'INTERACTION_ONLY_W1_GAIN',
              'MIXED_OR_NONMONOTONIC_COMPONENT_PATTERN',
          }
          assert r['conditions']==['W0_BASE_ONLY','W1_OBSERVED_STRUCTURE_ONLY','W1_LATENT_SHARED_ONLY','W1_FULL']
          assert r['total_cases']==512
          assert r['new_seed_selection'] is False
          assert r['new_relation_kernel'] is False and r['relation_strength_all_conditions']==0.0
          assert r['new_model_addition'] is False
          assert r['models_changed'] is False and r['coefficients_changed'] is False
          assert r['post_result_retuning'] is False and r['post_hoc_condition_addition'] is False
          assert r['max_W0_BASE_ONLY_vs_canonical_W0_truth_diff'] <= 1e-12
          assert r['max_W1_FULL_vs_canonical_W1_truth_diff'] <= 1e-12
          assert r['max_prediction_probability_mass_error'] <= 1e-10
          assert r['max_truth_probability_mass_error'] <= 1e-10
          assert r['max_decomposition_residual'] <= 1e-12
          assert r['max_C1_N1_rank1_marginal_difference'] <= 1e-12
          for condition in r['conditions']:
              assert abs(r['aggregate_results'][condition]['N1_minus_C1']['rank1']) <= 1e-12
          for key in ('protected_or_quarantined_input_access','pr15_metrics_access','result_payout_access','econ_holdout1000_access','dev2000_c_rescue','same_lineage_b_c_rescue_tuning','real_live_input_collection','economics','model_promotion','external_provider_contact','real_money_wagering','real_world_edge_or_roi_evidence'):
              assert r[key] is False, (key, r[key])
          assert r['scientific_segment_c_scoring_count']==0
          print('KEIRIN_Q_W1_STATIC_ABLATION_1_RESULT_CONTRACT_PASS')
          PY

      - name: Protected-boundary terminal
        shell: bash
        run: |
          echo 'EVIDENCE_CLASS=SYNTHETIC_ENGINEERING_FALSIFICATION_ONLY'
          echo 'RESEARCH_CANDIDATE_ONLY=true'
          echo 'PR15_METRICS_ACCESSED=false'
          echo 'RESULT_PAYOUT_ACCESSED=false'
          echo 'ECON_HOLDOUT1000_ACCESSED=false'
          echo 'SCIENTIFIC_SEGMENT_C_SCORING_COUNT=0'
          echo 'REAL_LIVE_INPUT=false'
          echo 'ECONOMICS=false'
          echo 'MODEL_PROMOTION=false'

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"
