name: pr369-owner-free-exact-lab-preflight-20260912
on:
  push:
    branches: [agent/pr369-owner-free-exact-lab-preflight-20260912]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      EXACT_HEAD: 583e1b9c2831521d47aff419774999edb2c9c116
      EXACT_TREE: 8a491a1d4b5d962bbfa8a2dafe7301bf3bee46fd
      EXACT_MAIN: 27b038736e6f160a0ab4f619c6aeef39f0ae8d10
      EXACT_REQUEST_COMMENT: 5644514425
      EXACT_REQUEST_SHA: 35eeb30f52480730abe9000820b30d7c6cfd4d8f188f01356d1e0f73aaa15c37
      EXACT_REQUEST_ID: pr369-fresh-main-seven-path-successor-lab-v1-main-27b03873
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact proof carrier boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_HEAD"
          test "$(git show -s --format=%T HEAD^)" = "$EXACT_TREE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr369-owner-free-exact-lab-preflight-20260912.yml"
          test "$(git show HEAD^:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml | git hash-object --stdin)" = "2d4ec751dee4e507a08313d403c7d0521c172ae5"
          test "$(git show HEAD^:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml | git hash-object --stdin)" = "c42bae003a3b1dc6d11cf5e6c33996369a4d22d6"
      - name: Exact non-publishing LAB one-shot preflight
        run: |
          set -euo pipefail
          git fetch -q origin "$EXACT_MAIN"
          git checkout -q --detach "$EXACT_HEAD"
          test -z "${MULTIVERSE_INDEPENDENT_LAB_PRIVATE_KEY:-}"
          test -z "${MULTIVERSE_INDEPENDENT_AUDITOR_PRIVATE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${RENDER_API_KEY:-}"
          PYTHONPATH=. python3 automation/review_dispatcher_v1/one_shot_preflight_v1.py \
            --dispatcher-ref "$EXACT_MAIN" \
            --lane LAB \
            --repo fufufu1116/multiverse-research \
            --head "$EXACT_HEAD" \
            --repo-root . > preflight.json
          cat preflight.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('preflight.json'))
          assert p['schema']=='MULTIVERSE_ONE_SHOT_PREFLIGHT_v1'
          assert p['ready'] is True
          assert p['state']=='ONE_SHOT_PREFLIGHT_READY'
          assert p['classification']=='PASS'
          assert p['request_comment']==int(os.environ['EXACT_REQUEST_COMMENT'])
          assert p['request_sha256']==os.environ['EXACT_REQUEST_SHA']
          assert p['request_id']==os.environ['EXACT_REQUEST_ID']
          assert p['head']==os.environ['EXACT_HEAD']
          assert p['tree']==os.environ['EXACT_TREE']
          assert p['base']==os.environ['EXACT_MAIN']
          assert p['main']==os.environ['EXACT_MAIN']
          assert p['review_verdict']=='PASS'
          assert p['test_count']==183
          assert p['findings']==[]
          assert p['artifact_serialization']=='PASS'
          assert p['publication_attempted'] is False
          assert p['owner_build_consumed'] is False
          assert p['runtime']=='OFF'
          print('EXACT_REQUEST_ARBITRATION=PASS')
          print('TEST_COUNT=183')
          print('VALIDATOR=PASS_FINDINGS_EMPTY')
          print('FIXED_STEPS_UNCHANGED=PASS')
          print('PUBLICATION_ATTEMPTED=NO')
          print('OWNER_BUILD_CONSUMED=NO')
          print('ARTIFACT_SERIALIZATION=PASS')
          print('PREFLIGHT_TERMINAL=READY')
          PY
