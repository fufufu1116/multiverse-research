name: Keirin Successor GirlsGap3 Untouched Payout Score Retry v2
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-successor-girls-gap3-untouched-payout-score-retry-v2.yml'
permissions:
  contents: read
  actions: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Download exact extended PREOUTCOME freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p freeze out
          gh run download 34305251240 -n keirin-successor-girls-gap3-preoutcome-freeze-extended-v1 -D freeze
      - name: Assert exact frozen selection identity before retry
        run: |
          python - <<'PY'
          import hashlib,json
          p='freeze/KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_PREOUTCOME_FREEZE_EXTENDED_20260909_v1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['record']=='KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_PREOUTCOME_FREEZE_EXTENDED_20260909_v1'
          assert x['summary']['selected_races']==81
          assert x['safeguards']['result_accessed'] is False
          assert x['safeguards']['payout_accessed'] is False
          assert x['safeguards']['odds_accessed'] is False
          print('PASS_EXACT_FREEZE',x['summary'])
          PY
      - name: Recover exact same 81 selected 3rentan payouts
        run: |
          python tools/keirin_successor_selected_3rentan_payout_recovery_v1.py \
            --freeze freeze/KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_PREOUTCOME_FREEZE_EXTENDED_20260909_v1.json \
            --out-csv out/SUCCESSOR_SELECTED_3RENTAN_PAYOUT.csv \
            --receipt out/SUCCESSOR_SELECTED_3RENTAN_PAYOUT_RECEIPT.json \
            --workers 12
      - name: Score exact frozen successor
        run: |
          python tools/keirin_successor_girls_gap3_3rentan_extended_scorer_v1.py \
            --freeze freeze/KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_PREOUTCOME_FREEZE_EXTENDED_20260909_v1.json \
            --payout out/SUCCESSOR_SELECTED_3RENTAN_PAYOUT.csv \
            --extension-spec v3/historical_all_market/research_candidates/KEIRIN_SUCCESSOR_GIRLS_3RENTAN_GAP3_UNTOUCHED_SAMPLE_SIZE_EXTENSION_20260909_v1.json \
            --out out/KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_EXTENDED_SCORE_20260909_v1.json
      - name: Print exact verdict
        run: |
          python - <<'PY'
          import json
          x=json.load(open('out/KEIRIN_SUCCESSOR_GIRLS_GAP3_3RENTAN_EXTENDED_SCORE_20260909_v1.json',encoding='utf-8'))
          print('VERDICT',x['status'])
          print('OVERALL',json.dumps(x['overall'],sort_keys=True))
          print('FIRST_HALF',json.dumps(x['first_half'],sort_keys=True))
          print('SECOND_HALF',json.dumps(x['second_half'],sort_keys=True))
          print('PRIMARY_PASS',x['primary_replication_pass'])
          print('ROBUSTNESS_SUPPORT',x['robustness_support'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keirin-successor-girls-gap3-untouched-score-retry-v2
          path: out/
          retention-days: 30
