name: keirin-kawasaki-sep10-assen-source-proof-v1-one-shot
on:
  push:
    paths:
      - '.github/workflows/keirin-kawasaki-sep10-assen-source-proof-v1-one-shot.yml'
permissions:
  contents: write
jobs:
  source-proof:
    if: github.ref == 'refs/heads/research/keirin-real-evidence-dual-lane-20260901-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Prove Sep10 assen href from Kawasaki venue page and capture sanitized target metadata
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          LANDING='https://keirin.kdreams.jp/kawasaki/'
          TARGET_PATH='/kawasaki/assen/3420260910/'
          TARGET='https://keirin.kdreams.jp'+TARGET_PATH
          OUT=pathlib.Path('v3/historical_all_market/research_candidates/KEIRIN_KAWASAKI_SEP10_ASSEN_SOURCE_PROOF_20260904_v1.json')
          H={'User-Agent':'MultiverseKeirinResearch/KawasakiSep10AssenSourceProof1.0','Accept':'text/html,application/xhtml+xml'}

          def get(url,expected_path):
              r=requests.get(url,timeout=20,allow_redirects=False,headers=H)
              if r.status_code!=200: raise SystemExit(f'FAIL_CLOSED_HTTP_{r.status_code}_{expected_path}')
              if not 500<=len(r.content)<=4_000_000: raise SystemExit(f'FAIL_CLOSED_SIZE_{expected_path}')
              if 'html' not in (r.headers.get('Content-Type') or '').lower(): raise SystemExit(f'FAIL_CLOSED_CONTENT_TYPE_{expected_path}')
              u=urlparse(url)
              if u.scheme!='https' or u.hostname!='keirin.kdreams.jp' or u.path!=expected_path or u.query or u.fragment: raise SystemExit(f'FAIL_CLOSED_URL_{expected_path}')
              return r

          landing=get(LANDING,'/kawasaki/')
          soup=BeautifulSoup(landing.content.decode('utf-8','replace'),'html.parser')
          observed=[]
          for a in soup.find_all('a',href=True):
              u=urljoin(LANDING,a.get('href'))
              p=urlparse(u)
              if p.scheme=='https' and p.hostname=='keirin.kdreams.jp' and p.path==TARGET_PATH and not p.query and not p.fragment:
                  observed.append(u)
          if observed!=[TARGET]: raise SystemExit(f'FAIL_CLOSED_TARGET_HREF_CARDINALITY_{len(observed)}')

          target=get(TARGET,TARGET_PATH)
          ts=BeautifulSoup(target.content.decode('utf-8','replace'),'html.parser')
          title=re.sub(r'\s+',' ',ts.title.get_text(' ',strip=True)).strip() if ts.title else ''
          text=re.sub(r'\s+',' ',ts.get_text(' ',strip=True)).strip()
          # Date assertions are presence-only; page text itself is not persisted.
          start_mark=bool(re.search(r'(?:2026\s*年\s*)?0?9\s*月\s*10\s*日|2026[-/.]0?9[-/.]10',text))
          end_mark=bool(re.search(r'(?:2026\s*年\s*)?0?9\s*月\s*12\s*日|2026[-/.]0?9[-/.]12',text))
          # Scheduled roster tables only: count geometry, do not persist names or cell values.
          roster_tables=[]
          for t in ts.find_all('table'):
              cls=sorted(t.get('class') or [])
              if any('assen' in c.lower() for c in cls):
                  rows=t.find_all('tr')
                  roster_tables.append({'class':cls,'row_count':len(rows),'max_cell_count':max([len(r.find_all(['th','td'],recursive=False)) for r in rows] or [0])})
          if not roster_tables: raise SystemExit('FAIL_CLOSED_NO_ASSEN_TABLE')

          doc={
            'record':'KEIRIN_KAWASAKI_SEP10_ASSEN_SOURCE_PROOF_20260904_v1',
            'status':'POSITIVE_VENUE_ANCHOR_AND_SCHEDULED_ASSEN_SOURCE_VERIFIED',
            'venue':'川崎','circumference_m':400,
            'scheduled_meeting_start':'2026-09-10','scheduled_meeting_end':'2026-09-12',
            'landing_url':LANDING,'landing_sha256':hashlib.sha256(landing.content).hexdigest(),
            'target_assen_url':TARGET,'target_assen_sha256':hashlib.sha256(target.content).hexdigest(),
            'target_href_positively_observed_on_landing':True,
            'target_href_cardinality':1,
            'target_title_sha256':hashlib.sha256(title.encode('utf-8')).hexdigest(),
            'start_date_marker_present':start_mark,
            'end_date_marker_present':end_mark,
            'scheduled_roster_table_geometry':roster_tables,
            'scheduled_rider_names_persisted':False,
            'unrelated_cell_values_persisted':False,
            'raw_html_persisted':False,'raw_html_printed':False,
            'racecard_day_id_arithmetic_used':False,'race_id_guessed':False,
            'result_page_opened':False,'result_accessed':False,'payout_accessed':False,
            'odds_emitted':False,'forecast_emitted':False,'comment_emitted':False,'narabiyoso_emitted':False,
            'support_increment_authorized_now':0,'final_pre_card_proven':False,
            'model_fit_authorized':False,'result_join_authorized':False,'main_or_runtime_mutation':False
          }
          if not start_mark: raise SystemExit('FAIL_CLOSED_START_DATE_MARKER')
          OUT.write_text(json.dumps(doc,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'record':doc['record'],'status':doc['status'],'target_href_positively_observed_on_landing':True,'start_date_marker_present':start_mark,'roster_table_count':len(roster_tables),'support_increment_authorized_now':0,'result_accessed':False},ensure_ascii=False,sort_keys=True))
          PY
      - name: Persist research-only source proof
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          f='v3/historical_all_market/research_candidates/KEIRIN_KAWASAKI_SEP10_ASSEN_SOURCE_PROOF_20260904_v1.json'
          test -f "$f" && git add "$f" || true
          if git diff --cached --quiet; then echo 'no evidence file produced'; exit 0; fi
          git commit -m 'research(keirin): prove Kawasaki Sep10 assen source v1'
          git push origin HEAD:${{ github.ref_name }}
