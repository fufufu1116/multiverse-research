name: lane-b-duplicate-identical-request-arbitration-repair-v1-proof

on:
  push:
    branches:
      - agent/lane-b-duplicate-identical-request-arbitration-repair-v1-proof-20260911

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact candidate binding and fixed Steps integrity
        shell: bash
        run: |
          set -euo pipefail
          TARGET=5c780584f3ecc960c7ffb2216ec686c77f7894d3
          TREE=f230a07cd4f9950d9be3c5dfba79a8363c007a0e
          MAIN=d1edc2eabb847c10a4faa59a039b480e85dfb0e4
          LAB_BLOB=2d4ec751dee4e507a08313d403c7d0521c172ae5
          AUDITOR_BLOB=c42bae003a3b1dc6d11cf5e6c33996369a4d22d6
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git show -s --format=%T "$TARGET")" = "$TREE"
          test "$(git rev-parse "$MAIN:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml")" = "$LAB_BLOB"
          test "$(git rev-parse "$TARGET:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_LAB_FIXED_v1.yml")" = "$LAB_BLOB"
          test "$(git rev-parse "$MAIN:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml")" = "$AUDITOR_BLOB"
          test "$(git rev-parse "$TARGET:buildkite/review_dispatcher_v1/MULTIVERSE_INDEPENDENT_AUDITOR_FIXED_v1.yml")" = "$AUDITOR_BLOB"
          git checkout --detach "$TARGET"
          test "$(git rev-parse HEAD)" = "$TARGET"
          echo FIXED_STEPS_INTEGRITY=PASS

      - name: Compile arbitration repair
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m py_compile \
            automation/review_dispatcher_v1/request_arbitration_v6.py \
            automation/review_dispatcher_v1/test_request_arbitration_v6.py
          echo COMPILE=PASS

      - name: Discover and run full applicable control-plane suite
        shell: bash
        run: |
          set -euo pipefail
          MAIN=d1edc2eabb847c10a4faa59a039b480e85dfb0e4
          git worktree add --detach /tmp/main-baseline "$MAIN"

          set +e
          baseline_output="$(cd /tmp/main-baseline && PYTHONPATH=. python -m unittest discover -s automation/review_dispatcher_v1 -p 'test_*.py' 2>&1)"
          baseline_rc=$?
          set -e
          printf '%s\n' "$baseline_output"
          test "$baseline_rc" -eq 0
          baseline_count="$(printf '%s\n' "$baseline_output" | sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' | tail -n 1)"
          test -n "$baseline_count"
          echo "CURRENT_MAIN_FULL_DISCOVERY=$baseline_count/$baseline_count_PASS"

          set +e
          candidate_output="$(PYTHONPATH=. python -m unittest discover -s automation/review_dispatcher_v1 -p 'test_*.py' 2>&1)"
          candidate_rc=$?
          set -e
          printf '%s\n' "$candidate_output"
          test "$candidate_rc" -eq 0
          candidate_count="$(printf '%s\n' "$candidate_output" | sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' | tail -n 1)"
          test -n "$candidate_count"
          test "$candidate_count" -eq $((baseline_count + 6))
          echo "CANDIDATE_FULL_DISCOVERY=$candidate_count/$candidate_count_PASS"
          echo "FOCUSED_TEST_DELTA=+6"

          arbitration_output="$(PYTHONPATH=. python -m unittest automation.review_dispatcher_v1.test_request_arbitration_v6 2>&1)"
          printf '%s\n' "$arbitration_output"
          arbitration_count="$(printf '%s\n' "$arbitration_output" | sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' | tail -n 1)"
          test "$arbitration_count" = "22"
          echo REQUEST_ARBITRATION_V6=22/22_PASS

      - name: Run validator
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python automation/review_dispatcher_v1/validator.py > validator.json
          python - <<'PY'
          import json
          data = json.load(open('validator.json'))
          assert data.get('verdict') == 'PASS', data
          assert data.get('findings') == [], data
          print('VALIDATOR=PASS')
          print('VALIDATOR_FINDINGS=[]')
          PY

      - name: Replay exact live PR318 duplicate-v3 durable history through candidate arbitration
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          import os
          import urllib.request

          from automation.review_dispatcher_v1.model_legacy_v1 import sha256_json
          from automation.review_dispatcher_v1.request_arbitration_v6 import latest_exact_current_owner_request_v6

          repo = 'fufufu1116/multiverse-research'
          comments = []
          for page in range(1, 10):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/318/comments?per_page=100&page={page}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
                      'User-Agent': 'multiverse-lane-b-research-proof',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  batch = json.load(response)
              comments.extend(batch)
              if len(batch) < 100:
                  break

          selected_comment, selected, _ = latest_exact_current_owner_request_v6(
              comments,
              repo=repo,
              pr=318,
              lane='LAB',
              head='c3e5bbd340b6da75c8fc80fa921becf01b0bc907',
              tree='867ec216722155c7ab97400b6891e64af1dde896',
              base='d1edc2eabb847c10a4faa59a039b480e85dfb0e4',
              main='d1edc2eabb847c10a4faa59a039b480e85dfb0e4',
          )
          assert selected_comment == 5628512577, selected_comment
          assert selected['request_id'] == 'pr318-current-main-preflight-read-resilience-lab-v3-main-d1edc2ea', selected
          assert sha256_json(selected) == 'b07b6371c6edfd5a0561f96316413d0daa88032bb71cdc8f7528c3cdad3a0680', sha256_json(selected)
          assert selected['supersedes_request_sha256'] == '35011c99d39be40fa80d4ca0abb41c7c57beee40c13a31486f44c045faf03917'

          duplicate_ids = []
          for item in comments:
              body = item.get('body') or ''
              if 'pr318-current-main-preflight-read-resilience-lab-v3-main-d1edc2ea' in body and '<!-- MULTIVERSE_REVIEW_REQUEST_V1 -->' in body:
                  duplicate_ids.append(item.get('id'))
          assert 5628512577 in duplicate_ids, duplicate_ids
          assert 5628564802 in duplicate_ids, duplicate_ids
          print('PR318_LIVE_DUPLICATE_V3_REPLAY=PASS')
          print('PR318_SELECTED_EARLIEST_COMMENT=5628512577')
          print('PR318_SELECTED_REQUEST_SHA256=b07b6371c6edfd5a0561f96316413d0daa88032bb71cdc8f7528c3cdad3a0680')
          PY

      - name: Terminal no-effect summary
        shell: bash
        run: |
          set -euo pipefail
          echo TERMINAL=PASS
          echo FORMAL_BUILD_CONSUMED=false
          echo OWNER_GATE=false
          echo PR318_MUTATION=false
          echo FIXED_STEPS_MUTATION=false
          echo MAIN_MUTATION=false
          echo PUBLICATION_ATTEMPTED=false
          echo RUNTIME=OFF
