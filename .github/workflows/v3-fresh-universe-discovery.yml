name: V3 Fresh Universe Discovery Preflight

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Prospective scan start date YYYY-MM-DD; blank = tomorrow JST"
        required: false
        default: ""
      horizon_days:
        description: "Future scan horizon (1..90)"
        required: false
        default: "45"
  push:
    paths:
      - "v3/fresh_universe_discovery.py"
      - ".github/workflows/v3-fresh-universe-discovery.yml"

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Resolve deterministic inputs
        id: inputs
        shell: bash
        env:
          INPUT_START: ${{ github.event.inputs.start_date || '' }}
          INPUT_HORIZON: ${{ github.event.inputs.horizon_days || '45' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_START" ]; then
            START="$INPUT_START"
          else
            START="$(TZ=Asia/Tokyo date -d '+1 day' +%F)"
          fi
          HORIZON="$INPUT_HORIZON"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "horizon=$HORIZON" >> "$GITHUB_OUTPUT"
          printf 'START=%s\nHORIZON=%s\n' "$START" "$HORIZON"

      - name: Run fail-closed PRE-only discovery
        run: |
          set -euo pipefail
          python v3/fresh_universe_discovery.py \
            --start "${{ steps.inputs.outputs.start }}" \
            --horizon-days "${{ steps.inputs.outputs.horizon }}" \
            --target 1000 \
            --out V3_FRESH_UNIVERSE_DISCOVERY

      - name: Show report
        run: cat V3_FRESH_UNIVERSE_DISCOVERY/DISCOVERY_REPORT.json

      - name: Upload immutable discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: V3_FRESH_UNIVERSE_DISCOVERY_${{ github.run_id }}
          path: V3_FRESH_UNIVERSE_DISCOVERY/
          if-no-files-found: error
          retention-days: 30
