name: Keirin HFT PRE Quarantine One-Shot

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-hft-quarantine-one-shot.yml'
      - 'tools/keirin_kdreams_historical_pre_quarantine_fetch_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hft-pre-quarantine:
    if: github.ref == 'refs/heads/research/keirin-real-evidence-dual-lane-20260901-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HFT_START: '2026-08-27'
      HFT_END: '2026-09-02'
      FETCHER_BLOB_SHA: '28e460cf84986180946056aaaf1118959a0c9181'
      FETCHER_PATH: 'tools/keirin_kdreams_historical_pre_quarantine_fetch_v2.py'
      DISCOVERY_OUT: 'v3/historical_all_market/research_candidates/KEIRIN_HFT_QUARANTINE_DAY1_DISCOVERY_20260904_v2.json'
      PRE_CSV: 'v3/historical_all_market/research_candidates/KEIRIN_HFT_QUARANTINE_PRE_ROWS_20260904_v2.csv'
      FETCH_RECEIPT: 'v3/historical_all_market/research_candidates/KEIRIN_HFT_QUARANTINE_FETCH_RECEIPT_20260904_v2.json'
      RUN_STATUS: 'v3/historical_all_market/research_candidates/KEIRIN_HFT_QUARANTINE_RUN_STATUS_20260904_v2.json'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/keirin-real-evidence-dual-lane-20260901-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install --quiet beautifulsoup4

      - name: Verify canonical quarantine fetcher and offline guards
        run: |
          set -euo pipefail
          actual="$(git hash-object "$FETCHER_PATH")"
          test "$actual" = "$FETCHER_BLOB_SHA"
          python "$FETCHER_PATH" selftest > /tmp/hft_selftest.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/hft_selftest.json',encoding='utf-8'))
          if x.get('status') != 'PASS' or not all(x.get('tests',{}).values()):
              raise SystemExit('FAIL_CLOSED:selftest')
          if x.get('network_access') is not False or x.get('race_id_guessing') is not False:
              raise SystemExit('FAIL_CLOSED:selftest_firewall')
          print('HFT_FETCHER_V2_SELFTEST_PASS')
          PY

      - name: Discover positively linked Day1 blocks without result access
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DISCOVERY_OUT")"
          python "$FETCHER_PATH" discover \
            --archive-url https://keirin.kdreams.jp/hofu/racecard/ \
            --archive-url https://keirin.kdreams.jp/toyama/racecard/ \
            --archive-url https://keirin.kdreams.jp/nara/racecard/ \
            --archive-url https://keirin.kdreams.jp/aomori/racecard/ \
            --archive-url https://keirin.kdreams.jp/takeo/racecard/ \
            --archive-url https://keirin.kdreams.jp/toyohashi/racecard/ \
            --archive-url https://keirin.kdreams.jp/kawasaki/racecard/ \
            --start "$HFT_START" --end "$HFT_END" --out "$DISCOVERY_OUT" --timeout 25

      - name: Validate discovery manifest fail-closed
        run: |
          python - <<'PY'
          import json, os
          from datetime import date
          from urllib.parse import urlparse
          p=os.environ['DISCOVERY_OUT']; x=json.load(open(p,encoding='utf-8'))
          allowed={'防府','富山','奈良','青森','武雄','豊橋','川崎'}
          lo=date.fromisoformat(os.environ['HFT_START']); hi=date.fromisoformat(os.environ['HFT_END'])
          if x.get('raw_html_emitted') is not False or x.get('result_fields_emitted') is not False or x.get('odds_fields_emitted') is not False or x.get('forecast_fields_emitted') is not False or x.get('race_id_guessed') is not False:
              raise SystemExit('FAIL_CLOSED:discovery_firewall')
          for b in x.get('blocks',[]):
              d=date.fromisoformat(b['race_date'])
              if not (lo <= d <= hi) or b.get('venue') not in allowed:
                  raise SystemExit('FAIL_CLOSED:block_scope')
              u=urlparse(b['day_url'])
              if u.scheme!='https' or u.hostname!='keirin.kdreams.jp' or u.query or u.fragment:
                  raise SystemExit('FAIL_CLOSED:day_url')
              if b.get('day1_confirmed'):
                  if not 5 <= int(b.get('detail_count',0)) <= 12:
                      raise SystemExit('FAIL_CLOSED:day1_detail_count')
                  if b.get('discovery_path') not in {'ARCHIVE_INDEX_DAY_HREF','EXPLICIT_INITIAL_DAY_HREF_FROM_SEED'}:
                      raise SystemExit('FAIL_CLOSED:discovery_path')
                  for s in b.get('detail_urls',[]):
                      u=urlparse(s)
                      if u.scheme!='https' or u.hostname!='keirin.kdreams.jp' or u.query or u.fragment or '/racedetail/' not in u.path:
                          raise SystemExit('FAIL_CLOSED:detail_url')
          print(json.dumps({'confirmed_day1_blocks':x.get('confirmed_day1_blocks',0),'explicit_initial_day_hrefs_followed':x.get('explicit_initial_day_hrefs_followed',0),'discovery_failures':len(x.get('failures',[]))},sort_keys=True))
          PY

      - name: Acquire strict PRE allowlist only
        run: |
          set +e
          python "$FETCHER_PATH" acquire \
            --manifest "$DISCOVERY_OUT" --pre-csv "$PRE_CSV" --receipt "$FETCH_RECEIPT" --timeout 25
          rc=$?
          echo "ACQUIRE_RC=$rc" >> "$GITHUB_ENV"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi
          exit 0

      - name: Verify PRE-only outputs and create sanitized run status
        run: |
          python - <<'PY'
          import csv, hashlib, json, os, re
          from datetime import date
          from pathlib import Path
          from urllib.parse import urlparse
          allowed_fields=['race_id','race_date','venue','race_no','car_no','rider_name_raw','class','style','competition_score','S','B','nige','makuri','sashi','mark','source_url','source_file_sha256','evidence_role']
          allowed_venues={'防府','富山','奈良','青森','武雄','豊橋','川崎'}
          lo=date.fromisoformat(os.environ['HFT_START']); hi=date.fromisoformat(os.environ['HFT_END'])
          rows=[]
          with open(os.environ['PRE_CSV'],encoding='utf-8',newline='') as f:
              r=csv.DictReader(f)
              if r.fieldnames != allowed_fields:
                  raise SystemExit('FAIL_CLOSED:csv_schema')
              for row in r:
                  if not (lo <= date.fromisoformat(row['race_date']) <= hi): raise SystemExit('FAIL_CLOSED:row_date')
                  if row['venue'] not in allowed_venues: raise SystemExit('FAIL_CLOSED:row_venue')
                  if float(row['competition_score']) == 0.0: raise SystemExit('FAIL_CLOSED:zero_score')
                  u=urlparse(row['source_url'])
                  if u.scheme!='https' or u.hostname!='keirin.kdreams.jp' or u.query or u.fragment or '/racedetail/' not in u.path: raise SystemExit('FAIL_CLOSED:source_url')
                  if not re.fullmatch(r'[0-9a-f]{64}',row['source_file_sha256']): raise SystemExit('FAIL_CLOSED:sha256')
                  rows.append(row)
          discovery=json.load(open(os.environ['DISCOVERY_OUT'],encoding='utf-8'))
          receipt=json.load(open(os.environ['FETCH_RECEIPT'],encoding='utf-8'))
          required_false=['raw_html_written_to_disk','raw_html_printed','result_fields_emitted','payout_fields_emitted','odds_fields_emitted','forecast_fields_emitted','narabiyoso_fields_emitted','race_id_guessed','support_increment_authorized_by_tool']
          if any(receipt.get(k) is not False for k in required_false): raise SystemExit('FAIL_CLOSED:receipt_firewall')
          if receipt.get('pre_rows') != len(rows): raise SystemExit('FAIL_CLOSED:row_count_mismatch')
          rejected=len(receipt.get('rejected',[])); failures=len(discovery.get('failures',[])); blocks=int(discovery.get('confirmed_day1_blocks',0)); races=int(receipt.get('successful_races',0)); followed=int(discovery.get('explicit_initial_day_hrefs_followed',0))
          status='PRE_ONLY_MEMBERSHIP_FROZEN_IDENTITY_MAPPING_PENDING' if races>0 and rejected==0 else ('PRE_ONLY_PARTIAL_FAIL_CLOSED_NO_SUPPORT' if races>0 else 'NO_ACCEPTED_RACES_SUPPORT_UNCHANGED')
          wrapper={
            'record':'KEIRIN_HFT_QUARANTINE_RUN_STATUS_20260904_v2',
            'status':status,
            'scope':'RIDER_X_CIRCUMFERENCE_HISTORICAL_PIT_PRE_ACQUISITION_ONLY',
            'branch':'research/keirin-real-evidence-dual-lane-20260901-v1',
            'date_window':[os.environ['HFT_START'],os.environ['HFT_END']],
            'venue_pool':{'333_or_333_33m':['防府','富山','奈良'],'400m':['青森','武雄','豊橋','川崎']},
            'quarantine_fetcher_path':os.environ['FETCHER_PATH'],
            'quarantine_fetcher_git_blob':os.environ['FETCHER_BLOB_SHA'],
            'selftest_status':'PASS',
            'confirmed_day1_blocks':blocks,
            'explicit_initial_day_hrefs_followed':followed,
            'successful_races':races,
            'pre_rows':len(rows),
            'rejected_races':rejected,
            'discovery_failures':failures,
            'acquire_return_code':int(os.environ.get('ACQUIRE_RC','0')),
            'pre_csv_sha256':hashlib.sha256(Path(os.environ['PRE_CSV']).read_bytes()).hexdigest(),
            'discovery_manifest_sha256':hashlib.sha256(Path(os.environ['DISCOVERY_OUT']).read_bytes()).hexdigest(),
            'fetch_receipt_sha256':hashlib.sha256(Path(os.environ['FETCH_RECEIPT']).read_bytes()).hexdigest(),
            'raw_html_persisted':False,
            'raw_html_printed':False,
            'race_id_guessed':False,
            'target_result_accessed':False,
            'payout_accessed':False,
            'support_increment_authorized_now':0,
            'identity_mapping_status':'PENDING_FAIL_CLOSED',
            'result_join_authorized':False,
            'model_fit_authorized':False,
            'main_or_runtime_mutation':False,
            'hard_boundaries':['NO_RESULT_JOIN','NO_RACE_ID_GUESSING','NO_RAW_MIXED_HTML_PERSISTENCE','NO_SUPPORT_COUNT_BEFORE_100_PERCENT_OFFICIAL_ID_MAPPING','NO_S0_MUTATION','NO_MODEL_PROMOTION','NO_REAL_MONEY_EXECUTION']
          }
          Path(os.environ['RUN_STATUS']).write_text(json.dumps(wrapper,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:wrapper[k] for k in ['status','confirmed_day1_blocks','explicit_initial_day_hrefs_followed','successful_races','pre_rows','rejected_races','discovery_failures','support_increment_authorized_now','target_result_accessed']},ensure_ascii=False,sort_keys=True))
          PY

      - name: Commit sanitized PRE acquisition artifacts only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DISCOVERY_OUT" "$PRE_CSV" "$FETCH_RECEIPT" "$RUN_STATUS"
          git diff --cached --quiet && exit 0
          git commit -m 'research(keirin): record HFT PRE quarantine acquisition v2'
          git push origin HEAD:research/keirin-real-evidence-dual-lane-20260901-v1
