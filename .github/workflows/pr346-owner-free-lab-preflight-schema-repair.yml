name: PR346 Owner-Free Lab Preflight Schema Repair

on:
  push:
    branches:
      - proof/pr346-owner-free-lab-preflight-schema-repair-20260911

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact repaired request preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=2bd2cde16e490c1f9d620121ed43c29e1f4fe77d
          TREE=0a2ee126916ed3f6b0da7eafcd9c19f664a5cca6
          MAIN=bb133e196efa818bc9b8dc59519c02796e70658e
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr346-owner-free-lab-preflight-schema-repair.yml"
          git checkout --detach "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          git fetch --no-tags origin "$MAIN"
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN"
          GH_TOKEN="$GH_TOKEN" PYTHONPATH=. python - <<'PY'
          import json, os, urllib.request
          from automation.review_dispatcher_v1.model_legacy_v1 import (
              REQUEST_KEYS, parse_request_from_comment, sha256_json, validate_request,
          )
          url='https://api.github.com/repos/fufufu1116/multiverse-research/issues/comments/5632796417'
          req=urllib.request.Request(url, headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'multiverse-pr346-schema-repair-preflight',
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              comment=json.load(r)
          request=parse_request_from_comment(comment.get('body') or '')
          assert isinstance(request, dict)
          missing=sorted(REQUEST_KEYS-set(request))
          extra=sorted(set(request)-REQUEST_KEYS)
          print('REQUEST_SHA256='+sha256_json(request))
          print('REQUEST_MISSING_KEYS='+json.dumps(missing))
          print('REQUEST_EXTRA_KEYS='+json.dumps(extra))
          assert missing == [], missing
          assert extra == [], extra
          validate_request(request)
          assert request['pr']==346
          assert request['head']=='2bd2cde16e490c1f9d620121ed43c29e1f4fe77d'
          assert request['tree']=='0a2ee126916ed3f6b0da7eafcd9c19f664a5cca6'
          assert request['base']=='bb133e196efa818bc9b8dc59519c02796e70658e'
          assert request['main']=='bb133e196efa818bc9b8dc59519c02796e70658e'
          assert request['supersedes_request_sha256'] is None
          assert sum(item['count'] for item in request['recipe']['unittest_modules']) == 149
          assert all(v is False for v in request['nonauthority'].values())
          print('PREFLIGHT_TERMINAL=READY')
          print('RUNTIME=OFF')
          PY
