name: Multiverse Security v3.3 Autopilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest cryptography google-genai
      - name: Run synthetic-only Gemini repair loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          AUTOPILOT_OUTPUT_DIR: autopilot_output
        run: python automation/security_v3_3/gemini_autopilot.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiverse-security-v3.3-autopilot-evidence
          path: autopilot_output
          if-no-files-found: warn
