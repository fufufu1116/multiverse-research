name: Keirin Quarantine All-Market Payout DOM Probe v1
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-quarantine-all-market-payout-dom-probe-v1.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Print payout table rows from quarantined race only
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from bs4 import BeautifulSoup
          import re
          u='https://keirin.kdreams.jp/kurume/racedetail/8320260327010001/'
          b=urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
          soup=BeautifulSoup(b.decode('utf-8','replace'),'html.parser')
          def c(s): return re.sub(r'\s+','',s or '')
          for i,t in enumerate(soup.find_all('table')):
              txt=c(t.get_text(' ',strip=True))
              if '2車連複' in txt and '3連勝複' in txt and 'ワイド' in txt:
                  print('TABLE',i,txt[:1000])
                  for j,tr in enumerate(t.find_all('tr')):
                      cells=[re.sub(r'\s+',' ',x.get_text(' ',strip=True)).strip() for x in tr.find_all(['th','td'])]
                      print('ROW',j,repr(cells))
          PY
