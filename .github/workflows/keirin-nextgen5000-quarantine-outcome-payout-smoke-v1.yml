name: Keirin NEXTGEN5000 Quarantined Race Outcome Payout Parser Smoke v1
on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - '.github/workflows/keirin-nextgen5000-quarantine-outcome-payout-smoke-v1.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Outcome-only parse quarantined position 2001
        run: |
          mkdir -p out
          python tools/keirin_nextgen5000_outcome_bulk_recovery_v1.py \
            --start-position 2001 --end-position 2001 --workers 1 \
            --outcome-csv out/QUARANTINE_OUTCOME_2001.csv \
            --receipt out/QUARANTINE_OUTCOME_2001_RECEIPT.json \
            --pre-freeze-attestation YES
      - name: Payout-only parse quarantined position 2001
        run: |
          python tools/keirin_nextgen5000_3renhuku_payout_bulk_recovery_v1.py \
            --start-position 2001 --end-position 2001 --workers 1 \
            --out-csv out/QUARANTINE_PAYOUT_2001.csv \
            --receipt out/QUARANTINE_PAYOUT_2001_RECEIPT.json \
            --pre-freeze-attestation YES
      - name: Structural assertions
        run: |
          python - <<'PY'
          import csv
          o=list(csv.DictReader(open('out/QUARANTINE_OUTCOME_2001.csv',encoding='utf-8')))
          p=list(csv.DictReader(open('out/QUARANTINE_PAYOUT_2001.csv',encoding='utf-8')))
          assert len(o)==len(p)==1
          assert o[0]['race_id']==p[0]['race_id']=='8320260327010001'
          assert len({o[0]['finish_1'],o[0]['finish_2'],o[0]['finish_3']})==3
          assert len(set(p[0]['winning_3renhuku_ticket'].split('=')))==3
          assert int(p[0]['payout_yen_per_100'])>=100
          print('PASS_OUTCOME',o[0])
          print('PASS_PAYOUT',p[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: keirin-nextgen5000-quarantine-outcome-payout-smoke-v1
          path: out/
          retention-days: 30
