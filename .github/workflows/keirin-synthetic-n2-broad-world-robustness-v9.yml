name: Keirin Synthetic N2 Broad-World Robustness v9

on:
  push:
    branches:
      - research/keirin-real-evidence-dual-lane-20260901-v1
    paths:
      - 'v3/historical_all_market/research_candidates/KEIRIN_SYNTHETIC_N2_BROAD_WORLD_ROBUSTNESS_PREREG_20260914_v9.json'
      - 'v3/historical_all_market/new_lineage/synthetic_n2_broad_world_robustness_v9.py'
      - '.github/workflows/keirin-synthetic-n2-broad-world-robustness-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-n2-broad-world-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh-check canonical main synthetic-only authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          echo "fresh canonical main: $(git rev-parse origin/main)"
          git show origin/main:KEIRIN_NOW.md | grep -F 'Synthetic（合成）限定' >/dev/null
          git show origin/main:v3/historical_all_market/governance/CURRENT_STATE_KEIRIN.json > /tmp/CURRENT_STATE_KEIRIN.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/CURRENT_STATE_KEIRIN.json',encoding='utf-8'))
          if x.get('status') != 'LIMITED_SYNTHETIC_SCIENTIFIC_EXECUTION_AUTHORIZED_POST_LAB_AUDITOR_OWNER_GATE':
              raise SystemExit('FAIL_CLOSED: canonical Keirin status is not limited synthetic authorization')
          if x.get('scientific_state',{}).get('ECON_HOLDOUT1000') != 'SEALED':
              raise SystemExit('FAIL_CLOSED: ECON_HOLDOUT1000 authority drift')
          print('CANONICAL_SYNTHETIC_ONLY_AUTHORITY_PASS')
          PY
      - name: Verify exact frozen hashes before synthetic scoring
        shell: bash
        run: |
          set -euo pipefail
          echo "a871efeac2433c11014960287c8ce5e4ab9c83211ef4420c6de2585bb369a875  v3/historical_all_market/research_candidates/KEIRIN_SYNTHETIC_N2_BROAD_WORLD_ROBUSTNESS_PREREG_20260914_v9.json" | sha256sum -c -
          echo "9505f54cfaed35fc62f2b1692b5d5c12e257b22ed7ee844a6b736c0e000961e9  v3/historical_all_market/new_lineage/synthetic_n2_broad_world_robustness_v9.py" | sha256sum -c -
          echo "758fab7b92ad4bb7c1d3dc22d77b9f19772f2442ec0a84ca2b4fd9103b40dc43  v3/historical_all_market/research_candidates/KEIRIN_SYNTHETIC_SPEC_ALIGNED_CONDITIONAL_PREREG_20260914_v6.json" | sha256sum -c -
          echo "4a3d7091dad23de2df4108bb3bae0846eb0b710fbb3953a20dabf7f1557501de  v3/historical_all_market/new_lineage/synthetic_spec_aligned_conditional_v6.py" | sha256sum -c -
      - name: Compile frozen synthetic components
        run: python -m py_compile v3/historical_all_market/new_lineage/synthetic_n2_broad_world_robustness_v9.py
      - name: Run preregistered N2 broad-world robustness audit
        run: python v3/historical_all_market/new_lineage/synthetic_n2_broad_world_robustness_v9.py
      - name: Upload synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keirin-synthetic-n2-broad-world-robustness-v9
          path: v3/historical_all_market/research_candidates/synthetic_n2_broad_world_robustness_v9/
          if-no-files-found: warn
          retention-days: 90
