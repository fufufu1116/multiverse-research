steps:
  - label: ":compass: Fixed Independent Auditor Dispatcher v3"
    key: "multiverse-fixed-independent-auditor-dispatcher-v3"
    agents:
      queue: "independent-auditor"
    command: |
      set -euo pipefail
      git fetch origin main:refs/remotes/origin/main
      git rev-parse --verify refs/remotes/origin/main^{commit}
      DISPATCHER_REF="$(git rev-parse refs/remotes/origin/main)"
      export MULTIVERSE_DISPATCHER_REF="$$DISPATCHER_REF"
      rm -rf .mv_dispatcher
      mkdir -p .mv_dispatcher
      git archive refs/remotes/origin/main automation/review_dispatcher_v1 \
        | tar -x -C .mv_dispatcher
      PYTHONPATH=.mv_dispatcher python3 -c 'import automation.review_dispatcher_v1.github_read_resilience_v1'
      PYTHONPATH=.mv_dispatcher python3 -c 'import automation.review_dispatcher_v1.dispatcher'
      PYTHONPATH=.mv_dispatcher python3 -c 'import automation.review_dispatcher_v1.review'
      PYTHONPATH=.mv_dispatcher python3 .mv_dispatcher/automation/review_dispatcher_v1/dispatcher.py \
        --lane AUDITOR \
        --repo fufufu1116/multiverse-research \
        --head "$$BUILDKITE_COMMIT" \
        --output review_job.json
      rm -f .mv_review_pass
      if PYTHONPATH=.mv_dispatcher python3 .mv_dispatcher/automation/review_dispatcher_v1/review.py \
        --job review_job.json \
        --output review_artifact.json \
        --repo-root .; then
        touch .mv_review_pass
      fi
      buildkite-agent artifact upload "review_job.json"
      if [ -f review_artifact.json ]; then
        buildkite-agent artifact upload "review_artifact.json"
      fi
      test -f .mv_review_pass

  - wait

  - label: ":github: Publish Fixed Independent Auditor Result v3"
    key: "multiverse-fixed-independent-auditor-publish-v3"
    agents:
      queue: "independent-auditor"
    checkout:
      skip: true
    secrets:
      - MULTIVERSE_INDEPENDENT_AUDITOR_PRIVATE_KEY
    command: |
      set -euo pipefail
      buildkite-agent artifact download "review_job.json" .
      buildkite-agent artifact download "review_artifact.json" .
      rm -rf .mv_dispatcher .mv_dispatcher_source
      git init -q .mv_dispatcher_source
      git -C .mv_dispatcher_source remote add origin https://github.com/fufufu1116/multiverse-research.git
      git -C .mv_dispatcher_source fetch -q --depth=1 origin main:refs/remotes/origin/main
      FRESH_DISPATCHER_REF="$(git -C .mv_dispatcher_source rev-parse refs/remotes/origin/main)"
      JOB_DISPATCHER_REF="$(python3 -c 'import json; print(json.load(open("review_job.json"))["dispatcher_ref"])')"
      test "$$FRESH_DISPATCHER_REF" = "$$JOB_DISPATCHER_REF"
      mkdir -p .mv_dispatcher
      git -C .mv_dispatcher_source archive refs/remotes/origin/main automation/review_dispatcher_v1 \
        | tar -x -C .mv_dispatcher
      PYTHONPATH=.mv_dispatcher python3 -c 'import automation.review_dispatcher_v1.publisher'
      PYTHONPATH=.mv_dispatcher python3 .mv_dispatcher/automation/review_dispatcher_v1/publisher.py \
        --job review_job.json \
        --artifact review_artifact.json \
        --receipt review_publish_receipt.json
      buildkite-agent artifact upload "review_publish_receipt.json"

  - wait

  - label: ":lock: Fixed T2 v3"
    key: "multiverse-fixed-independent-auditor-t2-v3"
    agents:
      queue: "independent-auditor"
    checkout:
      skip: true
    secrets:
      - MULTIVERSE_INDEPENDENT_AUDITOR_PRIVATE_KEY
    command: |
      set -euo pipefail
      buildkite-agent artifact download "review_job.json" .
      buildkite-agent artifact download "review_artifact.json" .
      buildkite-agent artifact download "review_publish_receipt.json" .
      rm -rf .mv_dispatcher .mv_dispatcher_source
      git init -q .mv_dispatcher_source
      git -C .mv_dispatcher_source remote add origin https://github.com/fufufu1116/multiverse-research.git
      git -C .mv_dispatcher_source fetch -q --depth=1 origin main:refs/remotes/origin/main
      FRESH_DISPATCHER_REF="$(git -C .mv_dispatcher_source rev-parse refs/remotes/origin/main)"
      JOB_DISPATCHER_REF="$(python3 -c 'import json; print(json.load(open("review_job.json"))["dispatcher_ref"])')"
      test "$$FRESH_DISPATCHER_REF" = "$$JOB_DISPATCHER_REF"
      mkdir -p .mv_dispatcher
      git -C .mv_dispatcher_source archive refs/remotes/origin/main automation/review_dispatcher_v1 \
        | tar -x -C .mv_dispatcher
      PYTHONPATH=.mv_dispatcher python3 -c 'import automation.review_dispatcher_v1.t2'
      PYTHONPATH=.mv_dispatcher python3 .mv_dispatcher/automation/review_dispatcher_v1/t2.py \
        --job review_job.json \
        --artifact review_artifact.json \
        --receipt review_publish_receipt.json \
        --output t2_publish_receipt.json
      buildkite-agent artifact upload "t2_publish_receipt.json"
