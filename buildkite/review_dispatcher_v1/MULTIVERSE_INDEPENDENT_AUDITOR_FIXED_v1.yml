steps:
  - label: ":compass: Fixed Independent Auditor Dispatcher v1"
    key: "multiverse-fixed-independent-auditor-dispatcher-v1"

    agents:
      queue: "independent-auditor"

    command: |
      set -euo pipefail

      git fetch origin main
      DISPATCHER_REF="$(git rev-parse FETCH_HEAD)"
      export MULTIVERSE_DISPATCHER_REF="$$DISPATCHER_REF"

      rm -rf .mv_dispatcher
      mkdir -p .mv_dispatcher

      git archive "$$DISPATCHER_REF" automation/review_dispatcher_v1 \
        | tar -x -C .mv_dispatcher

      PYTHONPATH=.mv_dispatcher \
        python3 .mv_dispatcher/automation/review_dispatcher_v1/dispatcher.py \
        --lane AUDITOR \
        --repo fufufu1116/multiverse-research \
        --head "$$BUILDKITE_COMMIT" \
        --output review_job.json

      rm -f .mv_review_pass
      if PYTHONPATH=.mv_dispatcher \
        python3 .mv_dispatcher/automation/review_dispatcher_v1/review_main_drift_v1.py \
        --job review_job.json \
        --output review_artifact.json \
        --repo-root .; then
        touch .mv_review_pass
      fi

      buildkite-agent artifact upload \
        "review_job.json"

      if [ -f review_artifact.json ]; then
        buildkite-agent artifact upload \
          "review_artifact.json"
      fi

      test -f .mv_review_pass

  - wait

  - label: ":github: Publish Fixed Independent Auditor Result v1"
    key: "multiverse-fixed-independent-auditor-publish-v1"

    agents:
      queue: "independent-auditor"

    checkout:
      skip: true

    secrets:
      - MULTIVERSE_INDEPENDENT_AUDITOR_PRIVATE_KEY

    command: |
      set -euo pipefail

      buildkite-agent artifact download \
        "review_job.json" .

      buildkite-agent artifact download \
        "review_artifact.json" .

      JOB_DISPATCHER_REF="$(python3 -c 'import json; print(json.load(open("review_job.json"))["dispatcher_ref"])')"

      rm -rf .mv_dispatcher .mv_dispatcher_source
      git init -q .mv_dispatcher_source
      git -C .mv_dispatcher_source remote add origin \
        https://github.com/fufufu1116/multiverse-research.git
      git -C .mv_dispatcher_source fetch -q --depth=65 origin main
      git -C .mv_dispatcher_source cat-file -e "$$JOB_DISPATCHER_REF^{commit}"

      mkdir -p .mv_dispatcher
      git -C .mv_dispatcher_source archive \
        "$$JOB_DISPATCHER_REF" automation/review_dispatcher_v1 \
        | tar -x -C .mv_dispatcher

      PYTHONPATH=.mv_dispatcher \
        python3 .mv_dispatcher/automation/review_dispatcher_v1/publisher_main_drift_v1.py \
        --job review_job.json \
        --artifact review_artifact.json \
        --receipt review_publish_receipt.json

      buildkite-agent artifact upload \
        "review_publish_receipt.json"

  - wait

  - label: ":lock: Fixed T2 v1"
    key: "multiverse-fixed-independent-auditor-t2-v1"

    agents:
      queue: "independent-auditor"

    checkout:
      skip: true

    secrets:
      - MULTIVERSE_INDEPENDENT_AUDITOR_PRIVATE_KEY

    command: |
      set -euo pipefail

      buildkite-agent artifact download \
        "review_job.json" .

      buildkite-agent artifact download \
        "review_artifact.json" .

      buildkite-agent artifact download \
        "review_publish_receipt.json" .

      JOB_DISPATCHER_REF="$(python3 -c 'import json; print(json.load(open("review_job.json"))["dispatcher_ref"])')"

      rm -rf .mv_dispatcher .mv_dispatcher_source
      git init -q .mv_dispatcher_source
      git -C .mv_dispatcher_source remote add origin \
        https://github.com/fufufu1116/multiverse-research.git
      git -C .mv_dispatcher_source fetch -q --depth=65 origin main
      git -C .mv_dispatcher_source cat-file -e "$$JOB_DISPATCHER_REF^{commit}"

      mkdir -p .mv_dispatcher
      git -C .mv_dispatcher_source archive \
        "$$JOB_DISPATCHER_REF" automation/review_dispatcher_v1 \
        | tar -x -C .mv_dispatcher

      PYTHONPATH=.mv_dispatcher \
        python3 .mv_dispatcher/automation/review_dispatcher_v1/t2_main_drift_v1.py \
        --job review_job.json \
        --artifact review_artifact.json \
        --receipt review_publish_receipt.json \
        --output t2_publish_receipt.json

      buildkite-agent artifact upload \
        "t2_publish_receipt.json"
